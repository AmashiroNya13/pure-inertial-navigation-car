<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>节点坐标图</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232368c4'/%3E%3Cpath d='M12 48h40M16 42V14M16 42L48 18' stroke='white' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='42' r='5' fill='%23158a83'/%3E%3Cpath d='M48 13l5 5l-5 5l-5-5z' fill='%23f7b955'/%3E%3Cpath d='M30 26l5 10H25z' fill='%23ff8390'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-soft: #f9fafb;
    --line: #d9dee7;
    --line-strong: #bac3d1;
    --text: #1e2530;
    --muted: #677181;
    --blue: #2368c4;
    --node-orange: #f28c18;
    --node-red: #d12f3d;
    --node-black: #111827;
    --red: #c33646;
    --focus: rgba(35, 104, 196, 0.18);
    --shadow: 0 18px 50px rgba(33, 42, 58, 0.09);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(246, 247, 249, 0.96)),
      repeating-linear-gradient(0deg, transparent 0 31px, rgba(94, 110, 130, 0.07) 31px 32px),
      repeating-linear-gradient(90deg, transparent 0 31px, rgba(94, 110, 130, 0.07) 31px 32px),
      var(--bg);
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
  }

  button {
    min-height: 36px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    padding: 0 12px;
    color: var(--text);
    background: #fff;
    cursor: pointer;
  }

  button.primary {
    border-color: var(--blue);
    color: #fff;
    background: var(--blue);
  }

  button.active {
    border-color: var(--blue);
    color: var(--blue);
    background: rgba(35, 104, 196, 0.1);
  }

  button.danger {
    border-color: rgba(195, 54, 70, 0.42);
    color: var(--red);
  }

  button:hover {
    filter: brightness(0.98);
  }

  input,
  select,
  textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text);
    background: #fff;
    outline: none;
  }

  input,
  select {
    height: 36px;
    padding: 0 9px;
  }

  textarea {
    min-height: 136px;
    resize: vertical;
    padding: 10px 12px;
    line-height: 1.58;
    font-family: Consolas, "SFMono-Regular", monospace;
  }

  input:focus,
  select:focus,
  textarea:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 4px var(--focus);
  }

  .shell {
    width: min(1440px, calc(100% - 28px));
    margin: 0 auto;
    padding: 20px 0 28px;
  }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 16px;
  }

  h1 {
    margin: 0;
    font-size: clamp(24px, 3.4vw, 44px);
    line-height: 1.06;
    letter-spacing: 0;
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 30px;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0 10px;
    background: rgba(255, 255, 255, 0.82);
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(340px, 430px) minmax(0, 1fr);
    gap: 14px;
    align-items: start;
  }

  .panel {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.92);
    box-shadow: var(--shadow);
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 14px;
    border-bottom: 1px solid var(--line);
    background: rgba(249, 250, 251, 0.92);
  }

  .panel-title {
    margin: 0;
    font-size: 16px;
    font-weight: 750;
  }

  .panel-body {
    padding: 14px;
  }

  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .field {
    display: grid;
    gap: 6px;
  }

  .field.full {
    grid-column: 1 / -1;
  }

  label,
  .label {
    color: var(--muted);
    font-size: 13px;
    font-weight: 650;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  .legend {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin-top: 12px;
  }

  .legend-item {
    min-height: 42px;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px;
    background: var(--panel-soft);
    color: var(--muted);
    font-size: 13px;
  }

  .mark {
    flex: 0 0 18px;
    width: 18px;
    height: 18px;
    display: inline-block;
  }

  .mark.type-0 {
    border: 3px solid var(--node-orange);
    background: rgba(242, 140, 24, 0.16);
  }

  .mark.type-1 {
    border: 3px solid var(--node-red);
    background: rgba(209, 47, 61, 0.14);
  }

  .mark.type-2 {
    border: 3px solid var(--node-black);
    border-radius: 50%;
    background: rgba(17, 24, 39, 0.12);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    margin-top: 12px;
  }

  .stat {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px;
    background: #fff;
  }

  .stat b {
    display: block;
    margin-top: 4px;
    font-size: 22px;
  }

  .table-wrap {
    max-height: 360px;
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th,
  td {
    border-bottom: 1px solid #edf0f4;
    padding: 8px;
    text-align: left;
    white-space: nowrap;
  }

  th {
    position: sticky;
    top: 0;
    z-index: 1;
    color: var(--muted);
    background: #f9fafb;
    font-weight: 700;
  }

  tr:last-child td {
    border-bottom: 0;
  }

  .plot-card {
    overflow: hidden;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .toggles {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    color: var(--muted);
    font-size: 13px;
  }

  .toggles label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .toggles input {
    width: 16px;
    height: 16px;
  }

  .canvas-wrap {
    position: relative;
    height: min(72vh, 760px);
    min-height: 460px;
    border-top: 1px solid var(--line);
    background: #fff;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .readout {
    position: absolute;
    left: 12px;
    bottom: 12px;
    max-width: calc(100% - 24px);
    border: 1px solid rgba(217, 222, 231, 0.9);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.9);
    box-shadow: 0 10px 28px rgba(33, 42, 58, 0.08);
    font-size: 13px;
  }

  .readout b {
    color: var(--text);
  }

  .error {
    min-height: 20px;
    margin-top: 8px;
    color: var(--red);
    font-size: 13px;
    line-height: 1.5;
  }

  .empty {
    color: var(--muted);
    text-align: center;
  }

  .line-hint {
    min-height: 28px;
    display: flex;
    align-items: center;
    margin-top: 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 9px;
    color: var(--muted);
    background: var(--panel-soft);
    font-size: 13px;
  }

  .segment-offset-panel {
    display: grid;
    gap: 10px;
    margin-top: 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px;
    background: var(--panel-soft);
  }

  .segment-offset-panel[hidden] {
    display: none;
  }

  .segment-offset-fields {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }

  .segment-offset-status {
    min-height: 20px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
  }

  .analysis-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(180px, 1fr));
    gap: 12px;
    align-items: end;
  }

  .route-summary {
    grid-column: 1 / -1;
    min-height: 38px;
    display: flex;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--muted);
    background: var(--panel-soft);
    line-height: 1.5;
  }

  .route-ranking {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 8px;
  }

  .route-ranking button {
    min-height: 62px;
    height: auto;
    padding: 8px 10px;
    white-space: normal;
    text-align: left;
    line-height: 1.35;
  }

  .route-ranking button.active {
    color: #fff;
    border-color: var(--blue);
    background: var(--blue);
  }

  .route-ranking .rank-number {
    display: block;
    margin-bottom: 3px;
    font-weight: 800;
  }

  .route-edge-details {
    grid-column: 1 / -1;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
  }

  .route-edge-details summary {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 38px;
    padding: 0 10px;
    cursor: pointer;
    color: var(--text);
    font-weight: 700;
  }

  .route-edge-details summary small {
    color: var(--muted);
    font-weight: 400;
  }

  .route-edge-content {
    padding: 0 10px 10px;
    border-top: 1px solid var(--line);
  }

  .route-edge-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 0;
    color: var(--muted);
    font-size: 12px;
  }

  #routeEdgeText {
    min-height: 180px;
    max-height: 420px;
    margin: 0;
  }

  .speed-legend {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    color: var(--muted);
    font-size: 12px;
  }

  .accel-readout {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--muted);
    background: #fff;
    font-size: 13px;
  }

  .accel-readout b {
    color: var(--text);
    font-weight: 650;
  }

  .speed-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .speed-swatch {
    width: 22px;
    height: 8px;
    border-radius: 999px;
    border: 1px solid rgba(30, 37, 48, 0.16);
  }

  textarea.export {
    min-height: 220px;
    margin-top: 12px;
  }

  @media (max-width: 980px) {
    .layout {
      grid-template-columns: 1fr;
    }

    .route-ranking {
      grid-template-columns: 1fr;
    }

    .route-edge-actions {
      align-items: stretch;
      flex-direction: column;
    }

    .route-edge-actions button {
      width: 100%;
    }

    .canvas-wrap {
      height: 62vh;
      min-height: 390px;
    }
  }

  @media (max-width: 620px) {
    .shell {
      width: min(100% - 18px, 1440px);
      padding-top: 12px;
    }

    header {
      align-items: flex-start;
      flex-direction: column;
    }

    .field-grid,
    .analysis-grid,
    .legend,
    .stats {
      grid-template-columns: 1fr;
    }

    .segment-offset-fields {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<main class="shell">
  <header>
    <div>
      <h1>节点坐标图</h1>
    </div>
    <div class="meta" aria-live="polite">
      <span class="pill" id="totalPill">0 个节点</span>
      <span class="pill" id="linePill">0 条连线</span>
      <span class="pill">单位 mm</span>
    </div>
  </header>

  <div class="layout">
    <section class="panel">
      <div class="panel-head">
        <h2 class="panel-title">输入节点</h2>
        <button id="sampleBtn" type="button">示例</button>
      </div>
      <div class="panel-body">
        <div class="field-grid">
          <div class="field full">
            <label for="bulkInput">批量数据（每行：X,Y；类型可选；X/Y 支持 + - * /；自动编号 P1...）</label>
            <textarea id="bulkInput" spellcheck="false"></textarea>
          </div>
          <div class="field full">
            <label for="linkInput">手动连线（可写 1-2，或直接点选节点）</label>
            <textarea id="linkInput" spellcheck="false"></textarea>
          </div>
          <div class="field full">
            <label for="nodeTypeSelect">选中节点类型</label>
            <select id="nodeTypeSelect" disabled>
              <option value="">先点击节点</option>
              <option value="0">0 直道元素节点</option>
              <option value="1">1 弯道元素节点</option>
              <option value="2">2 弯道节点</option>
            </select>
          </div>
          <div class="field">
            <label for="gridStep">网格间距 mm</label>
            <input id="gridStep" type="number" min="1" step="1" value="100">
          </div>
          <div class="field">
            <label for="pointSize">标记尺寸</label>
            <input id="pointSize" type="number" min="4" max="24" step="1" value="9">
          </div>
        </div>

        <div class="actions">
          <button id="drawBtn" type="button" class="primary">绘制</button>
          <button id="lineModeBtn" type="button" class="active">点选连线</button>
          <button id="segmentOffsetModeBtn" type="button">线段批量偏移</button>
          <button id="undoLineBtn" type="button">撤销连线</button>
          <button id="clearLinesBtn" type="button">清空连线</button>
          <button id="fitBtn" type="button">适配视图</button>
          <button id="pngBtn" type="button">导出 PNG</button>
          <button id="clearBtn" type="button" class="danger">清空</button>
        </div>
        <div class="actions">
          <button id="manualCorrectionZoneBtn" type="button">Manual exclusion zone</button>
        </div>
        <div class="segment-offset-panel" id="manualCorrectionZonePanel" hidden>
          <div class="segment-offset-fields">
            <div class="field">
              <label for="manualCorrectionZoneRadius">Exclusion radius cm</label>
              <input id="manualCorrectionZoneRadius" type="number" min="1" step="1" value="20">
            </div>
            <div class="field">
              <label for="manualCorrectionZoneEntry">Entry extension cm</label>
              <input id="manualCorrectionZoneEntry" type="number" min="0" step="1" value="21">
            </div>
            <div class="field">
              <label for="manualCorrectionZoneExit">Exit extension cm</label>
              <input id="manualCorrectionZoneExit" type="number" min="0" step="1" value="25">
            </div>
          </div>
          <div class="segment-offset-status" id="manualCorrectionZoneStatus">Click the map to add an exclusion zone.</div>
          <div class="actions" style="margin-top:0">
            <button id="manualCorrectionZoneClearBtn" type="button" class="danger" disabled>Clear zones</button>
          </div>
        </div>
        <div class="segment-offset-panel" id="segmentOffsetPanel" hidden>
          <div class="segment-offset-fields">
            <div class="field">
              <label for="segmentOffsetX">X 偏移 mm</label>
              <input id="segmentOffsetX" type="number" step="1" value="0">
            </div>
            <div class="field">
              <label for="segmentOffsetY">Y 偏移 mm</label>
              <input id="segmentOffsetY" type="number" step="1" value="0">
            </div>
            <div class="field">
              <label for="segmentOffsetTolerance">贴线容差 mm</label>
              <input id="segmentOffsetTolerance" type="number" min="0" step="1" value="10">
            </div>
          </div>
          <div class="segment-offset-status" id="segmentOffsetStatus">请点击线段的第一个端点</div>
          <div class="actions" style="margin-top:0">
            <button id="segmentOffsetApplyBtn" type="button" class="primary" disabled>确认偏移</button>
            <button id="segmentOffsetCancelBtn" type="button">取消选择</button>
            <button id="segmentOffsetUndoBtn" type="button" disabled>撤销偏移</button>
          </div>
        </div>
        <div class="line-hint" id="lineHint">选择第一个节点</div>
        <div class="error" id="errorBox" role="status"></div>

        <div class="legend" aria-label="节点类型图例">
          <div class="legend-item"><span class="mark type-0"></span><span>0 直道元素节点</span></div>
          <div class="legend-item"><span class="mark type-1"></span><span>1 弯道元素节点</span></div>
          <div class="legend-item"><span class="mark type-2"></span><span>2 弯道节点</span></div>
        </div>

        <div class="stats">
          <div class="stat"><span class="label">直道元素节点</span><b id="count0">0</b></div>
          <div class="stat"><span class="label">弯道元素节点</span><b id="count1">0</b></div>
          <div class="stat"><span class="label">弯道节点</span><b id="count2">0</b></div>
        </div>
      </div>
    </section>

    <section class="panel plot-card">
      <div class="panel-head toolbar">
        <h2 class="panel-title">坐标图</h2>
        <div class="toggles">
          <label><input id="showCorrectionExclusionZones" type="checkbox">Show correction exclusion</label>
          <label><input id="showLabels" type="checkbox">图中文字</label>
          <label><input id="equalScale" type="checkbox" checked>等比例</label>
          <label><input id="invertY" type="checkbox">Y 向下</label>
        </div>
      </div>
      <div class="canvas-wrap">
        <canvas id="plot" aria-label="节点坐标图"></canvas>
        <div class="readout" id="readout">移动到图上查看坐标</div>
      </div>
    </section>
  </div>

  <section class="panel" style="margin-top:14px">
    <div class="panel-head">
      <h2 class="panel-title">节点列表</h2>
    </div>
    <div class="panel-body">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>自动编号</th>
              <th>X mm</th>
              <th>Y mm</th>
              <th>类型</th>
              <th>类型名称</th>
              <th>连接数</th>
            </tr>
          </thead>
          <tbody id="nodeTable">
            <tr><td colspan="6" class="empty">暂无节点</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="panel" style="margin-top:14px">
    <div class="panel-head">
      <h2 class="panel-title">路径分析 / 导出给 AI</h2>
    </div>
    <div class="panel-body">
      <div class="analysis-grid">
        <div class="field">
          <label for="startNodeSelect">起点</label>
          <select id="startNodeSelect"></select>
        </div>
        <div class="field">
          <label for="routeModeSelect">解法</label>
          <select id="routeModeSelect">
            <option value="exact">精确最短候选</option>
            <option value="fastest">智能最快闭环</option>
            <option value="greedy">快速贪心</option>
            <option value="optimized">大图深度优化</option>
            <option value="manual">手动顺序规划</option>
          </select>
        </div>
        <div class="field" id="optimizerDurationField" hidden>
          <label for="optimizerDurationSelect">深度优化时间</label>
          <select id="optimizerDurationSelect">
            <option value="5">5 秒</option>
            <option value="30">30 秒</option>
            <option value="60">1 分钟</option>
            <option value="300" selected>5 分钟</option>
            <option value="3600">1 小时</option>
            <option value="21600">6 小时</option>
          </select>
        </div>
        <div class="field" id="optimizerPreviewField" hidden>
          <label for="optimizerPreviewSelect">运行中候选刷新</label>
          <select id="optimizerPreviewSelect">
            <option value="3">每 3 秒</option>
            <option value="5" selected>每 5 秒</option>
            <option value="10">每 10 秒</option>
            <option value="30">每 30 秒</option>
            <option value="60">每 1 分钟</option>
          </select>
        </div>
        <div class="field" id="optimizerRankingField" hidden>
          <label for="optimizerRankingSelect">深度优化排名</label>
          <select id="optimizerRankingSelect">
            <option value="fastest" selected>最快时间优先</option>
            <option value="stable">少反向弯优先</option>
            <option value="shortest">最短距离优先</option>
          </select>

function splitNodeParts(line) {
  if (/[，,；;]/.test(line)) {
    return line.split(/[，,；;]/).map((part) => part.trim()).filter(Boolean);
  }
  return line.split(/\s+/).filter(Boolean);
}

function evaluateCoordinateExpression(text) {
  const expression = String(text).trim();
  if (!expression || !/^[\d+\-*/.\s]+$/.test(expression)) {
    return NaN;
  }

  const normalized = expression.replace(/\s+/g, "");
  if (!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[+\-*/](?:\d+(?:\.\d*)?|\.\d+))*$/.test(normalized)) {
    return NaN;
  }

  const tokens = normalized.match(/[+\-*/]?[^+\-*/]+/g);
  if (!tokens) {
    return NaN;
  }

  const values = [];
  const operators = [];

  tokens.forEach((token, index) => {
    const first = token[0];
    const hasOperator = "+-*/".includes(first);
    const operator = hasOperator ? first : "+";
    const rawNumber = hasOperator ? token.slice(1) : token;
    const number = Number(rawNumber);

    if (!Number.isFinite(number)) {
      values.push(NaN);
      return;
    }

    if (index === 0 && (operator === "*" || operator === "/")) {
      values.push(NaN);
      return;
    }

    if (operator === "*") {
      values[values.length - 1] *= number;
    } else if (operator === "/") {
      if (number === 0) {
        values.push(NaN);
        return;
      }
      values[values.length - 1] /= number;
    } else {
      operators.push(operator);
      values.push(number);
    }
  });

  if (values.some((value) => !Number.isFinite(value))) {
    return NaN;
  }

  return values.reduce((sum, value, index) => {
    return operators[index] === "-" ? sum - value : sum + value;
  }, 0);
}

function parseNodes(text) {
  const rows = text.split(/\r?\n/);
  const nodes = [];
  const errors = [];

  rows.forEach((rawLine, index) => {
    const line = rawLine.trim();
    if (!line || line.startsWith("#")) {
      return;
    }

    const parts = splitNodeParts(line);
    const first = parts[0] ? parts[0].toLowerCase() : "";
    if (index === 0 && (first === "name" || first === "x" || first === "名称")) {
      return;
    }

    let name = "";
    let xText = "";
    let yText = "";
    let typeText = "";

    if (parts.length >= 4 && Number.isNaN(Number(parts[0]))) {
      [name, xText, yText, typeText] = parts;
    } else if (parts.length >= 2) {
      name = `P${nodes.length + 1}`;
      [xText, yText] = parts;
      typeText = parts[2] ?? "2";
    } else {
      errors.push(`第 ${index + 1} 行字段不足`);
      return;
    }

    const x = evaluateCoordinateExpression(xText);
    const y = evaluateCoordinateExpression(yText);
    const type = Number(typeText);

    if (!Number.isFinite(x) || !Number.isFinite(y)) {
      errors.push(`第 ${index + 1} 行坐标不是有效数字`);
      return;
    }

    if (!Number.isInteger(type) || !typeInfo[type]) {
      errors.push(`第 ${index + 1} 行类型必须是 0、1、2`);
      return;
    }

    nodes.push({
      id: nodes.length + 1,
      name,
      x,
      y,
      type,
      typeLabel: typeInfo[type].label
    });
  });

  return { nodes, errors };
}

function normalizeNodeInputExpressions() {
  const rows = els.bulkInput.value.split(/\r?\n/);
  const normalizedRows = rows.map((rawLine, index) => {
    const line = rawLine.trim();
    if (!line || line.startsWith("#")) {
      return rawLine;
    }

    const parts = splitNodeParts(line);
    const first = parts[0] ? parts[0].toLowerCase() : "";
    if (index === 0 && (first === "name" || first === "x" || first === "名称")) {
      return rawLine;
    }

    let name = "";
    let xText = "";
    let yText = "";
    let typeText = "";

    if (parts.length >= 4 && !Number.isFinite(evaluateCoordinateExpression(parts[0]))) {
      [name, xText, yText, typeText] = parts;
    } else if (parts.length >= 2) {
      [xText, yText] = parts;
      typeText = parts[2] ?? "2";
    } else {
      return rawLine;
    }

    const x = evaluateCoordinateExpression(xText);
    const y = evaluateCoordinateExpression(yText);
    const type = Number(typeText);
    if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isInteger(type) || !typeInfo[type]) {
      return rawLine;
    }

    const normalized = [formatNumber(x), formatNumber(y), String(type)];
    return name ? [name, ...normalized].join(",") : normalized.join(",");
  });

  const nextValue = normalizedRows.join("\n");
  if (nextValue !== els.bulkInput.value) {
    els.bulkInput.value = nextValue;
    applyInput();
  }
}

function updateNodeTypeInInput(nodeId, nextType) {
  const rows = els.bulkInput.value.split(/\r?\n/);
  let nodeIndex = 0;
  const updatedRows = rows.map((rawLine, index) => {
    const line = rawLine.trim();
    if (!line || line.startsWith("#")) {
      return rawLine;
    }

    const parts = splitNodeParts(line);
    const first = parts[0] ? parts[0].toLowerCase() : "";
    if (index === 0 && (first === "name" || first === "x" || first === "名称")) {
      return rawLine;
    }

    const hasName = parts.length >= 4 && !Number.isFinite(evaluateCoordinateExpression(parts[0]));
    if ((!hasName && parts.length < 2) || (hasName && parts.length < 3)) {
      return rawLine;
    }

    nodeIndex += 1;
    if (nodeIndex !== nodeId) {
      return rawLine;
    }

    const start = hasName ? 1 : 0;
    const x = evaluateCoordinateExpression(parts[start]);
    const y = evaluateCoordinateExpression(parts[start + 1]);
    if (!Number.isFinite(x) || !Number.isFinite(y)) {
      return rawLine;
    }

    const nextParts = [formatNumber(x), formatNumber(y), String(nextType)];
    return hasName ? [parts[0], ...nextParts].join(",") : nextParts.join(",");
  });

  els.bulkInput.value = updatedRows.join("\n");
  applyInput();
}

function parseLinks(text, nodes) {
  const rows = text.split(/\r?\n/);
  const links = [];
  const errors = [];
  const nodeMap = new Map();

  nodes.forEach((node) => {
    nodeMap.set(String(node.id), node);
    nodeMap.set(node.name, node);
    nodeMap.set(node.name.toLowerCase(), node);
  });

  rows.forEach((rawLine, index) => {
    const line = rawLine.trim();
    if (!line || line.startsWith("#")) {
      return;
    }

    const parts = line.split(/\s*(?:->|--|-|,|，|;|；|\s+)\s*/).filter(Boolean);
    if (parts.length < 2) {
      errors.push(`连线第 ${index + 1} 行字段不足`);
      return;
    }

    const from = nodeMap.get(parts[0]) || nodeMap.get(parts[0].toLowerCase());
    const to = nodeMap.get(parts[1]) || nodeMap.get(parts[1].toLowerCase());
    if (!from || !to) {
      errors.push(`连线第 ${index + 1} 行节点不存在`);
      return;
    }

    if (from.id === to.id) {
      errors.push(`连线第 ${index + 1} 行不能连接自身`);
      return;
    }

    const key = makeLinkKey(from.id, to.id);
    if (links.some((link) => link.key === key)) {
      errors.push(`连线第 ${index + 1} 行重复`);
      return;
    }

    links.push({
      id: links.length + 1,
      key,
      fromId: from.id,
      toId: to.id,
      fromName: from.name,
      toName: to.name
    });
  });

  return { links, errors };
}

function makeLinkKey(fromId, toId) {
  return [fromId, toId].sort((a, b) => a - b).join("-");
}

function distanceBetweenNodes(from, to) {
  return Math.hypot(from.x - to.x, from.y - to.y);
}

const geometryEpsilon = 1e-7;

function cross(ax, ay, bx, by) {
  return ax * by - ay * bx;
}

function isPointOnSegment(point, from, to) {
  const dx = to.x - from.x;
  const dy = to.y - from.y;
  const crossValue = cross(point.x - from.x, point.y - from.y, dx, dy);
  const length = Math.hypot(dx, dy) || 1;
  if (Math.abs(crossValue) / length > geometryEpsilon) {
    return false;
  }

  const dot = (point.x - from.x) * (point.x - to.x) + (point.y - from.y) * (point.y - to.y);
  return dot <= geometryEpsilon;
}

function projectionOnSegmentLine(point, from, to) {
  const length = distanceBetweenNodes(from, to);
  if (length <= geometryEpsilon) {
    return 0;
  }
  return ((point.x - from.x) * (to.x - from.x) + (point.y - from.y) * (to.y - from.y)) / length;
}

function canMergeSegments(a, b) {
  const aFrom = nodeById(a.fromId);
  const aTo = nodeById(a.toId);
  const bFrom = nodeById(b.fromId);
  const bTo = nodeById(b.toId);
  if (!aFrom || !aTo || !bFrom || !bTo) {
    return false;
  }

  if (!isPointOnSegment(bFrom, aFrom, aTo) && !isCollinearPoint(bFrom, aFrom, aTo)) {
    return false;
  }
  if (!isPointOnSegment(bTo, aFrom, aTo) && !isCollinearPoint(bTo, aFrom, aTo)) {
    return false;
  }

  const a0 = projectionOnSegmentLine(aFrom, aFrom, aTo);
  const a1 = projectionOnSegmentLine(aTo, aFrom, aTo);
  const b0 = projectionOnSegmentLine(bFrom, aFrom, aTo);
  const b1 = projectionOnSegmentLine(bTo, aFrom, aTo);
  const aMin = Math.min(a0, a1);
  const aMax = Math.max(a0, a1);
  const bMin = Math.min(b0, b1);
  const bMax = Math.max(b0, b1);
  const overlap = Math.min(aMax, bMax) - Math.max(aMin, bMin);
  return overlap > geometryEpsilon;
}

function isCollinearPoint(point, from, to) {
  const dx = to.x - from.x;
  const dy = to.y - from.y;
  const length = Math.hypot(dx, dy) || 1;
  return Math.abs(cross(point.x - from.x, point.y - from.y, dx, dy)) / length <= geometryEpsilon;
}

function mergeSegments(a, b) {
  const aFrom = nodeById(a.fromId);
  const aTo = nodeById(a.toId);
  const endpoints = [a.fromId, a.toId, b.fromId, b.toId]
    .map((id) => nodeById(id))
    .filter(Boolean)
    .map((node) => ({
      id: node.id,
      projection: projectionOnSegmentLine(node, aFrom, aTo)
    }))
    .sort((left, right) => left.projection - right.projection);

  const fromId = endpoints[0].id;
  const toId = endpoints[endpoints.length - 1].id;
  return {
    id: a.id,
    key: makeLinkKey(fromId, toId),
    fromId,
    toId,
    mergedFrom: [...(a.mergedFrom || [a.key]), ...(b.mergedFrom || [b.key])]
  };
}

function getEffectiveLinks() {
  let effective = state.links.map((link) => ({
    ...link,
    mergedFrom: link.mergedFrom || [link.key]
  }));
  let changed = true;

  while (changed) {
    changed = false;
    outer:
    for (let i = 0; i < effective.length; i += 1) {
      for (let j = i + 1; j < effective.length; j += 1) {
        if (!canMergeSegments(effective[i], effective[j])) {
          continue;
        }
        const merged = mergeSegments(effective[i], effective[j]);
        effective.splice(j, 1);
        effective.splice(i, 1, merged);
        changed = true;
        break outer;
      }
    }
  }

  return effective;
}

function formatNumber(value) {
  if (!Number.isFinite(value)) {
    return "";
  }
  return Number.isInteger(value) ? String(value) : value.toFixed(3).replace(/0+$/, "").replace(/\.$/, "");
}

function segmentOffsetValues() {
  return {
    x: Number(els.segmentOffsetX.value) || 0,
    y: Number(els.segmentOffsetY.value) || 0,
    tolerance: Math.max(0, Number(els.segmentOffsetTolerance.value) || 0)
  };
}

function nodesNearFiniteSegment(from, to, toleranceMm) {
  if (!from || !to || from.id === to.id) return from ? [from] : [];
  const dx = to.x - from.x;
  const dy = to.y - from.y;
  const lengthSquared = dx * dx + dy * dy;
  const length = Math.sqrt(lengthSquared);
  if (length <= geometryEpsilon) return [from, to];
  const endpointTolerance = toleranceMm / length;

  return state.nodes.filter((node) => {
    const projection = ((node.x - from.x) * dx + (node.y - from.y) * dy) / lengthSquared;
    if (projection < -endpointTolerance || projection > 1 + endpointTolerance) return false;
    const perpendicularDistance = Math.abs(cross(node.x - from.x, node.y - from.y, dx, dy)) / length;
    return perpendicularDistance <= toleranceMm + geometryEpsilon;
  }).sort((left, right) => {
    const leftProjection = (left.x - from.x) * dx + (left.y - from.y) * dy;
    const rightProjection = (right.x - from.x) * dx + (right.y - from.y) * dy;
    return leftProjection - rightProjection;
  });
}

function refreshSegmentOffsetSelection() {
  const tool = state.segmentOffset;
  const from = nodeById(tool.startId);
  const to = nodeById(tool.endId);
  tool.selectedIds = from && to
    ? nodesNearFiniteSegment(from, to, segmentOffsetValues().tolerance).map((node) => node.id)
    : (from ? [from.id] : []);
  updateSegmentOffsetControls();
  draw();
}

function updateSegmentOffsetControls(message = "") {
  const tool = state.segmentOffset;
  els.segmentOffsetPanel.hidden = !tool.active;
  els.segmentOffsetModeBtn.classList.toggle("active", tool.active);
  els.segmentOffsetApplyBtn.disabled = !tool.active || tool.endId === null || tool.selectedIds.length === 0;
  els.segmentOffsetUndoBtn.disabled = !tool.undoCoordinates;
  if (message) {
    els.segmentOffsetStatus.textContent = message;
  } else if (!tool.startId) {
    els.segmentOffsetStatus.textContent = "请点击线段的第一个端点";
  } else if (!tool.endId) {
    els.segmentOffsetStatus.textContent = `已选 ${nodeById(tool.startId)?.name || "起点"}，请点击另一个端点`;
  } else {
    const fromName = nodeById(tool.startId)?.name || "起点";
    const toName = nodeById(tool.endId)?.name || "终点";
    els.segmentOffsetStatus.textContent = `${fromName} → ${toName}，命中 ${tool.selectedIds.length} 个节点`;
  }
}

function resetSegmentOffsetSelection(message = "") {
  state.segmentOffset.startId = null;
  state.segmentOffset.endId = null;
  state.segmentOffset.selectedIds = [];
  updateSegmentOffsetControls(message);
  draw();
}

function selectSegmentOffsetEndpoint(node) {
  const tool = state.segmentOffset;
  if (!tool.startId || tool.endId) {
    tool.startId = node.id;
    tool.endId = null;
    tool.selectedIds = [node.id];
  } else if (tool.startId === node.id) {
    resetSegmentOffsetSelection();
    return;
  } else {
    tool.endId = node.id;
    refreshSegmentOffsetSelection();
    return;
  }
  updateSegmentOffsetControls();
  draw();
}

function syncNodeCoordinatesToInput() {
  els.bulkInput.value = state.nodes
    .map((node) => `${formatNumber(node.x)},${formatNumber(node.y)},${node.type}`)
    .join("\n");
}

function routeStructureMatches(nextNodes, nextLinks) {
  if (state.nodes.length !== nextNodes.length || state.links.length !== nextLinks.length) {
    return false;
  }

  const nodesMatch = state.nodes.every((node, index) => {
    const nextNode = nextNodes[index];
    return nextNode
      && node.id === nextNode.id
      && node.name === nextNode.name
      && node.type === nextNode.type;
  });
  if (!nodesMatch) return false;

  const currentLinkKeys = state.links.map((link) => link.key).sort();
  const nextLinkKeys = nextLinks.map((link) => link.key).sort();
  return currentLinkKeys.every((key, index) => key === nextLinkKeys[index]);
}

function refreshRoutesAfterCoordinateEdit() {
  if (state.manualPlanning) {
    updateManualRoutePreview("节点坐标已更新，已保留手动路径顺序并重新计算切弯和速度");
    return;
  }

  if (!state.routeCandidates.length) {
    if (state.lastRoute?.ok) {
      state.lastRoute = attachMotionProfile({
        ...state.lastRoute,
        distance: routeDistanceMm(state.lastRoute.pathIds)
      }, readSpeedSettings());
      updateStopNodeOptions(state.lastRoute);
      updateRouteSummary(state.lastRoute);
      updateRouteEdgeText(state.lastRoute);
    }
    updateOptimizerSeedControls();
    updateExportText();
    draw();
    return;
  }

  const selectedIndex = Math.max(0, Math.min(state.selectedRouteIndex, state.routeCandidates.length - 1));
  const settings = readSpeedSettings();
  state.routeCandidates = state.routeCandidates.map((route) => attachMotionProfile({
    ...route,
    distance: routeDistanceMm(route.pathIds)
  }, settings));
  selectRouteCandidate(selectedIndex);
}

function invalidateRoutesAfterCoordinateEdit() {
  state.lastRoute = null;
  state.routeCandidates = [];
  state.selectedRouteIndex = 0;
  state.routeDirectionReversed = false;
  state.manualPlanning = false;
  state.manualStartId = 0;
  state.manualSegments = [];
  state.manualPathIds = [];
  state.manualStopIds = [];
  state.manualImportRoute = null;
  state.optimizerSeeds = [];
  updateRouteCandidateOptions();
  updateRouteSummary(null);
  updateManualPlanningControls();
  updateOptimizerSeedControls();
}

function applySegmentOffset() {
  const tool = state.segmentOffset;
  const offset = segmentOffsetValues();
  if (!tool.endId || !tool.selectedIds.length) return;
  if (offset.x === 0 && offset.y === 0) {
    updateSegmentOffsetControls("X、Y 偏移均为 0，节点未改动");
    return;
  }

  const selectedIdSet = new Set(tool.selectedIds);
  tool.undoCoordinates = state.nodes
    .filter((node) => selectedIdSet.has(node.id))
    .map((node) => ({ id: node.id, x: node.x, y: node.y }));
  state.nodes.forEach((node) => {
    if (!selectedIdSet.has(node.id)) return;
    node.x += offset.x;
    node.y += offset.y;
  });
  syncNodeCoordinatesToInput();
  renderTable();
  updateStats();
  refreshRoutesAfterCoordinateEdit();
  resetSegmentOffsetSelection(`已偏移 ${tool.undoCoordinates.length} 个节点，可撤销`);
}

function undoSegmentOffset() {
  const snapshot = state.segmentOffset.undoCoordinates;
  if (!snapshot) return;
  const previousById = new Map(snapshot.map((point) => [point.id, point]));
  state.nodes.forEach((node) => {
    const previous = previousById.get(node.id);
    if (!previous) return;
    node.x = previous.x;
    node.y = previous.y;
  });
  state.segmentOffset.undoCoordinates = null;
  syncNodeCoordinatesToInput();
  renderTable();
  updateStats();
  refreshRoutesAfterCoordinateEdit();
  resetSegmentOffsetSelection(`已恢复 ${snapshot.length} 个节点`);
}

function niceBounds(nodes) {
  if (!nodes.length) {
    return { minX: -500, maxX: 500, minY: -500, maxY: 500 };
  }

  let minX = nodes[0].x;
  let maxX = nodes[0].x;
  let minY = nodes[0].y;
  let maxY = nodes[0].y;

  nodes.forEach((node) => {
    minX = Math.min(minX, node.x);
    maxX = Math.max(maxX, node.x);
    minY = Math.min(minY, node.y);
    maxY = Math.max(maxY, node.y);
  });

  const spanX = Math.max(maxX - minX, 1);
  const spanY = Math.max(maxY - minY, 1);
  const padX = Math.max(spanX * 0.12, 100);
  const padY = Math.max(spanY * 0.12, 100);

  return {
    minX: minX - padX,
    maxX: maxX + padX,
    minY: minY - padY,
    maxY: maxY + padY
  };
}

function buildView(nodes) {
  const bounds = niceBounds(nodes);
  const canvas = els.plot;
  const margin = { left: 68, right: 26, top: 26, bottom: 56 };
  let minX = bounds.minX;
  let maxX = bounds.maxX;
  let minY = bounds.minY;
  let maxY = bounds.maxY;
  const plotW = Math.max(canvas.width - margin.left - margin.right, 10);
  const plotH = Math.max(canvas.height - margin.top - margin.bottom, 10);

  if (els.equalScale.checked) {
    const spanX = maxX - minX;
    const spanY = maxY - minY;
    const scale = Math.min(plotW / spanX, plotH / spanY);
    const targetSpanX = plotW / scale;
    const targetSpanY = plotH / scale;
    const centerX = (minX + maxX) / 2;
    const centerY = (minY + maxY) / 2;
    minX = centerX - targetSpanX / 2;
    maxX = centerX + targetSpanX / 2;
    minY = centerY - targetSpanY / 2;
    maxY = centerY + targetSpanY / 2;
  }

  return {
    minX,
    maxX,
    minY,
    maxY,
    margin,
    plotW,
    plotH,
    scaleX: plotW / (maxX - minX),
    scaleY: plotH / (maxY - minY)
  };
}

function worldToScreen(x, y) {
  const view = state.view;
  const sx = view.margin.left + (x - view.minX) * view.scaleX;
  const yRatio = (y - view.minY) * view.scaleY;
  const sy = els.invertY.checked
    ? view.margin.top + yRatio
    : view.margin.top + view.plotH - yRatio;
  return { x: sx, y: sy };
}

function screenToWorld(x, y) {
  const view = state.view;
  const worldX = view.minX + (x - view.margin.left) / view.scaleX;
  const ratioY = els.invertY.checked
    ? (y - view.margin.top) / view.scaleY
    : (view.margin.top + view.plotH - y) / view.scaleY;
  return {
    x: worldX,
    y: view.minY + ratioY
  };
}

function resizeCanvas() {
  const rect = els.plot.getBoundingClientRect();
  els.plot.width = Math.max(Math.round(rect.width), 1);
  els.plot.height = Math.max(Math.round(rect.height), 1);
}

function clearCanvas() {
  ctx.clearRect(0, 0, els.plot.width, els.plot.height);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, els.plot.width, els.plot.height);
}

function drawGrid() {
  const view = state.view;
  const gridStep = Math.max(Number(els.gridStep.value) || 100, 1);
  const left = view.margin.left;
  const right = view.margin.left + view.plotW;
  const top = view.margin.top;
  const bottom = view.margin.top + view.plotH;

  ctx.save();
  ctx.strokeStyle = "#eef1f5";
  ctx.lineWidth = 1;
  ctx.font = "12px Segoe UI, Microsoft YaHei, sans-serif";
  ctx.fillStyle = "#697386";

  const startX = Math.ceil(view.minX / gridStep) * gridStep;
  for (let x = startX; x <= view.maxX; x += gridStep) {
    const pos = worldToScreen(x, view.minY).x;
    ctx.beginPath();
    ctx.moveTo(pos, top);
    ctx.lineTo(pos, bottom);
    ctx.stroke();
    ctx.fillText(formatNumber(x), pos - 12, bottom + 22);
  }

  const startY = Math.ceil(view.minY / gridStep) * gridStep;
  for (let y = startY; y <= view.maxY; y += gridStep) {
    const pos = worldToScreen(view.minX, y).y;
    ctx.beginPath();
    ctx.moveTo(left, pos);
    ctx.lineTo(right, pos);
    ctx.stroke();
    ctx.fillText(formatNumber(y), 12, pos + 4);
  }

  ctx.strokeStyle = "#bac3d1";
  ctx.lineWidth = 1.4;
  ctx.strokeRect(left, top, view.plotW, view.plotH);

  if (view.minX <= 0 && view.maxX >= 0) {
    const zeroX = worldToScreen(0, view.minY).x;
    ctx.strokeStyle = "#8d99aa";
    ctx.beginPath();
    ctx.moveTo(zeroX, top);
    ctx.lineTo(zeroX, bottom);
    ctx.stroke();
  }

  if (view.minY <= 0 && view.maxY >= 0) {
    const zeroY = worldToScreen(view.minX, 0).y;
    ctx.strokeStyle = "#8d99aa";
    ctx.beginPath();
    ctx.moveTo(left, zeroY);
    ctx.lineTo(right, zeroY);
    ctx.stroke();
  }

  ctx.fillStyle = "#3e4858";
  ctx.fillText("X / mm", right - 44, bottom + 42);
  ctx.fillText("Y / mm", 12, top - 8);
  ctx.restore();
}

function nodeById(id) {
  return state.nodes.find((node) => node.id === id) || null;
}

function buildGraph() {
  const graph = new Map(state.nodes.map((node) => [node.id, []]));
  getEffectiveLinks().forEach((link) => {
    const from = nodeById(link.fromId);
    const to = nodeById(link.toId);
    if (!from || !to) {
      return;
    }
    const segmentNodeIds = getSegmentNodeIds(from, to);
    for (let i = 0; i < segmentNodeIds.length - 1; i += 1) {
      const a = nodeById(segmentNodeIds[i]);
      const b = nodeById(segmentNodeIds[i + 1]);
      const weight = distanceBetweenNodes(a, b);
      graph.get(a.id).push({ toId: b.id, weight });
      graph.get(b.id).push({ toId: a.id, weight });
    }
  });
  return graph;
}

function getSegmentNodeIds(from, to) {
  return state.nodes
    .filter((node) => isPointOnSegment(node, from, to))
    .map((node) => ({
      id: node.id,
      projection: projectionOnSegmentLine(node, from, to)
    }))
    .sort((left, right) => left.projection - right.projection)
    .map((item) => item.id);
}

function dijkstra(startId, graph) {
  const dist = new Map(state.nodes.map((node) => [node.id, Infinity]));
  const prev = new Map();
  const unvisited = new Set(state.nodes.map((node) => node.id));
  dist.set(startId, 0);

  while (unvisited.size) {
    let current = null;
    let best = Infinity;
    unvisited.forEach((id) => {
      const value = dist.get(id);
      if (value < best) {
        best = value;
        current = id;
      }
    });

    if (current === null) {
      break;
    }

    unvisited.delete(current);
    (graph.get(current) || []).forEach((edge) => {
      if (!unvisited.has(edge.toId)) {
        return;
      }
      const nextDist = dist.get(current) + edge.weight;
      if (nextDist < dist.get(edge.toId)) {
        dist.set(edge.toId, nextDist);
        prev.set(edge.toId, current);
      }
    });
  }

  return { dist, prev };
}

function reconstructPath(prev, startId, endId) {
  if (startId === endId) {
    return [startId];
  }

  const path = [];
  let current = endId;
  while (current !== undefined) {
    path.push(current);
    if (current === startId) {
      return path.reverse();
    }
    current = prev.get(current);
  }
  return [];
}

function dijkstraPathAvoiding(startId, endId, graph, blockedIds) {
  const dist = new Map(state.nodes.map((node) => [node.id, Infinity]));
  const prev = new Map();
  const unvisited = new Set(
    state.nodes
      .map((node) => node.id)
      .filter((id) => id === startId || id === endId || !blockedIds.has(id))
  );
  dist.set(startId, 0);

  while (unvisited.size) {
    let current = null;
    let best = Infinity;
    unvisited.forEach((id) => {
      const value = dist.get(id);
      if (value < best) {
        best = value;
        current = id;
      }
    });

    if (current === null) {
      break;
    }

    if (current === endId) {
      break;
    }

    unvisited.delete(current);
    (graph.get(current) || []).forEach((edge) => {
      if (!unvisited.has(edge.toId)) {
        return;
      }
      const nextDist = dist.get(current) + edge.weight;
      if (nextDist < dist.get(edge.toId)) {
        dist.set(edge.toId, nextDist);
        prev.set(edge.toId, current);
      }
    });
  }

  return {
    distance: dist.get(endId),
    path: reconstructPath(prev, startId, endId)
  };
}

function buildPathFromStops(stops, shortestBySource) {
  const fullPath = [];
  for (let i = 0; i < stops.length - 1; i += 1) {
    const fromId = stops[i];
    const toId = stops[i + 1];
    const segment = reconstructPath(shortestBySource.get(fromId).prev, fromId, toId);
    if (!segment.length) {
      return [];
    }
    const expanded = expandPathByCollinearNodes(segment);
    if (i === 0) {
      fullPath.push(...expanded);
    } else {
      fullPath.push(...expanded.slice(1));
    }
  }
  return fullPath;
}

function expandPathByCollinearNodes(pathIds) {
  const expanded = [];
  for (let i = 0; i < pathIds.length - 1; i += 1) {
    const from = nodeById(pathIds[i]);
    const to = nodeById(pathIds[i + 1]);
    if (!from || !to) {
      continue;
    }
    const segmentNodes = getSegmentNodeIds(from, to);
    if (i === 0) {
      expanded.push(...segmentNodes);
    } else {
      expanded.push(...segmentNodes.slice(1));
    }
  }
  return expanded.length ? expanded : pathIds;
}

function maskForPath(pathIds, requiredIndex) {
  let mask = 0;
  const expanded = expandPathByCollinearNodes(pathIds);
  expanded.forEach((id) => {
    if (requiredIndex.has(id)) {
      mask |= 1 << requiredIndex.get(id);
    }
  });
  return mask;
}

function edgeKeyForPath(a, b) {
  return makeLinkKey(a, b);
}

function hasDuplicateValues(values) {
  return new Set(values).size !== values.length;
}

function appendForwardPath(basePath, segmentPath) {
  const expandedSegment = expandPathByCollinearNodes(segmentPath);
  if (!expandedSegment.length) {
    return null;
  }

  const candidate = basePath.length
    ? [...basePath, ...expandedSegment.slice(1)]
    : [...expandedSegment];

  if (hasDuplicateValues(candidate)) {
    return null;
  }

  const edgeKeys = [];
  for (let i = 0; i < candidate.length - 1; i += 1) {
    edgeKeys.push(edgeKeyForPath(candidate[i], candidate[i + 1]));
  }

  if (hasDuplicateValues(edgeKeys)) {
    return null;
  }

  return candidate;
}

function maskForVisitedPath(pathIds, requiredIndex) {
  let mask = 0;
  pathIds.forEach((id) => {
    if (requiredIndex.has(id)) {
      mask |= 1 << requiredIndex.get(id);
    }
  });
  return mask;
}

function routeDistance(pathIds) {
  let distance = 0;
  for (let i = 0; i < pathIds.length - 1; i += 1) {
    const from = nodeById(pathIds[i]);
    const to = nodeById(pathIds[i + 1]);
    if (!from || !to) {
      return Infinity;
    }
    distance += distanceBetweenNodes(from, to);
  }
  return distance;
}

function readSpeedSettings() {
  const fallback = {
    speedModel: "friction",
    curveRadiusCm: 10,
    frictionCoefficient: 0.287,
    carMassG: 101.6,
    downforceG: 800,
    curveSpeedMps: 2,
    straightSpeedMps: 8,
    accelerationMps2: 25,
    decelerationMps2: 25,
    startupDragTimeS: 0.4,
    startupDragSpeedMps: 0.2,
    alternatingTurnThresholdMm: 900,
    alternatingTurnOffsetMm: 100
  };

  function positiveValue(input, fallbackValue) {
    const value = Number(input?.value);
    return Number.isFinite(value) && value > 0 ? value : fallbackValue;
  }

  function nonNegativeValue(input, fallbackValue) {
    const value = Number(input?.value);
    return Number.isFinite(value) && value >= 0 ? value : fallbackValue;
  }

  const curveSpeedMps = positiveValue(els.curveSpeedInput, fallback.curveSpeedMps);
  const straightSpeedMps = positiveValue(els.straightSpeedInput, fallback.straightSpeedMps);
  const frictionCoefficient = positiveValue(els.frictionInput, fallback.frictionCoefficient);
  const carMassG = positiveValue(els.carMassInput, fallback.carMassG);
  const downforceG = Math.max(0, Number(els.downforceInput?.value) || fallback.downforceG);
  const normalLoadRatio = (carMassG + downforceG) / carMassG;
  const gripAccelerationMps2 = frictionCoefficient * 9.80665 * normalLoadRatio;
  const accelerationMps2 = positiveValue(els.accelerationInput, fallback.accelerationMps2);
  const decelerationMps2 = positiveValue(els.decelerationInput, fallback.decelerationMps2);
  const startupDragTimeS = nonNegativeValue(els.startupDragTimeInput, fallback.startupDragTimeS);
  const startupDragSpeedMps = positiveValue(els.startupDragSpeedInput, fallback.startupDragSpeedMps);
  return {
    speedModel: els.speedModelSelect?.value || fallback.speedModel,
    curveRadiusCm: Math.max(0, Number(els.curveRadiusInput?.value) || fallback.curveRadiusCm),
    frictionCoefficient,
    carMassG,
    downforceG,
    normalLoadRatio,
    gripAccelerationMps2,
    curveSpeedMps,
    straightSpeedMps,
    accelerationMps2,
    decelerationMps2,
    startupDragTimeS,
    startupDragSpeedMps,
    startupDragDistanceMm: startupDragTimeS * startupDragSpeedMps * 1000,
    effectiveAccelerationMps2: accelerationMps2,
    effectiveDecelerationMps2: decelerationMps2,
    alternatingTurnOffsetEnabled: els.alternatingTurnOffsetEnabled?.checked !== false,
    alternatingTurnThresholdMm: nonNegativeValue(els.alternatingTurnThresholdInput, fallback.alternatingTurnThresholdMm),
    alternatingTurnOffsetMm: nonNegativeValue(els.alternatingTurnOffsetInput, fallback.alternatingTurnOffsetMm)
  };
}

function angleBetweenSegments(previousId, currentId, nextId) {
  const previous = nodeById(previousId);
  const current = nodeById(currentId);
  const next = nodeById(nextId);
  if (!previous || !current || !next) {
    return 0;
  }

  const ax = current.x - previous.x;
  const ay = current.y - previous.y;
  const bx = next.x - current.x;
  const by = next.y - current.y;
  const aLength = Math.hypot(ax, ay);
  const bLength = Math.hypot(bx, by);
  if (aLength <= geometryEpsilon || bLength <= geometryEpsilon) {
    return 0;
  }

  const dot = ax * bx + ay * by;
  const cosine = Math.max(-1, Math.min(1, dot / (aLength * bLength)));
  return Math.acos(cosine);
}

function motionTimeMeters(distanceM, startSpeedMps, endSpeedMps, maxSpeedMps,
  accelerationMps2, decelerationMps2 = accelerationMps2) {
  if (distanceM <= 0) {
    return 0;
  }

  const vmax = Math.max(0.01, maxSpeedMps);
  const accel = Math.max(0.01, accelerationMps2);
  const decel = Math.max(0.01, decelerationMps2);
  const v0 = Math.min(Math.max(0, startSpeedMps), vmax);
  const v1 = Math.min(Math.max(0, endSpeedMps), vmax);
  const accelDistance = Math.max(0, (vmax * vmax - v0 * v0) / (2 * accel));
  const decelDistance = Math.max(0, (vmax * vmax - v1 * v1) / (2 * decel));

  if (accelDistance + decelDistance <= distanceM) {
    return (vmax - v0) / accel
      + (distanceM - accelDistance - decelDistance) / vmax
      + (vmax - v1) / decel;
  }

  const peakSquared = Math.max(0,
    (2 * accel * decel * distanceM + decel * v0 * v0 + accel * v1 * v1) / (accel + decel));
  const peak = Math.sqrt(peakSquared);
  return Math.max(0, (peak - v0) / accel) + Math.max(0, (peak - v1) / decel);
}

function motionProfileMeters(distanceM, startSpeedMps, endSpeedMps, maxSpeedMps,
  accelerationMps2, decelerationMps2 = accelerationMps2, stepM = 0.05) {
  if (distanceM <= 0) {
    return {
      timeSeconds: 0,
      samples: [{ distanceM: 0, speedMps: Math.min(startSpeedMps, maxSpeedMps) }]
    };
  }

  const vmax = Math.max(0.01, maxSpeedMps);
  const accel = Math.max(0.01, accelerationMps2);
  const decel = Math.max(0.01, decelerationMps2);
  const v0 = Math.min(Math.max(0, startSpeedMps), vmax);
  const v1 = Math.min(Math.max(0, endSpeedMps), vmax);
  const accelDistance = Math.max(0, (vmax * vmax - v0 * v0) / (2 * accel));
  const decelDistance = Math.max(0, (vmax * vmax - v1 * v1) / (2 * decel));
  const reachesMax = accelDistance + decelDistance <= distanceM;
  const peakSpeed = reachesMax
    ? vmax
    : Math.sqrt(Math.max(0,
      (2 * accel * decel * distanceM + decel * v0 * v0 + accel * v1 * v1) / (accel + decel)));
  const accelToPeakDistance = Math.max(0, (peakSpeed * peakSpeed - v0 * v0) / (2 * accel));

  function speedAt(positionM) {
    const s = Math.max(0, Math.min(distanceM, positionM));
    if (reachesMax) {
      if (s <= accelDistance) {
        return Math.sqrt(Math.max(0, v0 * v0 + 2 * accel * s));
      }
      if (s >= distanceM - decelDistance) {
        const remaining = distanceM - s;
        return Math.sqrt(Math.max(0, v1 * v1 + 2 * decel * remaining));
      }
      return vmax;
    }

    if (s <= accelToPeakDistance) {
      return Math.sqrt(Math.max(0, v0 * v0 + 2 * accel * s));
    }
    const remaining = distanceM - s;
    return Math.sqrt(Math.max(0, v1 * v1 + 2 * decel * remaining));
  }

  const samples = [];
  const step = Math.max(0.01, stepM);
  for (let position = 0; position < distanceM; position += step) {
    samples.push({
      distanceM: position,
      speedMps: speedAt(position)
    });
  }
  samples.push({
    distanceM,
    speedMps: speedAt(distanceM)
  });

  return {
    timeSeconds: motionTimeMeters(distanceM, v0, v1, vmax, accel, decel),
    samples
  };
}

function turnInfo(previousId, currentId, nextId, settings) {
  const angle = angleBetweenSegments(previousId, currentId, nextId);
  const threshold = Math.PI / 180;
  if (angle <= threshold) {
    return {
      angle,
      isTurn: false,
      timeSeconds: 0,
      speedMps: settings.straightSpeedMps,
      cutDistanceMm: 0,
      arcDistanceMm: 0,
      distanceAdjustmentMm: 0,
      timeAdjustmentSeconds: 0
    };
  }

  const desiredRadiusM = settings.curveRadiusCm / 100;
  const previous = nodeById(previousId);
  const current = nodeById(currentId);
  const next = nodeById(nextId);
  const incomingM = previous && current ? distanceBetweenNodes(previous, current) / 1000 : 0;
  const outgoingM = current && next ? distanceBetweenNodes(current, next) / 1000 : 0;
  const tangent = Math.tan(angle / 2);
  const rawCutM = desiredRadiusM > 0 ? desiredRadiusM * tangent : 0;
  const cutM = Math.max(0, Math.min(rawCutM, incomingM * 0.45, outgoingM * 0.45));
  const effectiveRadiusM = tangent > geometryEpsilon ? cutM / tangent : desiredRadiusM;
  const arcM = effectiveRadiusM > 0 ? effectiveRadiusM * angle : 0;
  const frictionCurveSpeedMps = effectiveRadiusM > 0
    ? Math.sqrt(settings.gripAccelerationMps2 * effectiveRadiusM)
    : settings.curveSpeedMps;
  const curveSpeedMps = settings.speedModel === "friction"
    ? Math.min(settings.straightSpeedMps, frictionCurveSpeedMps)
    : Math.min(settings.straightSpeedMps, settings.curveSpeedMps);
  return {
    angle,
    isTurn: true,
    radiusM: effectiveRadiusM,
    timeSeconds: arcM / curveSpeedMps,
    speedMps: curveSpeedMps,
    cutDistanceMm: cutM * 1000,
    arcDistanceMm: arcM * 1000,
    distanceAdjustmentMm: (arcM - cutM * 2) * 1000,
    timeAdjustmentSeconds: (arcM / curveSpeedMps) - ((cutM * 2) / settings.straightSpeedMps)
  };
}

function fastestTransitionCost(previousId, currentId, nextId, edgeWeightMm, settings) {
  const turn = previousId ? turnInfo(previousId, currentId, nextId, settings) : {
    isTurn: false,
    timeSeconds: 0,
    speedMps: 0,
    distanceAdjustmentMm: 0,
    timeAdjustmentSeconds: 0
  };
  const distanceM = edgeWeightMm / 1000;
  const straightTime = motionTimeMeters(
    distanceM,
    turn.speedMps,
    settings.straightSpeedMps,
    settings.straightSpeedMps,
    settings.effectiveAccelerationMps2,
    settings.effectiveDecelerationMps2
  );

  return {
    seconds: Math.max(0.001, straightTime + turn.timeAdjustmentSeconds),
    turnCount: turn.isTurn ? 1 : 0,
    effectiveDistanceMm: Math.max(0, edgeWeightMm + turn.distanceAdjustmentMm),
    cutDistanceMm: turn.cutDistanceMm || 0,
    arcDistanceMm: turn.arcDistanceMm || 0,
    entrySpeedMps: turn.speedMps,
    exitSpeedMps: settings.straightSpeedMps,
    curveSpeedMps: turn.isTurn ? turn.speedMps : null,
    turnRadiusM: turn.radiusM || null
  };
}

function fastestClosingTurnCost(previousId, startId, firstNextId, settings) {
  if (!previousId || !firstNextId || previousId === firstNextId) {
    return {
      seconds: 0,
      turnCount: 0,
      effectiveDistanceMm: 0,
      cutDistanceMm: 0,
      arcDistanceMm: 0
    };
  }

  const turn = turnInfo(previousId, startId, firstNextId, settings);
  return {
    seconds: turn.isTurn ? turn.timeAdjustmentSeconds : 0,
    turnCount: turn.isTurn ? 1 : 0,
    effectiveDistanceMm: turn.distanceAdjustmentMm || 0,
    cutDistanceMm: turn.cutDistanceMm || 0,
    arcDistanceMm: turn.arcDistanceMm || 0,
    curveSpeedMps: turn.isTurn ? turn.speedMps : null,
    turnRadiusM: turn.radiusM || null
  };
}

const speedColorMaxMps = 8;
const speedColorStepMps = 0.5;

function speedColorBucket(speedMps) {
  const speed = Number.isFinite(speedMps) ? speedMps : 0;
  const clamped = Math.max(0, Math.min(speedColorMaxMps, speed));
  return Math.floor(clamped / speedColorStepMps) * speedColorStepMps;
}

function hslToHex(hue, saturation, lightness) {
  const c = (1 - Math.abs(2 * lightness - 1)) * saturation;
  const x = c * (1 - Math.abs((hue / 60) % 2 - 1));
  const m = lightness - c / 2;
  let r = 0;
  let g = 0;
  let b = 0;

  if (hue < 60) {
    r = c; g = x;
  } else if (hue < 120) {
    r = x; g = c;
  } else if (hue < 180) {
    g = c; b = x;
  } else if (hue < 240) {
    g = x; b = c;
  } else if (hue < 300) {
    r = x; b = c;
  } else {
    r = c; b = x;
  }

  function channel(value) {
    return Math.round((value + m) * 255).toString(16).padStart(2, "0");
  }

  return `#${channel(r)}${channel(g)}${channel(b)}`;
}

function speedToHeatColor(speedMps) {
  const bucket = speedColorBucket(speedMps);
  const ratio = bucket / speedColorMaxMps;
  const hue = 230 - ratio * 230;
  const lightness = 0.42 + Math.sin(ratio * Math.PI) * 0.12;
  return hslToHex(hue, 0.86, lightness);
}

function pointAlong(from, to, distanceMm) {
  const length = distanceBetweenNodes(from, to);
  if (length <= geometryEpsilon) {
    return { x: from.x, y: from.y };
  }
  const ratio = Math.max(0, Math.min(1, distanceMm / length));
  return {
    x: from.x + (to.x - from.x) * ratio,
    y: from.y + (to.y - from.y) * ratio
  };
}

function turnGeometry(previousId, currentId, nextId, settings) {
  const info = turnInfo(previousId, currentId, nextId, settings);
  if (!info.isTurn || !info.radiusM || info.cutDistanceMm <= geometryEpsilon) {
    return null;
  }

  const previous = nodeById(previousId);
  const current = nodeById(currentId);
  const next = nodeById(nextId);
  if (!previous || !current || !next) {
    return null;
  }

  const radiusMm = info.radiusM * 1000;
  const inPoint = pointAlong(current, previous, info.cutDistanceMm);
  const outPoint = pointAlong(current, next, info.cutDistanceMm);
  const toPreviousLength = distanceBetweenNodes(current, previous);
  const toNextLength = distanceBetweenNodes(current, next);
  if (toPreviousLength <= geometryEpsilon || toNextLength <= geometryEpsilon) {
    return null;
  }

  const uPrev = {
    x: (previous.x - current.x) / toPreviousLength,
    y: (previous.y - current.y) / toPreviousLength
  };
  const uNext = {
    x: (next.x - current.x) / toNextLength,
    y: (next.y - current.y) / toNextLength
  };
  const bisectorLength = Math.hypot(uPrev.x + uNext.x, uPrev.y + uNext.y);
  if (bisectorLength <= geometryEpsilon) {
    return null;
  }

  const interiorAngle = Math.PI - info.angle;
  const centerDistance = radiusMm / Math.max(Math.sin(interiorAngle / 2), 0.001);
  const center = {
    x: current.x + ((uPrev.x + uNext.x) / bisectorLength) * centerDistance,
    y: current.y + ((uPrev.y + uNext.y) / bisectorLength) * centerDistance
  };
  const startAngle = Math.atan2(inPoint.y - center.y, inPoint.x - center.x);
  const endAngle = Math.atan2(outPoint.y - center.y, outPoint.x - center.x);

  function normalize(value) {
    let angle = value;
    while (angle < 0) {
      angle += Math.PI * 2;
    }
    while (angle >= Math.PI * 2) {
      angle -= Math.PI * 2;
    }
    return angle;
  }

  const ccwSpan = normalize(endAngle - startAngle);
  const cwSpan = normalize(startAngle - endAngle);
  const useCcw = Math.abs(ccwSpan - info.angle) <= Math.abs(cwSpan - info.angle);
  const span = useCcw ? ccwSpan : -cwSpan;
  const steps = Math.max(8, Math.ceil(Math.abs(span) / (Math.PI / 24)));
  const points = [];
  for (let i = 0; i <= steps; i += 1) {
    const angle = startAngle + span * (i / steps);
    points.push({
      x: center.x + Math.cos(angle) * radiusMm,
      y: center.y + Math.sin(angle) * radiusMm
    });
  }

  return {
    center,
    inPoint,
    outPoint,
    arcPoints: points,
    labelPoint: points[Math.floor(points.length / 2)] || outPoint,
    speedMps: info.speedMps,
    radiusM: info.radiusM
  };
}

const plannedPathSpacingMm = 5;
const turnCorridorRemainderMm = 5;

function routeDistanceForward(nodes, fromIndex, toIndex, closed) {
  if (!nodes.length || fromIndex === toIndex) {
    return closed ? nodes.reduce((sum, node, index) => {
      const next = nodes[(index + 1) % nodes.length];
      return sum + distanceBetweenNodes(node, next);
    }, 0) : 0;
  }
  let distance = 0;
  let index = fromIndex;
  while (index !== toIndex) {
    const nextIndex = index + 1 < nodes.length ? index + 1 : (closed ? 0 : -1);
    if (nextIndex < 0) break;
    distance += distanceBetweenNodes(nodes[index], nodes[nextIndex]);
    index = nextIndex;
  }
  return distance;
}

function routePointFromIndex(nodes, index, direction, distanceMm, closed) {
  let remaining = Math.max(0, distanceMm);
  let currentIndex = index;
  let current = nodes[currentIndex];
  while (remaining > geometryEpsilon) {
    let nextIndex = currentIndex + direction;
    if (closed) nextIndex = (nextIndex + nodes.length) % nodes.length;
    if (nextIndex < 0 || nextIndex >= nodes.length) break;
    const next = nodes[nextIndex];
    const segmentLength = distanceBetweenNodes(current, next);
    if (segmentLength > geometryEpsilon && remaining <= segmentLength) {
      return pointAlong(current, next, remaining);
    }
    remaining -= segmentLength;
    currentIndex = nextIndex;
    current = next;
  }
  return { x: current.x, y: current.y };
}

function turnDescriptorsFromNodes(nodes, closed) {
  const descriptors = [];
  for (let index = 0; index < nodes.length; index += 1) {
    // Keep the selected route origin fixed, including for a closed route.
    if (index === 0 || (!closed && index === nodes.length - 1)) continue;
    const previousIndex = (index - 1 + nodes.length) % nodes.length;
    const nextIndex = (index + 1) % nodes.length;
    const previous = nodes[previousIndex];
    const current = nodes[index];
    const next = nodes[nextIndex];
    const ax = current.x - previous.x;
    const ay = current.y - previous.y;
    const bx = next.x - current.x;
    const by = next.y - current.y;
    const aLength = Math.hypot(ax, ay);
    const bLength = Math.hypot(bx, by);
    if (aLength <= geometryEpsilon || bLength <= geometryEpsilon) continue;
    const cosine = Math.max(-1, Math.min(1, (ax * bx + ay * by) / (aLength * bLength)));
    const angle = Math.acos(cosine);
    if (angle <= Math.PI / 180) continue;
    descriptors.push({
      index,
      nodeId: current.id,
      angle,
      direction: cross(ax, ay, bx, by) >= 0 ? 1 : -1
    });
  }
  return descriptors;
}

function applyHairpinHeadExtension(nodes, settings, closed) {
  if (!settings.alternatingTurnOffsetEnabled || settings.alternatingTurnOffsetMm <= 0) return [];
  const turns = turnDescriptorsFromNodes(nodes, closed);
  const extensions = [];
  const shiftedIndices = new Set();
  const axisAlignmentCosine = Math.cos(2 * Math.PI / 180);
  const headingReversalCosine = Math.cos(10 * Math.PI / 180);
  for (let index = 0; index < turns.length - 1; index += 1) {
    const headStartTurn = turns[index];
    const headEndTurn = turns[index + 1];
    // A U-turn uses two same-sign corners, but reverses the overall entry/exit heading.
    if (headStartTurn.direction !== headEndTurn.direction) continue;
    let bottomStartIndex = headStartTurn.index - 1;
    while (bottomStartIndex >= 0
      && nodes[bottomStartIndex].type !== 0 && nodes[bottomStartIndex].type !== 1) bottomStartIndex -= 1;
    let bottomEndIndex = headEndTurn.index + 1;
    while (bottomEndIndex < nodes.length
      && nodes[bottomEndIndex].type !== 0 && nodes[bottomEndIndex].type !== 1) bottomEndIndex += 1;
    if (bottomStartIndex >= headStartTurn.index || headEndTurn.index >= bottomEndIndex) continue;
    if (bottomStartIndex < 0 || bottomEndIndex >= nodes.length) continue;
    if ([...Array(headEndTurn.index - headStartTurn.index + 1).keys()]
      .some((offset) => shiftedIndices.has(headStartTurn.index + offset))) continue;

    const bottomStart = nodes[bottomStartIndex];
    const headStart = nodes[headStartTurn.index];
    const headEnd = nodes[headEndTurn.index];
    const bottomEnd = nodes[bottomEndIndex];
    const baselineX = bottomEnd.x - bottomStart.x;
    const baselineY = bottomEnd.y - bottomStart.y;
    const headX = headEnd.x - headStart.x;
    const headY = headEnd.y - headStart.y;
    const firstLegX = headStart.x - bottomStart.x;
    const firstLegY = headStart.y - bottomStart.y;
    const secondLegX = bottomEnd.x - headEnd.x;
    const secondLegY = bottomEnd.y - headEnd.y;
    const baselineLength = Math.hypot(baselineX, baselineY);
    const headLength = Math.hypot(headX, headY);
    const firstLegLength = Math.hypot(firstLegX, firstLegY);
    const secondLegLength = Math.hypot(secondLegX, secondLegY);
    if (Math.min(baselineLength, headLength, firstLegLength, secondLegLength) <= geometryEpsilon) continue;

    const headParallel = Math.abs((baselineX * headX + baselineY * headY) / (baselineLength * headLength));
    const entryExitHeadingCosine = (firstLegX * secondLegX + firstLegY * secondLegY)
      / (firstLegLength * secondLegLength);
    const sideLengthMismatchMm = Math.abs(firstLegLength - secondLegLength);
    const sideLengthToleranceMm = Math.max(10, Math.min(firstLegLength, secondLegLength) * 0.03);
    if (headParallel < axisAlignmentCosine
        || entryExitHeadingCosine > -headingReversalCosine
        || sideLengthMismatchMm > sideLengthToleranceMm) continue;

    const normalX = -baselineY / baselineLength;
    const normalY = baselineX / baselineLength;
    const startDepth = (headStart.x - bottomStart.x) * normalX + (headStart.y - bottomStart.y) * normalY;
    const endDepth = (headEnd.x - bottomStart.x) * normalX + (headEnd.y - bottomStart.y) * normalY;
    if (startDepth * endDepth <= 0) continue;
    const originalDepthMm = (Math.abs(startDepth) + Math.abs(endDepth)) / 2;
    const depthMismatchMm = Math.abs(Math.abs(startDepth) - Math.abs(endDepth));
    const headWidthMm = routeDistanceForward(nodes, headStartTurn.index, headEndTurn.index, false);
    const elementConnectionDistanceMm = pointDistance(bottomStart, bottomEnd);
    if (depthMismatchMm > Math.max(10, originalDepthMm * 0.03)
        || elementConnectionDistanceMm >= settings.alternatingTurnThresholdMm) continue;

    const directionSign = startDepth >= 0 ? 1 : -1;
    const extensionX = normalX * directionSign * settings.alternatingTurnOffsetMm;
    const extensionY = normalY * directionSign * settings.alternatingTurnOffsetMm;
    const headStartOriginal = { x: headStart.x, y: headStart.y };
    const headEndOriginal = { x: headEnd.x, y: headEnd.y };
    for (let nodeIndex = headStartTurn.index; nodeIndex <= headEndTurn.index; nodeIndex += 1) {
      nodes[nodeIndex].x += extensionX;
      nodes[nodeIndex].y += extensionY;
      shiftedIndices.add(nodeIndex);
    }
    extensions.push({
      firstNodeId: headStartTurn.nodeId,
      secondNodeId: headEndTurn.nodeId,
      stretchMode: "extend_hairpin_head",
      bottomStartNodeId: bottomStart.id,
      bottomEndNodeId: bottomEnd.id,
      elementConnectionDistanceMm,
      originalDepthMm,
      addedDepthMm: settings.alternatingTurnOffsetMm,
      virtualDepthMm: originalDepthMm + settings.alternatingTurnOffsetMm,
      headWidthMm,
      firstOriginal: headStartOriginal,
      secondOriginal: headEndOriginal,
      firstVirtual: { x: nodes[headStartTurn.index].x, y: nodes[headStartTurn.index].y },
      secondVirtual: { x: nodes[headEndTurn.index].x, y: nodes[headEndTurn.index].y }
    });
    index += 1;
  }
  return extensions;
}

function turnRadiusKey(previousId, currentId, nextId) {
  const endpoints = [Number(previousId), Number(nextId)].sort((left, right) => left - right);
  return `${endpoints[0]}:${Number(currentId)}:${endpoints[1]}`;
}

function turnRadiusOverrideCm(previousId, currentId, nextId, fallbackCm) {
  const value = Number(state.turnRadiusEditor.overrides[
    turnRadiusKey(previousId, currentId, nextId)
  ]);
  return Number.isFinite(value) && value > 0 ? value : fallbackCm;
}

function buildRouteTurnPlan(pathIds, settings) {
  const closed = pathIds.length > 2 && pathIds[0] === pathIds[pathIds.length - 1];
  const uniqueIds = closed ? pathIds.slice(0, -1) : pathIds.slice();
  const nodes = uniqueIds.map((id) => {
    const node = nodeById(id);
    return node ? { ...node } : null;
  }).filter(Boolean);
  if (nodes.length !== uniqueIds.length || nodes.length < 2) {
    return { closed, nodes, corners: [], virtualStretches: [] };
  }

  const virtualStretches = applyHairpinHeadExtension(nodes, settings, closed);
  const corners = [];
  turnDescriptorsFromNodes(nodes, closed).forEach((descriptor) => {
    const { index, angle, direction } = descriptor;
    const tangent = Math.tan(angle / 2);
    const previousIndex = (index - 1 + nodes.length) % nodes.length;
    const nextIndex = (index + 1) % nodes.length;
    const previousId = uniqueIds[previousIndex];
    const nextId = uniqueIds[nextIndex];
    const radiusKey = turnRadiusKey(previousId, uniqueIds[index], nextId);
    const desiredRadiusCm = turnRadiusOverrideCm(
      previousId, uniqueIds[index], nextId, settings.curveRadiusCm
    );
    const desiredCutMm = Math.max(0, desiredRadiusCm * 10 * tangent);
    corners.push({
      index,
      nodeId: uniqueIds[index],
      previousId,
      nextId,
      radiusKey,
      desiredRadiusCm,
      radiusOverridden: Object.prototype.hasOwnProperty.call(
        state.turnRadiusEditor.overrides, radiusKey
      ),
      angle,
      direction,
      tangent,
      desiredCutMm,
      cutDistanceMm: desiredCutMm
    });
  });

  if (!corners.length) return { closed, nodes, corners, virtualStretches };

  const first = corners[0];
  const last = corners[corners.length - 1];
  const firstCorridorMm = routeDistanceForward(nodes, 0, first.index, false);
  const lastCorridorMm = closed
    ? routeDistanceForward(nodes, last.index, 0, true)
    : routeDistanceForward(nodes, last.index, nodes.length - 1, false);
  first.cutDistanceMm = Math.min(first.cutDistanceMm, Math.max(0, firstCorridorMm - turnCorridorRemainderMm));
  last.cutDistanceMm = Math.min(last.cutDistanceMm, Math.max(0, lastCorridorMm - turnCorridorRemainderMm));

  for (let cornerIndex = 0; cornerIndex < corners.length - 1; cornerIndex += 1) {
    const corner = corners[cornerIndex];
    const next = corners[cornerIndex + 1];
    const corridorLength = routeDistanceForward(nodes, corner.index, next.index, false);
    const available = Math.max(0, corridorLength - turnCorridorRemainderMm);
    const firstDemand = corner.desiredCutMm;
    const secondDemand = next.desiredCutMm;
    let firstAllocation = firstDemand;
    let secondAllocation = secondDemand;
    if (firstDemand + secondDemand > available) {
      if (firstDemand <= available / 2) {
        secondAllocation = available - firstDemand;
      } else if (secondDemand <= available / 2) {
        firstAllocation = available - secondDemand;
      } else {
        firstAllocation = available / 2;
        secondAllocation = available / 2;
      }
    }
    corner.cutDistanceMm = Math.min(corner.cutDistanceMm, firstAllocation);
    next.cutDistanceMm = Math.min(next.cutDistanceMm, secondAllocation);
  }

  corners.forEach((corner) => {
    const radiusMm = corner.tangent > geometryEpsilon ? corner.cutDistanceMm / corner.tangent : 0;
    const previousIndex = (corner.index - 1 + nodes.length) % nodes.length;
    const nextIndex = (corner.index + 1) % nodes.length;
    const current = nodes[corner.index];
    const previous = nodes[previousIndex];
    const next = nodes[nextIndex];
    const inPoint = routePointFromIndex(nodes, corner.index, -1, corner.cutDistanceMm, closed);
    const outPoint = routePointFromIndex(nodes, corner.index, 1, corner.cutDistanceMm, closed);
    const toPreviousLength = distanceBetweenNodes(current, previous);
    const toNextLength = distanceBetweenNodes(current, next);
    const uPrev = {
      x: (previous.x - current.x) / toPreviousLength,
      y: (previous.y - current.y) / toPreviousLength
    };
    const uNext = {
      x: (next.x - current.x) / toNextLength,
      y: (next.y - current.y) / toNextLength
    };
    const bisectorLength = Math.hypot(uPrev.x + uNext.x, uPrev.y + uNext.y);
    const interiorAngle = Math.PI - corner.angle;
    const centerDistance = radiusMm / Math.max(Math.sin(interiorAngle / 2), 0.001);
    const center = {
      x: current.x + ((uPrev.x + uNext.x) / bisectorLength) * centerDistance,
      y: current.y + ((uPrev.y + uNext.y) / bisectorLength) * centerDistance
    };
    const startAngle = Math.atan2(inPoint.y - center.y, inPoint.x - center.x);
    const endAngle = Math.atan2(outPoint.y - center.y, outPoint.x - center.x);
    const normalize = (value) => {
      let result = value;
      while (result < 0) result += Math.PI * 2;
      while (result >= Math.PI * 2) result -= Math.PI * 2;
      return result;
    };
    const ccwSpan = normalize(endAngle - startAngle);
    const cwSpan = normalize(startAngle - endAngle);
    const span = Math.abs(ccwSpan - corner.angle) <= Math.abs(cwSpan - corner.angle) ? ccwSpan : -cwSpan;
    const arcDistanceMm = Math.abs(radiusMm * span);
    const steps = Math.max(8, Math.ceil(arcDistanceMm / 2.5));
    const arcPoints = [];
    for (let step = 0; step <= steps; step += 1) {
      const pointAngle = startAngle + span * (step / steps);
      arcPoints.push({
        x: center.x + Math.cos(pointAngle) * radiusMm,
        y: center.y + Math.sin(pointAngle) * radiusMm
      });
    }
    const frictionSpeed = radiusMm > geometryEpsilon
      ? Math.sqrt(settings.gripAccelerationMps2 * radiusMm / 1000)
      : settings.curveSpeedMps;
    corner.radiusM = radiusMm / 1000;
    corner.speedMps = settings.speedModel === "friction"
      ? Math.min(settings.straightSpeedMps, frictionSpeed)
      : Math.min(settings.straightSpeedMps, settings.curveSpeedMps);
    corner.inPoint = inPoint;
    corner.outPoint = outPoint;
    corner.center = center;
    corner.arcPoints = arcPoints;
    corner.arcDistanceMm = arcDistanceMm;
  });

  return { closed, nodes, corners, virtualStretches };
}

function resamplePlannedPath(points, spacingMm = plannedPathSpacingMm) {
  if (points.length < 2) return points.slice();
  const cumulative = [0];
  for (let index = 1; index < points.length; index += 1) {
    cumulative.push(cumulative[index - 1] + pointDistance(points[index - 1], points[index]));
  }
  const total = cumulative[cumulative.length - 1];
  const result = [];
  let segmentIndex = 0;
  const appendAt = (distanceMm) => {
    while (segmentIndex < cumulative.length - 2 && cumulative[segmentIndex + 1] < distanceMm) segmentIndex += 1;
    const from = points[segmentIndex];
    const to = points[segmentIndex + 1];
    const length = cumulative[segmentIndex + 1] - cumulative[segmentIndex];
    const ratio = length > geometryEpsilon ? (distanceMm - cumulative[segmentIndex]) / length : 0;
    result.push({
      x: from.x + (to.x - from.x) * ratio,
      y: from.y + (to.y - from.y) * ratio,
      sMm: distanceMm,
      speedMps: from.speedMps + ((to.speedMps ?? from.speedMps) - from.speedMps) * ratio
    });
  };
  for (let distanceMm = 0; distanceMm < total - geometryEpsilon; distanceMm += spacingMm) appendAt(distanceMm);
  appendAt(total);
  return result;
}

function applyGlobalSpeedConstraints(points, accelerationOrSettings, closed = false) {
  if (!Array.isArray(points) || points.length < 2) return points.slice();
  const settings = typeof accelerationOrSettings === "object" && accelerationOrSettings
    ? accelerationOrSettings
    : null;
  const acceleration = Math.max(0.01, Number(
    settings ? settings.accelerationMps2 : accelerationOrSettings
  ) || 0.01);
  const deceleration = Math.max(0.01, Number(
    settings ? settings.decelerationMps2 : accelerationOrSettings
  ) || acceleration);
  const result = points.map((point) => ({
    ...point,
    speedMps: Math.max(0, Number(point.speedMps) || 0)
  }));
  const curvatureGap = 20;
  const wheelBaseM = 0.12;
  const wheelSpeedExtraMps = 0.7;
  const wheelCorrectionReserveMps = 0.4;
  const wheelAccelReserveRatio = 0.85;
  const wheelCoefficientMinimum = 0.05;
  const minimumSpeedMps = 0.4;
  const curvature = result.map((point, index) => {
    const previousIndex = Math.max(0, index - curvatureGap);
    const nextIndex = Math.min(result.length - 1, index + curvatureGap);
    if (previousIndex === index || nextIndex === index) return 0;
    const previous = result[previousIndex];
    const next = result[nextIndex];
    const a = pointDistance(previous, point);
    const b = pointDistance(point, next);
    const c = pointDistance(previous, next);
    if (a <= geometryEpsilon || b <= geometryEpsilon || c <= geometryEpsilon) return 0;
    const cross = (point.x - previous.x) * (next.y - previous.y)
      - (point.y - previous.y) * (next.x - previous.x);
    return 2000 * cross / (a * b * c);
  });
  const wheelCoefficient = (curve, rightWheel) => 1 + (rightWheel ? 1 : -1) * wheelBaseM * 0.5 * curve;
  const speedClamp = (speed) => Math.max(minimumSpeedMps,
    Math.min(settings?.straightSpeedMps ?? Number.POSITIVE_INFINITY, speed));
  const availableAcceleration = (_speed, _curve, braking) => {
    return braking ? deceleration : acceleration;
  };
  const transitionCap = (cap, sourceSpeed, sourceCurve, targetCurve, distanceM, accel) => {
    const targetLeft = wheelCoefficient(targetCurve, false);
    const targetRight = wheelCoefficient(targetCurve, true);
    if (targetLeft <= wheelCoefficientMinimum || targetRight <= wheelCoefficientMinimum) {
      return minimumSpeedMps;
    }
    const sourceLeft = Math.max(0, wheelCoefficient(sourceCurve, false));
    const sourceRight = Math.max(0, wheelCoefficient(sourceCurve, true));
    const reservedAccel = accel * wheelAccelReserveRatio;
    const leftAllowed = Math.sqrt((sourceSpeed * sourceLeft) ** 2 + 2 * reservedAccel * distanceM) / targetLeft;
