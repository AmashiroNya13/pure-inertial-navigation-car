function drawConnections() {
  const effectiveLinks = getEffectiveLinks();
  if (!effectiveLinks.length || state.nodes.length < 2) {
    return;
  }

  ctx.save();
  ctx.strokeStyle = "rgba(35, 104, 196, 0.54)";
  ctx.lineWidth = 2;
  effectiveLinks.forEach((link) => {
    const from = nodeById(link.fromId);
    const to = nodeById(link.toId);
    if (!from || !to) {
      return;
    }
    const start = worldToScreen(from.x, from.y);
    const end = worldToScreen(to.x, to.y);
    ctx.beginPath();
    ctx.moveTo(start.x, start.y);
    ctx.lineTo(end.x, end.y);
    ctx.stroke();
  });
  ctx.restore();
}

function drawRouteHighlight() {
  if (!state.lastRoute || !state.lastRoute.ok || state.lastRoute.pathIds.length < 2) {
    return;
  }

  if (Array.isArray(state.lastRoute.plannedPathPoints) && state.lastRoute.plannedPathPoints.length > 1) {
    const points = state.lastRoute.plannedPathPoints;
    ctx.save();
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    for (let index = 1; index < points.length; index += 1) {
      const from = points[index - 1];
      const to = points[index];
      ctx.strokeStyle = speedToHeatColor((from.speedMps + to.speedMps) / 2);
      const start = worldToScreen(from.x, from.y);
      const end = worldToScreen(to.x, to.y);
      ctx.beginPath();
      ctx.moveTo(start.x, start.y);
      ctx.lineTo(end.x, end.y);
      ctx.stroke();
    }
    ctx.restore();
    return;
  }

  if (state.lastRoute.speedPieces) {
    const settings = state.lastRoute.speedSettings || readSpeedSettings();
    const pieces = state.lastRoute.speedPieces || buildRouteSpeedPieces(state.lastRoute.pathIds, settings);
    ctx.save();
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    pieces.forEach((piece) => {
      if (!piece.points || piece.points.length < 2) {
        return;
      }
      ctx.strokeStyle = speedToHeatColor(piece.speedMps);
      ctx.beginPath();
      piece.points.forEach((point, index) => {
        const screen = worldToScreen(point.x, point.y);
        if (index === 0) {
          ctx.moveTo(screen.x, screen.y);
        } else {
          ctx.lineTo(screen.x, screen.y);
        }
      });
      ctx.stroke();
    });
    ctx.restore();
    return;
  }

  ctx.save();
  ctx.strokeStyle = "rgba(19, 126, 87, 0.86)";
  ctx.lineWidth = 5;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  state.lastRoute.pathIds.forEach((id, index) => {
    const node = nodeById(id);
    if (!node) {
      return;
    }
    const point = worldToScreen(node.x, node.y);
    if (index === 0) {
      ctx.moveTo(point.x, point.y);
    } else {
      ctx.lineTo(point.x, point.y);
    }
  });
  ctx.stroke();
  ctx.restore();
}

function routeArcPieces() {
  return (state.lastRoute?.speedPieces || []).filter((piece) =>
    piece.type === "arc" && piece.radiusKey && Array.isArray(piece.points) && piece.points.length > 1
  );
}

function distanceToScreenSegment(point, start, end) {
  const dx = end.x - start.x;
  const dy = end.y - start.y;
  const lengthSq = dx * dx + dy * dy;
  if (lengthSq <= geometryEpsilon) return Math.hypot(point.x - start.x, point.y - start.y);
  const ratio = Math.max(0, Math.min(1,
    ((point.x - start.x) * dx + (point.y - start.y) * dy) / lengthSq
  ));
  return Math.hypot(point.x - (start.x + dx * ratio), point.y - (start.y + dy * ratio));
}

function nearestRouteArc(screenPoint, maxPixels = 14) {
  let nearest = null;
  let nearestDistance = Infinity;
  routeArcPieces().forEach((piece) => {
    for (let index = 1; index < piece.points.length; index += 1) {
      const distance = distanceToScreenSegment(
        screenPoint,
        worldToScreen(piece.points[index - 1].x, piece.points[index - 1].y),
        worldToScreen(piece.points[index].x, piece.points[index].y)
      );
      if (distance < nearestDistance) {
        nearestDistance = distance;
        nearest = piece;
      }
    }
  });
  return nearestDistance <= maxPixels ? nearest : null;
}

function updateTurnRadiusEditorControls(message = "") {
  const editor = state.turnRadiusEditor;
  const selected = routeArcPieces().find((piece) => piece.radiusKey === editor.selectedKey);
  els.turnRadiusEditBtn.disabled = !state.lastRoute?.ok || routeArcPieces().length === 0;
  els.turnRadiusEditBtn.classList.toggle("active", editor.active);
  els.turnRadiusEditBtn.textContent = editor.active ? "结束选弯" : "选择切弯";
  els.turnRadiusEditPanel.hidden = !editor.active;
  els.turnRadiusApplyBtn.disabled = !selected;
  els.turnRadiusRestoreBtn.disabled = !selected
    || !Object.prototype.hasOwnProperty.call(editor.overrides, selected.radiusKey);
  if (message) {
    els.turnRadiusEditStatus.textContent = message;
  } else if (!selected) {
    const riskCount = unsatisfiedTurnElementIds().size;
    els.turnRadiusEditStatus.textContent = riskCount
      ? `点击规划圆弧；当前有 ${riskCount} 个弯道元素仅被切弯经过，尚未指定缩小弯`
      : "点击图中的某一段规划圆弧进行编辑";
  } else {
    const previous = nodeById(selected.previousId)?.name || selected.previousId;
    const current = nodeById(selected.nodeId)?.name || selected.nodeId;
    const next = nodeById(selected.nextId)?.name || selected.nextId;
    const radiusCm = (selected.radiusM * 100).toFixed(1);
    els.turnRadiusEditStatus.textContent = `${previous} → ${current} → ${next}，当前有效半径 ${radiusCm} cm`;
  }
}

function selectTurnRadiusArc(piece) {
  state.turnRadiusEditor.selectedKey = piece.radiusKey;
  const globalRadiusCm = Math.max(0.1, Number(els.curveRadiusInput.value) || 10);
  const current = Number(state.turnRadiusEditor.overrides[piece.radiusKey]);
  els.turnRadiusOverrideInput.removeAttribute("max");
  els.turnRadiusOverrideInput.value = String(Number.isFinite(current)
    ? current : Math.max(0.1, Math.min(globalRadiusCm, piece.radiusM * 100)));
  updateTurnRadiusEditorControls();
  draw();
}

function refreshCurrentRouteAfterRadiusEdit(message) {
  if (els.routeModeSelect.value === "manual" && state.manualPathIds.length > 1) {
    updateManualRoutePreview(message);
  } else if (state.lastRoute?.ok) {
    attachMotionProfile(state.lastRoute, readSpeedSettings());
    updateRouteSummary(state.lastRoute);
    updateExportText();
    draw();
  }
  updateTurnRadiusEditorControls(message);
}

function applySelectedTurnRadius() {
  const piece = routeArcPieces().find((item) =>
    item.radiusKey === state.turnRadiusEditor.selectedKey
  );
  if (!piece) return;
  const radiusCm = Math.max(0.1, Number(els.turnRadiusOverrideInput.value) || 0.1);
  state.turnRadiusEditor.overrides[piece.radiusKey] = radiusCm;
  els.turnRadiusOverrideInput.value = String(radiusCm);
  refreshCurrentRouteAfterRadiusEdit(`已将所选元素切弯单独设为 ${radiusCm} cm，其他切弯保持不变`);
}

function restoreSelectedTurnRadius() {
  const key = state.turnRadiusEditor.selectedKey;
  if (!key || !Object.prototype.hasOwnProperty.call(state.turnRadiusEditor.overrides, key)) return;
  delete state.turnRadiusEditor.overrides[key];
  refreshCurrentRouteAfterRadiusEdit("所选切弯已恢复使用全局半径");
}

function plannedPhototubePoints() {
  const points = state.lastRoute?.plannedPathPoints || [];
  const offsetMm = Math.max(0, Number(els.phototubeOffsetInput.value) || 0);
  return points.map((point, index) => {
    const previous = points[Math.max(0, index - 1)] || point;
    const next = points[Math.min(points.length - 1, index + 1)] || point;
    const deltaX = next.x - previous.x;
    const deltaY = next.y - previous.y;
    const length = Math.hypot(deltaX, deltaY);
    const headingX = length > geometryEpsilon ? deltaX / length : 1;
    const headingY = length > geometryEpsilon ? deltaY / length : 0;
    return {
      x: point.x + headingX * offsetMm,
      y: point.y + headingY * offsetMm
    };
  });
}

function unsatisfiedTurnElementIds() {
  const pathIds = state.lastRoute?.pathIds || [];
  const result = new Set();
  const phototubePoints = plannedPhototubePoints();
  const routeNodeIds = new Set(pathIds.map(Number));
  state.nodes.forEach((node) => {
    if (node.type !== 1 || !routeNodeIds.has(Number(node.id))) return;
    const detected = phototubePoints.some((point) =>
      Math.abs(point.x - node.x) <= 75 && Math.abs(point.y - node.y) <= 75
    );
    if (!detected) result.add(node.id);
  });
  return result;
}

function drawTurnRadiusEditorOverlay() {
  if (!state.lastRoute?.ok) return;
  const editor = state.turnRadiusEditor;
  ctx.save();
  routeArcPieces().forEach((piece) => {
    const selected = piece.radiusKey === editor.selectedKey;
    const hovered = piece.radiusKey === editor.hoverKey;
    const overridden = Object.prototype.hasOwnProperty.call(editor.overrides, piece.radiusKey);
    if (!editor.active && !overridden) return;
    ctx.beginPath();
    piece.points.forEach((point, index) => {
      const screen = worldToScreen(point.x, point.y);
      if (index === 0) ctx.moveTo(screen.x, screen.y);
      else ctx.lineTo(screen.x, screen.y);
    });
    ctx.lineWidth = selected ? 10 : (hovered ? 8 : 4);
    ctx.strokeStyle = selected ? "rgba(0, 105, 92, 0.95)"
      : (overridden ? "rgba(194, 54, 70, 0.92)" : "rgba(0, 121, 107, 0.62)");
    ctx.stroke();
  });
  if (editor.active) unsatisfiedTurnElementIds().forEach((nodeId) => {
    const node = nodeById(nodeId);
    if (!node) return;
    const point = worldToScreen(node.x, node.y);
    ctx.beginPath();
    ctx.arc(point.x, point.y, 17, 0, Math.PI * 2);
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(211, 47, 47, 0.95)";
    ctx.setLineDash([4, 3]);
    ctx.stroke();
    ctx.setLineDash([]);
  });
  ctx.restore();
}

function drawManualCorrectionZones() {
  if (!els.showCorrectionExclusionZones.checked || !state.manualCorrectionZones.length) return;
  ctx.save();
  state.manualCorrectionZones.forEach((zone, index) => {
    const center = worldToScreen(zone.x_mm, zone.y_mm);
    const radius = Math.max(4, zone.radius_mm * Math.abs(state.view.scaleX));
    ctx.beginPath();
    ctx.arc(center.x, center.y, radius, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(195, 54, 70, 0.12)";
    ctx.strokeStyle = "rgba(195, 54, 70, 0.9)";
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.fill();
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#c33646";
    ctx.font = "bold 11px Segoe UI, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(String(index + 1), center.x, center.y);
  });
  ctx.restore();
}

function drawCorrectionExclusionPathRanges() {
  if (!els.showCorrectionExclusionZones.checked) return;
  const points = plannedPhototubePoints();
  if (points.length < 2) return;
  ctx.save();
  ctx.strokeStyle = "rgba(195, 54, 70, 0.88)";
  ctx.lineWidth = 9;
  ctx.lineCap = "round";
  manualCorrectionZonePathRanges().forEach((range) => {
    ctx.beginPath();
    for (let index = range.start_index; index <= range.end_index; index += 1) {
      const point = worldToScreen(points[index].x, points[index].y);
      if (index === range.start_index) ctx.moveTo(point.x, point.y);
      else ctx.lineTo(point.x, point.y);
    }
    ctx.stroke();
  });
  ctx.restore();
}

function drawManualRouteOverlay() {
  if (els.routeModeSelect.value !== "manual" || !state.manualPathIds.length) return;
  ctx.save();
  ctx.strokeStyle = "rgba(17, 24, 39, 0.72)";
  ctx.lineWidth = 2;
  ctx.setLineDash([7, 5]);
  ctx.beginPath();
  state.manualPathIds.forEach((id, index) => {
    const node = nodeById(id);
    if (!node) return;
    const point = worldToScreen(node.x, node.y);
    if (index === 0) ctx.moveTo(point.x, point.y);
    else ctx.lineTo(point.x, point.y);
  });
  ctx.stroke();
  ctx.setLineDash([]);

  state.manualStopIds.forEach((id, index) => {
    const node = nodeById(id);
    if (!node) return;
    const point = worldToScreen(node.x, node.y);
    const offsetX = 12 + index % 3 * 18;
    const offsetY = -12 - index % 4 * 15;
    const label = String(index + 1);
    ctx.beginPath();
    ctx.arc(point.x + offsetX, point.y + offsetY, 10, 0, Math.PI * 2);
    ctx.fillStyle = index === state.manualStopIds.length - 1 ? "#d12f3d" : "#111827";
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 10px Segoe UI, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(label, point.x + offsetX, point.y + offsetY);
  });
  ctx.restore();
}

function drawAlternatingTurnGuides() {
  const stretches = state.lastRoute?.alternatingTurnTransitions || [];
  if (!stretches.length) return;

  const affectedNodeIds = new Set();
  stretches.forEach((stretch) => {
    affectedNodeIds.add(stretch.firstNodeId);
    affectedNodeIds.add(stretch.secondNodeId);
  });
  const drawnCircles = new Set();
  (state.lastRoute.speedPieces || []).forEach((piece) => {
    if (piece.type !== "arc" || !piece.center || !Number.isFinite(piece.radiusM)
        || !affectedNodeIds.has(piece.nodeId)) return;
    const radiusMm = piece.radiusM * 1000;
    const circleKey = `${piece.nodeId}:${formatNumber(piece.center.x)}:${formatNumber(piece.center.y)}:${formatNumber(radiusMm)}`;
    if (drawnCircles.has(circleKey)) return;
    drawnCircles.add(circleKey);
    ctx.save();
    ctx.strokeStyle = "rgba(192, 38, 119, 0.55)";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    for (let step = 0; step <= 48; step += 1) {
      const angle = Math.PI * 2 * step / 48;
      const point = worldToScreen(
        piece.center.x + Math.cos(angle) * radiusMm,
        piece.center.y + Math.sin(angle) * radiusMm
      );
      if (step === 0) ctx.moveTo(point.x, point.y);
      else ctx.lineTo(point.x, point.y);
    }
    ctx.stroke();
    ctx.restore();
  });

  const shown = new Set();
  stretches.forEach((stretch) => {
    const key = `${stretch.firstNodeId}:${stretch.secondNodeId}:${stretch.firstVirtual.x}:${stretch.firstVirtual.y}`;
    if (shown.has(key)) return;
    shown.add(key);
    const firstOriginal = worldToScreen(stretch.firstOriginal.x, stretch.firstOriginal.y);
    const secondOriginal = worldToScreen(stretch.secondOriginal.x, stretch.secondOriginal.y);
    const firstVirtual = worldToScreen(stretch.firstVirtual.x, stretch.firstVirtual.y);
    const secondVirtual = worldToScreen(stretch.secondVirtual.x, stretch.secondVirtual.y);

    ctx.save();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(192, 38, 119, 0.78)";
    ctx.setLineDash([7, 5]);
    ctx.beginPath();
    ctx.moveTo(firstVirtual.x, firstVirtual.y);
    ctx.lineTo(secondVirtual.x, secondVirtual.y);
    ctx.stroke();
    ctx.setLineDash([3, 4]);
    [[firstOriginal, firstVirtual], [secondOriginal, secondVirtual]].forEach(([from, to]) => {
      if (Math.hypot(from.x - to.x, from.y - to.y) <= 0.5) return;
      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
      ctx.stroke();
    });
    [secondVirtual].forEach((point) => {
      ctx.fillStyle = "#c02677";
      ctx.beginPath();
      ctx.arc(point.x, point.y, 5, 0, Math.PI * 2);
      ctx.fill();
    });

    if (!els.showLabels.checked) {
      ctx.restore();
      return;
    }

    const firstName = nodeById(stretch.firstNodeId)?.name || stretch.firstNodeId;
    const secondName = nodeById(stretch.secondNodeId)?.name || stretch.secondNodeId;
    const xOnlyShift = Math.abs(stretch.firstOriginal.x - stretch.secondOriginal.x) <= geometryEpsilon
      && Math.abs(stretch.firstVirtual.x - stretch.secondVirtual.x) <= geometryEpsilon
      && Math.abs(stretch.firstOriginal.y - stretch.firstVirtual.y) <= geometryEpsilon
      && Math.abs(stretch.secondOriginal.y - stretch.secondVirtual.y) <= geometryEpsilon;
    const coordinateText = xOnlyShift
      ? ` · x ${formatNumber(stretch.firstOriginal.x)}→${formatNumber(stretch.firstVirtual.x)}，y不变`
      : "";
    const bottomStartName = nodeById(stretch.bottomStartNodeId)?.name || stretch.bottomStartNodeId;
    const bottomEndName = nodeById(stretch.bottomEndNodeId)?.name || stretch.bottomEndNodeId;
    const label = `回头弯 ${bottomStartName}↔${bottomEndName} 元素连线 ${formatNumber(stretch.elementConnectionDistanceMm)} mm · 虚拟 ${firstName}→${secondName} 向拱起侧 ${formatNumber(stretch.addedDepthMm)} mm${coordinateText}`;
    const labelCenterX = (firstVirtual.x + secondVirtual.x) / 2;
    const y = (firstVirtual.y + secondVirtual.y) / 2 - 15;
    ctx.font = "12px Segoe UI, Microsoft YaHei, sans-serif";
    const width = ctx.measureText(label).width + 12;
    const x = Math.max(
      state.view.margin.left + width / 2 + 4,
      Math.min(state.view.margin.left + state.view.plotW - width / 2 - 4, labelCenterX)
    );
    ctx.fillStyle = "rgba(255, 255, 255, 0.94)";
    ctx.fillRect(x - width / 2, y - 10, width, 20);
    ctx.strokeStyle = "rgba(192, 38, 119, 0.55)";
    ctx.setLineDash([]);
    ctx.strokeRect(x - width / 2, y - 10, width, 20);
    ctx.fillStyle = "#9d174d";
    ctx.textBaseline = "middle";
    ctx.fillText(label, x - width / 2 + 6, y);
    ctx.restore();
  });
}

function drawMarker(node, highlighted) {
  const point = worldToScreen(node.x, node.y);
  const size = Math.max(Number(els.pointSize.value) || 9, 4);
  const info = typeInfo[node.type];
  const selected = state.pendingNode === node || state.selectedNodeId === node.id;
  const segmentOffsetSelected = state.segmentOffset.active && state.segmentOffset.selectedIds.includes(node.id);

  ctx.save();
  ctx.lineWidth = highlighted || selected ? 4 : 2.5;
  ctx.strokeStyle = info.color;
  ctx.fillStyle = `${info.color}22`;

  if (info.shape === "circle") {
    ctx.beginPath();
    ctx.arc(point.x, point.y, size, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.rect(point.x - size, point.y - size, size * 2, size * 2);
    ctx.fill();
    ctx.stroke();
  }

  if (els.showLabels.checked) {
    const label = `${node.name} (${formatNumber(node.x)}, ${formatNumber(node.y)})`;
    ctx.font = "12px Segoe UI, Microsoft YaHei, sans-serif";
    const textW = ctx.measureText(label).width;
    const tx = Math.min(point.x + size + 8, els.plot.width - textW - 8);
    const ty = Math.max(point.y - size - 8, 18);
    ctx.fillStyle = "rgba(255, 255, 255, 0.88)";
    ctx.strokeStyle = "rgba(217, 222, 231, 0.9)";
    roundRect(tx - 5, ty - 14, textW + 10, 19, 5);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#1e2530";
    ctx.fillText(label, tx, ty);
  }

  if (selected) {
    ctx.beginPath();
    ctx.arc(point.x, point.y, size + 8, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(35, 104, 196, 0.72)";
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
  }

  if (segmentOffsetSelected) {
    ctx.beginPath();
    ctx.arc(point.x, point.y, size + 12, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(0, 137, 123, 0.92)";
    ctx.lineWidth = 3;
    ctx.setLineDash([]);
    ctx.stroke();
  }

  ctx.restore();
}

function drawSegmentOffsetPreview() {
  const tool = state.segmentOffset;
  if (!tool.active || !tool.startId) return;
  const from = nodeById(tool.startId);
  const to = nodeById(tool.endId);
  if (!from || !to) return;
  const offset = segmentOffsetValues();
  const fromScreen = worldToScreen(from.x, from.y);
  const toScreen = worldToScreen(to.x, to.y);
  const shiftedFrom = worldToScreen(from.x + offset.x, from.y + offset.y);
  const shiftedTo = worldToScreen(to.x + offset.x, to.y + offset.y);

  ctx.save();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = "rgba(0, 137, 123, 0.85)";
  ctx.setLineDash([7, 5]);
  ctx.beginPath();
  ctx.moveTo(fromScreen.x, fromScreen.y);
  ctx.lineTo(toScreen.x, toScreen.y);
  ctx.stroke();

  ctx.strokeStyle = "rgba(195, 54, 70, 0.88)";
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(shiftedFrom.x, shiftedFrom.y);
  ctx.lineTo(shiftedTo.x, shiftedTo.y);
  ctx.stroke();

  ctx.strokeStyle = "rgba(195, 54, 70, 0.4)";
  ctx.lineWidth = 1;
  tool.selectedIds.forEach((id) => {
    const node = nodeById(id);
    if (!node) return;
    const original = worldToScreen(node.x, node.y);
    const shifted = worldToScreen(node.x + offset.x, node.y + offset.y);
    ctx.beginPath();
    ctx.moveTo(original.x, original.y);
    ctx.lineTo(shifted.x, shifted.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(shifted.x, shifted.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(195, 54, 70, 0.88)";
    ctx.fill();
  });
  ctx.restore();
}

function drawStartMarker() {
  const startId = Number(els.startNodeSelect.value);
  const node = startId ? nodeById(startId) : null;
  if (!node) {
    return;
  }

  const point = worldToScreen(node.x, node.y);
  ctx.save();
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#e11924";
  ctx.fillStyle = "rgba(225, 25, 36, 0.96)";
  ctx.beginPath();
  ctx.arc(point.x, point.y, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(point.x, point.y, 13, 0, Math.PI * 2);
  ctx.stroke();
  if (els.showLabels.checked) {
    ctx.fillStyle = "#e11924";
    ctx.font = "12px Segoe UI, Microsoft YaHei, sans-serif";
    ctx.fillText("起点", point.x + 15, point.y + 4);
  }
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawEmpty() {
  clearCanvas();
  state.view = buildView([]);
  drawGrid();
  ctx.save();
  ctx.fillStyle = "#677181";
  ctx.font = "16px Segoe UI, Microsoft YaHei, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("等待节点数据", els.plot.width / 2, els.plot.height / 2);
  ctx.restore();
}

function draw() {
  resizeCanvas();
  if (!state.nodes.length) {
    drawEmpty();
    return;
  }

  const viewPoints = state.lastRoute?.plannedPathPoints?.length
    ? [...state.nodes, ...state.lastRoute.plannedPathPoints]
    : state.nodes;
  state.view = buildView(viewPoints);
  clearCanvas();
  drawGrid();
  drawConnections();
  drawRouteHighlight();
  drawAlternatingTurnGuides();
  drawRouteDirectionArrows();
  drawTurnSpeedLabels();
  drawTurnRadiusEditorOverlay();
  drawManualCorrectionZones();
  drawCorrectionExclusionPathRanges();
  drawSegmentOffsetPreview();
  state.nodes.forEach((node) => drawMarker(node, node === state.hoverNode));
  drawStartMarker();
  drawManualRouteOverlay();
  updateTurnRadiusEditorControls();
  updateReadout();
}

function updateStats() {
  const counts = { 0: 0, 1: 0, 2: 0 };
  const effectiveLinks = getEffectiveLinks();
  state.nodes.forEach((node) => {
    counts[node.type] += 1;
  });
  els.count0.textContent = counts[0];
  els.count1.textContent = counts[1];
  els.count2.textContent = counts[2];
  els.totalPill.textContent = `${state.nodes.length} 个节点`;
  els.linePill.textContent = `${state.links.length} 条连线 / ${effectiveLinks.length} 条有效线段`;
  updateStartNodeOptions();
  updateLineHint();
  updateSelectedTypeControl();
}

function renderTable() {
  if (!state.nodes.length) {
    els.nodeTable.innerHTML = '<tr><td colspan="7" class="empty">暂无节点</td></tr>';
    return;
  }

  const degrees = new Map(state.nodes.map((node) => [node.id, 0]));
  getEffectiveLinks().forEach((link) => {
    const from = nodeById(link.fromId);
    const to = nodeById(link.toId);
    if (!from || !to) {
      return;
    }
    const segmentNodeIds = getSegmentNodeIds(from, to);
    for (let i = 0; i < segmentNodeIds.length - 1; i += 1) {
      degrees.set(segmentNodeIds[i], (degrees.get(segmentNodeIds[i]) || 0) + 1);
      degrees.set(segmentNodeIds[i + 1], (degrees.get(segmentNodeIds[i + 1]) || 0) + 1);
    }
  });

  els.nodeTable.innerHTML = state.nodes.map((node) => `
    <tr>
      <td>${node.id}</td>
      <td>${escapeHtml(node.name)}</td>
      <td>${formatNumber(node.x)}</td>
      <td>${formatNumber(node.y)}</td>
      <td>${node.type}</td>
      <td>${node.typeLabel}</td>
      <td>${degrees.get(node.id) || 0}</td>
    </tr>
  `).join("");
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function updateStartNodeOptions() {
  const previous = els.startNodeSelect.value;
  els.startNodeSelect.innerHTML = state.nodes.map((node) => {
    return `<option value="${node.id}">${node.name} (${formatNumber(node.x)}, ${formatNumber(node.y)})</option>`;
  }).join("");

  if (previous && state.nodes.some((node) => String(node.id) === previous)) {
    els.startNodeSelect.value = previous;
  } else if (state.nodes.length) {
    els.startNodeSelect.value = String(state.nodes[0].id);
  }

  els.startNodeSelect.disabled = !state.nodes.length;
  updateStopNodeOptions();
}

function updateStopNodeOptions(route = state.lastRoute) {
  const previous = els.stopNodeSelect.value;
  const routeIds = route && Array.isArray(route.pathIds) ? new Set(route.pathIds.map(String)) : null;
  const candidates = state.nodes.filter((node) => !routeIds || routeIds.has(String(node.id)));
  els.stopNodeSelect.innerHTML = candidates.map((node) =>
    `<option value="${node.id}">${node.name} (${node.id})</option>`
  ).join("");
  const startValue = els.startNodeSelect.value;
  els.stopNodeSelect.value = candidates.some((node) => String(node.id) === previous) ? previous : startValue;
  els.stopNodeSelect.disabled = !candidates.length;
}

function routeToNames(ids) {
  return ids.map((id) => nodeById(id)?.name || `P${id}`);
}

function routeEdgeLines(ids) {
  if (!Array.isArray(ids) || ids.length < 2) return [];
  const lines = [];
  for (let index = 1; index < ids.length; index += 1) {
    lines.push(`${ids[index - 1]}-${ids[index]}`);
  }
  return lines;
}

function updateRouteEdgeText(route = state.lastRoute) {
  const lines = route && route.ok ? routeEdgeLines(route.pathIds) : [];
  els.routeEdgeText.value = lines.join("\n");
  els.copyRouteEdgesBtn.disabled = !lines.length;
  if (!lines.length) {
    els.routeEdgeSummary.textContent = "尚未生成路线";
    return;
  }
  const routeIndex = state.routeCandidates.indexOf(route);
  const candidate = routeIndex >= 0 && state.routeCandidates.length > 1
    ? `方案 ${routeIndex + 1}/${state.routeCandidates.length} · `
    : "";
  els.routeEdgeSummary.textContent =
    `${candidate}${route.pathIds.length} 个经过节点 · ${lines.length} 段`;
}

function routeOptionLabel(route, index) {
  const kind = route.algorithm === "greedy"
    ? "贪心"
    : (route.algorithm === "fastest"
        ? "最快"
        : (route.algorithm === "optimized" ? "深度" : (route.algorithm === "manual" ? "手动" : "候选")));
  if ((route.algorithm === "fastest" || route.algorithm === "optimized") && Number.isFinite(route.timeSeconds)) {
    return `${kind} ${index + 1}: ${formatNumber(route.timeSeconds)} s / ${formatNumber(route.effectiveDistanceMm)} mm`;
  }
  if (route.algorithm === "exact") {
    return `${kind} ${index + 1}: 反向 ${route.alternatingTurnCount || 0} 次 / ${formatNumber(route.distance)} mm`;
  }
  if (Number.isFinite(route.timeSeconds)) {
    return `${kind} ${index + 1}: ${formatNumber(route.distance)} mm / ${formatNumber(route.timeSeconds)} s`;
  }
  return `${kind} ${index + 1}: ${formatNumber(route.distance)} mm`;
}

function updateRouteCandidateOptions() {
  els.routeCandidateSelect.innerHTML = state.routeCandidates.map((route, index) => {
    return `<option value="${index}">${routeOptionLabel(route, index)}</option>`;
  }).join("");
  els.routeCandidateSelect.disabled = state.routeCandidates.length <= 1;
  if (state.routeCandidates.length) {
    els.routeCandidateSelect.value = String(state.selectedRouteIndex);
  }
  const selectedRoute = state.routeCandidates[state.selectedRouteIndex];
  const selectedPath = selectedRoute?.pathIds || [];
  els.reverseRouteBtn.disabled = selectedPath.length < 2 || selectedPath[0] !== selectedPath[selectedPath.length - 1];
  els.reverseRouteBtn.textContent = state.routeDirectionReversed ? "恢复原方向" : "反转当前路线";

  els.routeRanking.innerHTML = "";
  state.routeCandidates.slice(0, ROUTE_CANDIDATE_COUNT).forEach((route, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.classList.toggle("active", index === state.selectedRouteIndex);
    const primaryMetric = (route.algorithm === "fastest" || route.algorithm === "optimized") && Number.isFinite(route.timeSeconds)
      ? `${formatNumber(route.timeSeconds)} s`
      : (route.algorithm === "exact" ? `反向 ${route.alternatingTurnCount || 0} 次` : `${formatNumber(route.distance)} mm`);
    const secondaryMetric = route.algorithm === "exact"
      ? `900 mm 内反向间距和 ${formatNumber(route.alternatingTurnDistanceMm || 0)} mm · 路径 ${formatNumber(route.distance)} mm · ${formatNumber(route.timeSeconds)} s`
      : (route.algorithm === "optimized"
          ? `反向 ${route.alternatingTurnCount || 0} 次 · 间距和 ${formatNumber(route.alternatingTurnDistanceMm || 0)} mm · 路径 ${formatNumber(route.distance)} mm`
          : (Number.isFinite(route.timeSeconds)
              ? `${formatNumber(route.timeSeconds)} s · 切弯 ${formatNumber(route.effectiveDistanceMm)} mm · ${route.turnCount || 0} 弯`
              : `${route.pathIds.length} 个经过节点`));
    button.innerHTML = `<span class="rank-number">第 ${index + 1} 名 · ${primaryMetric}</span>${secondaryMetric}`;
    button.title = routeToNames(route.pathIds).join(" -> ");
    button.addEventListener("click", () => {
      if (state.optimizerRunning) state.optimizerSelectionLocked = true;
      updateStopNodeOptions(route);
      selectRouteCandidate(index);
    });
    els.routeRanking.appendChild(button);
  });
}

function selectRouteCandidate(index) {
  state.turnRadiusEditor.selectedKey = null;
  state.turnRadiusEditor.hoverKey = null;
  if (!state.routeCandidates.length) {
    state.selectedRouteIndex = 0;
    state.lastRoute = null;
    updateRouteCandidateOptions();
    updateRouteSummary(null);
    updateOptimizerSeedControls();
    updateExportText();
    draw();
    return;
  }

  const nextIndex = Math.max(0, Math.min(index, state.routeCandidates.length - 1));
  state.selectedRouteIndex = nextIndex;
  state.lastRoute = buildTraversalRoute(state.routeCandidates[nextIndex]);
  updateRouteCandidateOptions();
  updateRouteSummary(state.lastRoute);
  updateRouteEdgeText(state.lastRoute);
  updateOptimizerSeedControls();
  updateExportText();
  draw();
}

function optimizerPreviewSelectionIndex(routes, selectedSignature, selectionLocked) {
  if (!selectionLocked || !selectedSignature) return 0;
  const preservedIndex = routes.findIndex((route) => route.pathIds.join("-") === selectedSignature);
  return preservedIndex >= 0 ? preservedIndex : 0;
}

function manualCorrectionZonePathRanges() {
  // ptzone is defined against the vehicle turning-center path. The firmware
  // applies the physical phototube forward offset when checking each zone.
  const points = state.lastRoute?.plannedPathPoints || [];
  const entryExtensionMm = Math.max(0, Number(els.manualCorrectionZoneEntry.value) || 0) * 10;
  const exitExtensionMm = Math.max(0, Number(els.manualCorrectionZoneExit.value) || 0) * 10;
  const expandStart = (index) => {
    let distanceMm = 0;
    let result = index;
    while (result > 0 && distanceMm < entryExtensionMm) {
      distanceMm += Math.hypot(points[result].x - points[result - 1].x,
        points[result].y - points[result - 1].y);
      result -= 1;
    }
    return result;
  };
  const expandEnd = (index) => {
    let distanceMm = 0;
    let result = index;
    while (result < points.length - 1 && distanceMm < exitExtensionMm) {
      distanceMm += Math.hypot(points[result + 1].x - points[result].x,
        points[result + 1].y - points[result].y);
      result += 1;
    }
    return result;
  };
  return state.manualCorrectionZones.flatMap((zone, zoneIndex) => {
    const inside = points.map((point) => (
      Math.hypot(point.x - zone.x_mm, point.y - zone.y_mm) <= zone.radius_mm
    ));
    const ranges = [];
    let startIndex = -1;
    inside.forEach((isInside, index) => {
      if (isInside && startIndex < 0) startIndex = index;
      if ((!isInside || index === inside.length - 1) && startIndex >= 0) {
        ranges.push({
          zone_index: zoneIndex + 1,
          start_index: expandStart(startIndex),
          end_index: expandEnd(isInside ? index : index - 1),
          entry_extension_mm: entryExtensionMm,
          exit_extension_mm: exitExtensionMm
        });
        startIndex = -1;
      }
    });
    return ranges;
  });
}

function downloadExportJson() {
  updateExportText();
  const blob = new Blob([els.exportText.value], { type: "application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.download = `node-route-${new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19)}.json`;

function alternatingTurnStretchSummary(route) {
  const settings = route?.speedSettings || readSpeedSettings();
  if (!settings.alternatingTurnOffsetEnabled) return "短几字弯头部外移已关闭";
  const stretches = route?.alternatingTurnTransitions || [];
  if (!stretches.length) {
    return `几字弯头部外移 0 组（只处理整体航向反转，且左/右转元素坐标连线距离小于 ${formatNumber(settings.alternatingTurnThresholdMm)} mm 的几字弯）`;
  }
  const details = stretches.slice(0, 4).map((stretch) => {
    const first = nodeById(stretch.firstNodeId)?.name || stretch.firstNodeId;
    const second = nodeById(stretch.secondNodeId)?.name || stretch.secondNodeId;
    const bottomStart = nodeById(stretch.bottomStartNodeId)?.name || stretch.bottomStartNodeId;
    const bottomEnd = nodeById(stretch.bottomEndNodeId)?.name || stretch.bottomEndNodeId;
    return `${bottomStart}↔${bottomEnd} 元素连线 ${formatNumber(stretch.elementConnectionDistanceMm)} mm；虚拟 ${first}→${second} 向拱起侧外移 ${formatNumber(stretch.addedDepthMm)} mm`;
  });
  const remainder = stretches.length > details.length ? `，另 ${stretches.length - details.length} 组` : "";
  return `几字弯头部外移 ${stretches.length} 组：${details.join("，")}${remainder}`;
}

function updateRouteSummary(route) {
  if (!route) {
    els.routeSummary.textContent = "选择起点后计算最短路径";
    updateRouteEdgeText(null);
    return;
  }

  if (!route.ok) {
    els.routeSummary.textContent = route.message;
    updateRouteEdgeText(null);
    return;
  }
  updateRouteEdgeText(route);

  const routeIndex = state.routeCandidates.indexOf(route);
  const routePrefix = routeIndex >= 0 && state.routeCandidates.length > 1 ? `方案 ${routeIndex + 1}/${state.routeCandidates.length}；` : "";
  if (route.algorithm === "fastest") {
    const suffix = route.message ? `；${route.message}` : "";
    const turnText = Number.isFinite(route.turnCount) ? `；估算弯道 ${route.turnCount} 个` : "";
    const modelText = route.speedSettings?.speedModel === "friction" ? "摩擦圆限速" : "固定过弯速度";
    const traversal = route.traversal
      ? `；计划 ${route.traversal.lapCount} 圈，第 ${route.traversal.stopLap} 圈停在 ${nodeById(route.traversal.stopNodeId)?.name || route.traversal.stopNodeId}`
      : "";
    els.routeSummary.textContent = `${routePrefix}最快闭环时间 ${formatNumber(route.timeSeconds)} s；${modelText}；${alternatingTurnStretchSummary(route)}；切弯后距离 ${formatNumber(route.effectiveDistanceMm)} mm；中心线距离 ${formatNumber(route.distance)} mm${turnText}${traversal}；路线：${routeToNames(route.pathIds).join(" -> ")}${suffix}`;
    return;
  }
  const prefix = route.algorithm === "greedy"
    ? "快速贪心闭环距离"
    : (route.algorithm === "manual" ? "手动路径距离" : (route.exact ? "最短闭环距离" : "候选闭环距离"));
  const suffix = route.message ? `；${route.message}` : "";
  const traversal = route.traversal
    ? `；计划 ${route.traversal.lapCount} 圈，第 ${route.traversal.stopLap} 圈停在 ${nodeById(route.traversal.stopNodeId)?.name || route.traversal.stopNodeId}`
    : "";
  const modelText = route.speedSettings?.speedModel === "friction" ? "摩擦圆限速" : "固定过弯速度";
  const planningText = Number.isFinite(route.timeSeconds)
    ? `；900 mm 内反向转弯 ${route.alternatingTurnCount || 0} 次（左转右 ${route.leftToRightCount || 0}，右转左 ${route.rightToLeftCount || 0}），${alternatingTurnStretchSummary(route)}；${modelText}；预计 ${formatNumber(route.timeSeconds)} s；切弯后距离 ${formatNumber(route.effectiveDistanceMm)} mm；估算弯道 ${route.turnCount || 0} 个`
    : "";
  els.routeSummary.textContent = `${routePrefix}${prefix} ${formatNumber(route.distance)} mm${planningText}${traversal}；路线：${routeToNames(route.pathIds).join(" -> ")}${suffix}`;
}

function updateManualPlanningControls() {
  const manualMode = els.routeModeSelect.value === "manual";
  els.manualUndoBtn.hidden = !manualMode;
  els.manualFinishBtn.hidden = !manualMode;
  els.manualClearBtn.hidden = !manualMode;
  els.manualImportBtn.hidden = !manualMode;
  els.manualUndoBtn.disabled = !state.manualPlanning || !state.manualSegments.length;
  els.manualFinishBtn.disabled = !state.manualPlanning || !state.manualSegments.length;
  els.manualClearBtn.disabled = !state.manualPlanning;
  els.manualImportBtn.disabled = !manualMode || !state.manualImportRoute?.pathIds?.length;
  if (manualMode) {
    els.routeBtn.textContent = state.manualPlanning ? "重新开始手动路径" : "开始手动规划";
  } else {
    els.routeBtn.textContent = "计算路线";
  }
}

function currentOptimizerSeedPath() {
  const candidate = state.routeCandidates[state.selectedRouteIndex];
  return normalizeOptimizerSeedPath(candidate?.pathIds || state.lastRoute?.pathIds || []);
}

function updateOptimizerSeedControls() {
  const pathIds = currentOptimizerSeedPath();
  const valid = optimizerSeedPathValid(pathIds, buildGraph());
  els.saveOptimizerSeedBtn.disabled = !valid || state.optimizerRunning;
  els.clearOptimizerSeedsBtn.disabled = !state.optimizerSeeds.length || state.optimizerRunning;
  els.clearOptimizerSeedsBtn.textContent = `清空绝对种子 (${state.optimizerSeeds.length})`;
}

function saveCurrentRouteAsOptimizerSeed() {
  const pathIds = currentOptimizerSeedPath();
  if (!optimizerSeedPathValid(pathIds, buildGraph())) {
    els.routeSummary.textContent = "当前路径不能保存为绝对种子：至少需要两个由真实道路直接连接的节点";
    return;
  }
  const signature = pathIds.join("-");
  if (state.optimizerSeeds.some((seed) => seed.signature === signature)) {
    els.routeSummary.textContent = `这条绝对种子已经保存：${pathIds.join(" → ")}`;
    return;
  }
  const occupied = new Set(state.optimizerSeeds.flatMap((seed) => seed.pathIds));
  if (pathIds.some((id) => occupied.has(id))) {
    els.routeSummary.textContent = "绝对种子之间不能重叠节点，请先清空或重新选择局部路径";
    return;
  }
  state.optimizerSeeds.push({ signature, pathIds });
  updateOptimizerSeedControls();
  els.routeSummary.textContent = `已保存绝对种子 ${state.optimizerSeeds.length} 条：${pathIds.join(" → ")}；大图候选必须完整按此方向经过`;
  updateExportText();
}

function rebuildManualRoutePath() {
  state.manualPathIds = state.manualStartId ? [state.manualStartId] : [];
  state.manualStopIds = state.manualStartId ? [state.manualStartId] : [];
  state.manualSegments.forEach((segment) => {
    state.manualPathIds.push(...segment.pathIds.slice(1));
    state.manualStopIds.push(segment.targetId);
  });
}

function updateManualRoutePreview(message = "") {
  rebuildManualRoutePath();
  updateManualPlanningControls();
  if (state.manualPathIds.length < 2) {
    state.routeCandidates = [];
    state.selectedRouteIndex = 0;
    state.lastRoute = null;
    updateRouteCandidateOptions();
    updateOptimizerSeedControls();
    els.routeSummary.textContent = message || "手动规划已开始：请在坐标图上按实际行驶顺序点选下一个节点";
    updateExportText();
    draw();
    return;
  }

  const required = state.nodes.filter((node) => node.type === 0 || node.type === 1);
  const visited = new Set(state.manualPathIds);
  const missingCount = required.filter((node) => !visited.has(node.id)).length;
  const completedLaps = Math.max(0, state.manualStopIds.filter((id) => id === state.manualStartId).length - 1);
  const route = makeRouteResult(
    {
      distance: routeDistance(state.manualPathIds),
      stopIds: state.manualStopIds.slice(),
      pathIds: state.manualPathIds.slice()
    },
    required,
    false,
    false,
    message || `手动顺序路径：${state.manualSegments.length} 段，完整回到起点 ${completedLaps} 次，尚未经过 ${missingCount} 个必经节点`,
    "manual"
  );
  route.manualStopIds = state.manualStopIds.slice();
  attachMotionProfile(route, readSpeedSettings());
  state.routeCandidates = [route];
  state.selectedRouteIndex = 0;
  state.lastRoute = route;
  updateStopNodeOptions(route);
  updateRouteCandidateOptions();
  updateRouteSummary(route);
  updateOptimizerSeedControls();
  updateExportText();
  draw();
}

function startManualRoutePlanning() {
  const startId = Number(els.startNodeSelect.value);
  if (!startId) {
    updateRouteSummary({ ok: false, message: "请先选择手动路径起点" });
    return;
  }
  state.manualPlanning = true;
  state.manualStartId = startId;
  state.manualSegments = [];
  state.manualPathIds = [startId];
  state.manualStopIds = [startId];
  updateManualRoutePreview();
}

function importCurrentCandidateAsManualRoute() {
  const source = state.manualImportRoute;
  if (!source?.pathIds || source.pathIds.length < 2) return;
  state.manualPlanning = true;
  state.manualStartId = source.pathIds[0];
  els.startNodeSelect.value = String(state.manualStartId);
  state.manualSegments = [];
  for (let index = 1; index < source.pathIds.length; index += 1) {
    state.manualSegments.push({
      targetId: source.pathIds[index],
      pathIds: [source.pathIds[index - 1], source.pathIds[index]]
    });
  }
  updateManualRoutePreview("已载入当前候选为手动顺序路径，可撤销末段或继续点选修改");
}

function appendManualRouteTarget(targetId) {
  if (!state.manualPlanning || !state.manualPathIds.length) return;
  const currentId = state.manualPathIds[state.manualPathIds.length - 1];
  if (targetId === currentId) {
    els.routeSummary.textContent = "当前已经位于这个节点，请点选下一个节点";
    return;
  }
  const previousId = state.manualPathIds[state.manualPathIds.length - 2] || 0;
  const segment = dijkstraToTargetNoUTurn(previousId, currentId, buildGraph(), targetId);
  if (!segment || segment.pathIds.length < 2) {
    els.routeSummary.textContent = `无法从 ${nodeById(currentId)?.name || currentId} 前进到 ${nodeById(targetId)?.name || targetId}，请检查道路连线或即时倒车约束`;
    return;
  }
  state.manualSegments.push({ targetId, pathIds: segment.pathIds.slice() });
  updateManualRoutePreview();
}

function undoManualRouteSegment() {
  if (!state.manualPlanning || !state.manualSegments.length) return;
  state.manualSegments.pop();
  updateManualRoutePreview("已撤销上一段，请继续点选节点");
}

function finishManualRoutePlanning() {
  if (!state.manualPlanning || !state.manualSegments.length) return;
  state.manualPlanning = false;
  updateManualRoutePreview("手动路径已完成，可调整速度参数查看规划速度或导出 JSON");
}

async function computeRoute() {
  const startId = Number(els.startNodeSelect.value);
  if (!startId) {
    state.lastRoute = null;
    updateRouteSummary({ ok: false, message: "请先选择起点" });
    updateExportText();
    draw();
    return;
  }

  if (els.routeModeSelect.value === "manual") {
    startManualRoutePlanning();
    return;
  }

  els.routeBtn.disabled = true;
  els.routeModeSelect.disabled = true;
  els.optimizerDurationSelect.disabled = true;
  els.optimizerPreviewSelect.disabled = true;
  els.routeSummary.textContent = "正在计算...";
  await new Promise((resolve) => setTimeout(resolve, 20));

  try {
    const mode = els.routeModeSelect.value;
    state.optimizerCancelRequested = false;
    state.optimizerPaused = false;
    state.optimizerRunning = mode === "optimized";
    els.optimizerPauseBtn.disabled = mode !== "optimized";
    els.optimizerPauseBtn.textContent = "暂停深度优化";
    els.optimizerCancelBtn.disabled = mode !== "optimized";
    const durationMs = Math.max(1, Number(els.optimizerDurationSelect.value) || 300) * 1000;
    const route = mode === "optimized"
      ? await findOptimizedRequiredRoutes(startId, durationMs, ({ elapsedMs, durationMs: totalMs, iterations, candidateCount }) => {
          const percent = Math.min(100, elapsedMs / totalMs * 100);
          const visibleCount = state.routeCandidates.length;
          els.routeSummary.textContent = `深度优化 ${formatNumber(percent)}%：${iterations} 轮，保留 ${candidateCount} 个顺序候选；当前前 ${visibleCount} 名已展示，可随时停止使用`;
        }, async (routes, { activeElapsedMs, iterations, candidateCount, paused }) => {
          if (routes.length) {
            const selectedSignature = state.routeCandidates[state.selectedRouteIndex]?.pathIds?.join("-");
            state.routeCandidates = routes;
            const preservedIndex = selectedSignature
              ? routes.findIndex((route) => route.pathIds.join("-") === selectedSignature)
              : -1;
            state.selectedRouteIndex = preservedIndex >= 0 ? preservedIndex : 0;
            updateStopNodeOptions(routes[state.selectedRouteIndex]);
            selectRouteCandidate(state.selectedRouteIndex);
          }
          els.routeSummary.textContent = paused
            ? `深度优化已暂停：主动计算 ${formatNumber(activeElapsedMs / 1000)} s，${iterations} 轮，顺序池 ${candidateCount} 条；当前前 ${routes.length} 名已展示`
            : `深度优化运行中：主动计算 ${formatNumber(activeElapsedMs / 1000)} s，${iterations} 轮；当前前 ${routes.length} 名已刷新`;
        }, (Number(els.optimizerPreviewSelect.value) || 5) * 1000)
      : (mode === "greedy"
          ? findGreedyNoUTurnRoute(startId)
          : (mode === "fastest" ? findFastestRequiredRoute(startId) : findShortestRequiredRoute(startId)));

    if (!route.ok) {
      state.routeCandidates = [];
      state.selectedRouteIndex = 0;
      state.lastRoute = null;
      updateRouteCandidateOptions();
      updateRouteSummary(route);
      updateExportText();
      draw();
      return;
    }

    state.routeCandidates = route.candidates || [route];
    state.selectedRouteIndex = 0;
    updateStopNodeOptions(state.routeCandidates[0]);
    selectRouteCandidate(0);
  } catch (error) {
    state.lastRoute = null;
    state.routeCandidates = [];
    state.selectedRouteIndex = 0;
    updateRouteCandidateOptions();
    updateRouteSummary({ ok: false, message: "计算失败，请检查连线是否过于复杂或存在异常数据" });
    updateExportText();
  } finally {
    state.optimizerRunning = false;
    state.optimizerPaused = false;
    els.routeBtn.disabled = false;
    els.routeModeSelect.disabled = false;
    els.optimizerDurationSelect.disabled = false;
    els.optimizerPreviewSelect.disabled = false;
    els.optimizerPauseBtn.disabled = true;
    els.optimizerPauseBtn.textContent = "暂停深度优化";
    els.optimizerCancelBtn.disabled = true;
  }
}

function applyInput({ preserveRoutes = false } = {}) {
  if (state.optimizerRunning) {
    els.errorBox.textContent = "深度优化运行中不能修改节点图，请先暂停查看结果或强制停止";
    return;
  }
  const nodeResult = parseNodes(els.bulkInput.value);
  const linkResult = parseLinks(els.linkInput.value, nodeResult.nodes);
  const errors = [...nodeResult.errors, ...linkResult.errors];
  const preserveExistingRoutes = preserveRoutes
    && errors.length === 0
    && routeStructureMatches(nodeResult.nodes, linkResult.links);

  if (preserveRoutes && errors.length) {
    els.errorBox.textContent = errors.join("；");
    return;
  }

  state.nodes = nodeResult.nodes;
  state.links = linkResult.links;
  if (!preserveExistingRoutes) {
    state.lastRoute = null;
    state.routeCandidates = [];
    state.selectedRouteIndex = 0;
    state.routeDirectionReversed = false;
    state.manualPlanning = false;
    state.manualStartId = 0;
    state.manualSegments = [];
    state.manualPathIds = [];
    state.manualStopIds = [];
    state.manualImportRoute = null;
    state.turnRadiusEditor.active = false;
    state.turnRadiusEditor.selectedKey = null;
    state.turnRadiusEditor.hoverKey = null;
    state.turnRadiusEditor.overrides = {};
    state.optimizerSeeds = [];
  }
  state.segmentOffset.startId = null;
  state.segmentOffset.endId = null;
  state.segmentOffset.selectedIds = [];
  state.segmentOffset.undoCoordinates = null;
  state.hoverNode = null;
  if (state.pendingNode && !state.nodes.some((node) => node.id === state.pendingNode.id && node.name === state.pendingNode.name)) {
    state.pendingNode = null;
  }
  if (state.selectedNodeId && !state.nodes.some((node) => node.id === state.selectedNodeId)) {
    state.selectedNodeId = null;
  }
  els.errorBox.textContent = errors.join("；");
  updateStats();
  renderTable();
  renderAccelerationReadout();
  updateSegmentOffsetControls();
  if (preserveExistingRoutes) {
    refreshRoutesAfterCoordinateEdit();
  } else {
    updateRouteCandidateOptions();
    updateRouteSummary(null);
    updateOptimizerSeedControls();
    updateExportText();
    draw();
  }
}

function updateReadout() {
  const hover = state.hoverNode;
  const mouse = state.mouseWorld;
  if (hover) {
    els.readout.innerHTML = `<b>${escapeHtml(hover.name)}</b> ${hover.typeLabel}，X ${formatNumber(hover.x)} mm，Y ${formatNumber(hover.y)} mm`;
  } else if (mouse) {
    els.readout.innerHTML = `X <b>${formatNumber(mouse.x)}</b> mm，Y <b>${formatNumber(mouse.y)}</b> mm`;
  } else {
    els.readout.textContent = "移动到图上查看坐标";
  }
}

function updateLineHint() {
  if (!state.lineMode) {
    els.lineHint.textContent = state.selectedNodeId ? `已选中 ${nodeById(state.selectedNodeId)?.name || "节点"}` : "点选连线已关闭";
    return;
  }

  if (state.pendingNode) {
    els.lineHint.textContent = `已选择 ${state.pendingNode.name}，再选择另一个节点`;
  } else if (state.selectedNodeId) {
    els.lineHint.textContent = `已选中 ${nodeById(state.selectedNodeId)?.name || "节点"}，可改类型或继续点节点连线`;
  } else {
    els.lineHint.textContent = "选择第一个节点";
  }
}

function updateSelectedTypeControl() {
  const selected = state.selectedNodeId ? nodeById(state.selectedNodeId) : null;
  if (!selected) {
    els.nodeTypeSelect.disabled = true;
    els.nodeTypeSelect.value = "";
    return;
  }

  els.nodeTypeSelect.disabled = false;
  els.nodeTypeSelect.value = String(selected.type);
}

function nearestNode(world, maxPixels) {
  let nearest = null;
  let nearestDist = Infinity;

  state.nodes.forEach((node) => {
    const point = worldToScreen(node.x, node.y);
    const mouse = worldToScreen(world.x, world.y);
    const dist = Math.hypot(point.x - mouse.x, point.y - mouse.y);
    if (dist < nearestDist) {
      nearest = node;
      nearestDist = dist;
    }
  });

  return nearestDist <= maxPixels ? nearest : null;
}

function handleMouseMove(event) {
  if (!state.view) {
    return;
  }

  const rect = els.plot.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;
  state.mouseWorld = screenToWorld(x, y);
  if (state.turnRadiusEditor.active) {
    const arc = nearestRouteArc({ x, y });
    const nextKey = arc?.radiusKey || null;
    if (nextKey !== state.turnRadiusEditor.hoverKey) {
      state.turnRadiusEditor.hoverKey = nextKey;
      draw();
    }
    return;
  }
  const nextHover = nearestNode(state.mouseWorld, 18);

  if (nextHover !== state.hoverNode) {
    state.hoverNode = nextHover;
    draw();
  } else {
    updateReadout();
  }
}

function appendLink(from, to) {
  const key = makeLinkKey(from.id, to.id);
  if (state.links.some((link) => link.key === key)) {
    els.errorBox.textContent = `${from.name} 和 ${to.name} 已经有连线`;
    return;
  }

  const line = `${from.id}-${to.id}`;
  const current = els.linkInput.value.trim();
  els.linkInput.value = current ? `${current}\n${line}` : line;
  applyInput();
}

function updateManualCorrectionZoneControls() {
  const active = state.manualCorrectionZoneMode;
  els.manualCorrectionZoneBtn.classList.toggle("active", active);
  els.manualCorrectionZoneBtn.textContent = active ? "Finish exclusion zones" : "Manual exclusion zone";
  els.manualCorrectionZonePanel.hidden = !active;
  els.manualCorrectionZoneClearBtn.disabled = state.manualCorrectionZones.length === 0;
  if (active) {
    const radiusCm = Math.max(1, Number(els.manualCorrectionZoneRadius.value) || 20);
    els.manualCorrectionZoneStatus.textContent = `Click the map to add a ${radiusCm} cm exclusion zone (${state.manualCorrectionZones.length} saved).`;
  }
}

function addManualCorrectionZone(world) {
  const radiusMm = Math.max(10, Number(els.manualCorrectionZoneRadius.value) * 10 || 200);
  state.manualCorrectionZones.push({ x_mm: world.x, y_mm: world.y, radius_mm: radiusMm });
  updateManualCorrectionZoneControls();
  updateExportText();
  draw();
}

function handleCanvasClick(event) {
  if (!state.view || !state.nodes.length) {
    return;
  }

  const rect = els.plot.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;
  if (state.manualCorrectionZoneMode) {
    addManualCorrectionZone(screenToWorld(x, y));
    return;
  }
  if (state.turnRadiusEditor.active) {
    const arc = nearestRouteArc({ x, y });
    if (arc) selectTurnRadiusArc(arc);
    return;
  }
  const clicked = nearestNode(screenToWorld(x, y), 20);
  if (!clicked) {
    return;
  }

  if (state.segmentOffset.active) {
    selectSegmentOffsetEndpoint(clicked);
    return;
  }

  state.selectedNodeId = clicked.id;
  els.nodeTypeSelect.value = String(clicked.type);
  els.nodeTypeSelect.disabled = false;

  if (els.routeModeSelect.value === "manual" && state.manualPlanning) {
    appendManualRouteTarget(clicked.id);
    return;
  }

  if (!state.lineMode) {
    updateLineHint();
    draw();
    return;
  }

  if (!state.pendingNode) {
    state.pendingNode = clicked;
    updateLineHint();
    draw();
    return;
  }

  if (state.pendingNode.id === clicked.id) {
    state.pendingNode = null;
    updateLineHint();
    draw();
    return;
  }

  const from = state.pendingNode;
  state.pendingNode = null;
  appendLink(from, clicked);
}

function clearHover() {
  state.mouseWorld = null;
  state.hoverNode = null;
  updateReadout();
  draw();
}

  link.href = els.plot.toDataURL("image/png");
  link.click();
}

  if (!state.optimizerRunning) return;
  state.optimizerPaused = !state.optimizerPaused;
  els.optimizerPauseBtn.textContent = state.optimizerPaused ? "继续深度优化" : "暂停深度优化";
  els.routeSummary.textContent = state.optimizerPaused
    ? "正在暂停并整理当前前10名..."
    : "深度优化继续运行，保留原搜索现场...";
});
els.optimizerCancelBtn.addEventListener("click", () => {
  state.optimizerCancelRequested = true;
  state.optimizerPaused = false;
  els.optimizerPauseBtn.disabled = true;
  els.optimizerCancelBtn.disabled = true;
  els.routeSummary.textContent = "正在强制停止深度优化并整理当前前10名...";
});
els.routeCandidateSelect.addEventListener("change", () => {
  if (state.optimizerRunning) state.optimizerSelectionLocked = true;
  updateStopNodeOptions(state.routeCandidates[Number(els.routeCandidateSelect.value)]);
  selectRouteCandidate(Number(els.routeCandidateSelect.value));
});
els.reverseRouteBtn.addEventListener("click", () => {
  if (els.reverseRouteBtn.disabled) return;
  state.routeDirectionReversed = !state.routeDirectionReversed;
  updateStopNodeOptions(state.routeCandidates[state.selectedRouteIndex]);
  selectRouteCandidate(state.selectedRouteIndex);
});
function refreshTraversalPlan() {
  traversalSettings();
  if (state.routeCandidates.length) selectRouteCandidate(state.selectedRouteIndex);
  else updateExportText();
}
els.lapCountInput.addEventListener("input", () => {
  els.stopLapInput.value = String(Math.max(1, Math.min(100, Math.round(Number(els.lapCountInput.value) || 1))));
  refreshTraversalPlan();
});
els.stopLapInput.addEventListener("input", refreshTraversalPlan);
els.stopNodeSelect.addEventListener("change", refreshTraversalPlan);
els.routeModeSelect.addEventListener("change", () => {
  if (els.routeModeSelect.value === "manual") {
    state.manualImportRoute = state.routeCandidates[state.selectedRouteIndex] || state.lastRoute || state.manualImportRoute;
  }
  els.optimizerDurationField.hidden = els.routeModeSelect.value !== "optimized";
  els.optimizerPreviewField.hidden = els.routeModeSelect.value !== "optimized";
  els.optimizerRankingField.hidden = els.routeModeSelect.value !== "optimized";
  if (els.routeModeSelect.value !== "manual") state.manualPlanning = false;
  state.lastRoute = null;
  state.routeCandidates = [];
  state.selectedRouteIndex = 0;
  state.routeDirectionReversed = false;
  state.turnRadiusEditor.active = false;
  state.turnRadiusEditor.selectedKey = null;
  state.turnRadiusEditor.hoverKey = null;
  updateRouteCandidateOptions();
  updateRouteSummary(null);
  updateManualPlanningControls();
  updateExportText();
  draw();
});
const routePlanningInputs = [
  els.speedModelSelect,
  els.curveRadiusInput,
  els.phototubeOffsetInput,
  els.alternatingTurnThresholdInput,
  els.alternatingTurnOffsetInput,
  els.alternatingTurnOffsetEnabled,
  els.frictionInput,
  els.carMassInput,
  els.downforceInput,
  els.curveSpeedInput,
  els.straightSpeedInput,
  els.accelerationInput,
  els.decelerationInput,
  els.startupDragTimeInput,
  els.startupDragSpeedInput,
  els.optimizerRankingSelect
];
let routePlanningRefreshTimer = null;
routePlanningInputs.forEach((input) => {
  input.addEventListener("input", () => {
    renderAccelerationReadout();
    if (!state.nodes.length) return;
    clearTimeout(routePlanningRefreshTimer);
    routePlanningRefreshTimer = setTimeout(() => {
      if (els.routeModeSelect.value === "manual" && state.manualPathIds.length > 1) {
        updateManualRoutePreview("已按新参数重新计算手动路径的切弯和规划速度");
      } else if (!state.optimizerRunning) {
        computeRoute();
      }
    }, 180);
  });
});
els.exportDataBtn.addEventListener("click", updateExportText);
els.downloadExportBtn.addEventListener("click", downloadExportJson);
els.copyExportBtn.addEventListener("click", async () => {
  updateExportText();
  try {
    await navigator.clipboard.writeText(els.exportText.value);
    els.routeSummary.textContent = "导出文本已复制";
  } catch (error) {
    els.exportText.select();
    els.routeSummary.textContent = "复制被浏览器拦截，可以手动复制文本框内容";
  }
});
els.copySlipCommandsBtn.addEventListener("click", async () => {
  const commands = [
    "vpath slip status",
    "vpath slip on",
    "vpath slip off",
    "vpath slip full 0.84",
    "vpath slip weak 0.90",
    "vpath slip weakgain 0.40",
    "vpath slip gain 1.00",
    "vpath slip release 0.002",
    "vpath slip wheelbase 140",
    "vpath slip minturn 0.12",
    "vpath slip maxturn 30",
    "vpath slip maxreplay 300"
  ].join("\r\n");
  try {
    await navigator.clipboard.writeText(commands);
    els.routeSummary.textContent = "滑移快捷命令已复制";
  } catch (error) {
    els.routeSummary.textContent = "复制被浏览器拦截，请从导出 JSON 中复制滑移命令";
  }
});
els.copyRouteEdgesBtn.addEventListener("click", async () => {
  const text = els.routeEdgeText.value;
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
    els.routeSummary.textContent = `已复制 ${routeEdgeLines(state.lastRoute?.pathIds).length} 段路径边`;
  } catch (error) {
    els.routeEdgeText.select();
    els.routeSummary.textContent = "复制被浏览器拦截，可以手动复制路径边文本";
  }
});
els.startNodeSelect.addEventListener("change", () => {
  if (els.routeModeSelect.value === "manual") {
    state.manualPlanning = false;
    state.manualStartId = 0;
    state.manualSegments = [];
    state.manualPathIds = [];
    state.manualStopIds = [];
    updateManualPlanningControls();
  }
  state.lastRoute = null;
  state.routeCandidates = [];
  state.selectedRouteIndex = 0;
  state.routeDirectionReversed = false;
  updateRouteCandidateOptions();
  updateRouteSummary(null);
  updateExportText();
  draw();
});
els.clearBtn.addEventListener("click", () => {
  if (state.optimizerRunning) {
    els.errorBox.textContent = "深度优化运行中不能清空节点图，请先强制停止";
    return;
  }
  els.bulkInput.value = "";
  els.linkInput.value = "";
  state.nodes = [];
  state.links = [];
  state.hoverNode = null;
  state.mouseWorld = null;
  state.pendingNode = null;
  state.selectedNodeId = null;
  state.lastRoute = null;
  state.routeCandidates = [];
  state.selectedRouteIndex = 0;
  state.routeDirectionReversed = false;
  state.manualPlanning = false;
  state.manualStartId = 0;
  state.manualSegments = [];
  state.manualPathIds = [];
  state.manualStopIds = [];
  state.manualImportRoute = null;
  state.turnRadiusEditor.active = false;
  state.turnRadiusEditor.selectedKey = null;
  state.turnRadiusEditor.hoverKey = null;
  state.turnRadiusEditor.overrides = {};
  state.segmentOffset.startId = null;
  state.segmentOffset.endId = null;
  state.segmentOffset.selectedIds = [];
  state.segmentOffset.undoCoordinates = null;
  els.errorBox.textContent = "";
  updateStats();
  renderTable();
  updateRouteCandidateOptions();
  updateRouteSummary(null);
  updateSegmentOffsetControls();
  updateExportText();
  draw();
});
els.sampleBtn.addEventListener("click", () => {
  els.bulkInput.value = sampleData;
  els.linkInput.value = sampleLinks;
  state.pendingNode = null;
  state.selectedNodeId = null;
  applyInput();
});
els.bulkInput.addEventListener("input", () => applyInput({ preserveRoutes: true }));
els.bulkInput.addEventListener("blur", normalizeNodeInputExpressions);
els.bulkInput.addEventListener("change", normalizeNodeInputExpressions);
els.linkInput.addEventListener("input", () => applyInput({ preserveRoutes: true }));
els.gridStep.addEventListener("input", draw);
els.pointSize.addEventListener("input", draw);
els.arrowSpacingInput.addEventListener("input", draw);
els.showLabels.addEventListener("change", draw);
els.equalScale.addEventListener("change", draw);
els.invertY.addEventListener("change", draw);
els.plot.addEventListener("mousemove", handleMouseMove);
els.plot.addEventListener("click", handleCanvasClick);
els.plot.addEventListener("mouseleave", clearHover);
window.addEventListener("resize", draw);

renderSpeedLegend();
renderAccelerationReadout();
els.bulkInput.value = sampleData;
els.linkInput.value = "";
applyInput();
</script>
</body>
</html>
