    const rightAllowed = Math.sqrt((sourceSpeed * sourceRight) ** 2 + 2 * reservedAccel * distanceM) / targetRight;
    return speedClamp(Math.min(cap, leftAllowed, rightAllowed));
  };

  if (settings) {
    const startupDragDistanceMm = Math.max(0, Number(settings.startupDragDistanceMm) || 0);
    const startupDragSpeedMps = Math.min(settings.straightSpeedMps,
      Math.max(0.01, Number(settings.startupDragSpeedMps) || 0.2));
    const wheelLimitMps = settings.straightSpeedMps + wheelSpeedExtraMps - wheelCorrectionReserveMps;
    result.forEach((point, index) => {
      const outerCoefficient = 1 + wheelBaseM * 0.5 * Math.abs(curvature[index]);
      const innerCoefficient = 1 - wheelBaseM * 0.5 * Math.abs(curvature[index]);
      const wheelCap = innerCoefficient <= wheelCoefficientMinimum
        ? minimumSpeedMps
        : speedClamp(wheelLimitMps / outerCoefficient);
      point.speedMps = Math.min(point.speedMps, wheelCap);
      if ((point.sMm ?? 0) <= startupDragDistanceMm) {
        point.speedMps = Math.min(point.speedMps, startupDragSpeedMps);
      }
      const remainingMm = (result[result.length - 1].sMm ?? 0) - (point.sMm ?? 0);
      if (remainingMm < 300) {
        const endScale = remainingMm <= 10 ? 0 : Math.sqrt(Math.max(0, (remainingMm - 10) / 290));
        point.speedMps *= endScale;
      }
    });
    result[result.length - 1].speedMps = 0;
  }

  const limitFromNeighbor = (index, neighborIndex, braking) => {
    const distanceM = pointDistance(result[index], result[neighborIndex]) / 1000;
    const neighborSpeed = result[neighborIndex].speedMps;
    const accel = availableAcceleration(neighborSpeed, curvature[neighborIndex], braking);
    const reachableSpeed = Math.sqrt(Math.max(0,
      neighborSpeed * neighborSpeed + 2 * accel * distanceM
    ));
    result[index].speedMps = Math.min(result[index].speedMps,
      transitionCap(reachableSpeed, neighborSpeed, curvature[neighborIndex], curvature[index], distanceM, accel));
  };
  for (let index = 1; index < result.length; index += 1) {
    limitFromNeighbor(index, index - 1, false);
  }
  for (let index = result.length - 2; index >= 0; index -= 1) {
    limitFromNeighbor(index, index + 1, true);
  }
  return result;
}

function plannedPathTimeSeconds(points) {
  let timeSeconds = 0;
  for (let index = 1; index < points.length; index += 1) {
    const distanceM = pointDistance(points[index - 1], points[index]) / 1000;
    const speedSum = points[index - 1].speedMps + points[index].speedMps;
    timeSeconds += speedSum > geometryEpsilon ? (2 * distanceM) / speedSum : 0;
  }
  return timeSeconds;
}

function buildRouteMotionProfile(pathIds, settings) {
  const pieces = [];
  const profile = {
    timeSeconds: 0,
    effectiveDistanceMm: 0,
    turnCount: 0,
    pieces,
    plannedPoints: [],
    alternatingTurnTransitions: []
  };
  if (!pathIds || pathIds.length < 2) {
    return profile;
  }
  const plan = buildRouteTurnPlan(pathIds, settings);
  const sourcePoints = [];
  const appendSourcePoint = (point, speedMps) => {
    const next = { x: point.x, y: point.y, speedMps };
    const previous = sourcePoints[sourcePoints.length - 1];
    if (previous && pointDistance(previous, next) <= geometryEpsilon) {
      previous.speedMps = speedMps;
      return;
    }
    sourcePoints.push(next);
  };
  const appendLine = (start, end, startSpeedMps, endSpeedMps) => {
    const distanceMm = pointDistance(start, end);
    if (distanceMm <= geometryEpsilon) return;
    const motion = motionProfileMeters(
      distanceMm / 1000,
      startSpeedMps,
      endSpeedMps,
      settings.straightSpeedMps,
      settings.effectiveAccelerationMps2,
      settings.effectiveDecelerationMps2,
      0.05
    );
    const points = motion.samples.map((sample) => {
      const ratio = distanceMm > geometryEpsilon ? sample.distanceM * 1000 / distanceMm : 0;
      return {
        x: start.x + (end.x - start.x) * ratio,
        y: start.y + (end.y - start.y) * ratio,
        speedMps: sample.speedMps
      };
    });
    pieces.push({ type: "line", points, speedMps: Math.min(settings.straightSpeedMps, Math.max(startSpeedMps, endSpeedMps)) });
    points.forEach((point) => appendSourcePoint(point, point.speedMps));
    profile.timeSeconds += motion.timeSeconds;
    profile.effectiveDistanceMm += distanceMm;
  };
  const appendArc = (corner) => {
    const points = corner.arcPoints.map((point) => ({ ...point, speedMps: corner.speedMps }));
    pieces.push({
      type: "arc",
      points,
      speedMps: corner.speedMps,
      nodeId: corner.nodeId,
      radiusM: corner.radiusM,
      center: corner.center,
      labelPoint: points[Math.floor(points.length / 2)] || corner.outPoint,
      previousId: corner.previousId,
      nextId: corner.nextId,
      radiusKey: corner.radiusKey,
      radiusOverridden: corner.radiusOverridden
    });
    points.forEach((point) => appendSourcePoint(point, corner.speedMps));
    profile.timeSeconds += corner.arcDistanceMm / Math.max(corner.speedMps * 1000, geometryEpsilon);
    profile.effectiveDistanceMm += corner.arcDistanceMm;
    profile.turnCount += 1;
  };
  profile.alternatingTurnTransitions = plan.virtualStretches || [];

  if (plan.corners.length) {
    const start = { x: plan.nodes[0].x, y: plan.nodes[0].y };
    let cursor = start;
    let cursorSpeedMps = settings.straightSpeedMps;
    for (let index = 0; index < plan.corners.length; index += 1) {
      const corner = plan.corners[index];
      appendLine(cursor, corner.inPoint, cursorSpeedMps, corner.speedMps);
      appendArc(corner);
      cursor = corner.outPoint;
      cursorSpeedMps = corner.speedMps;
    }
    const end = plan.closed
      ? start
      : { x: plan.nodes[plan.nodes.length - 1].x, y: plan.nodes[plan.nodes.length - 1].y };
    appendLine(cursor, end, cursorSpeedMps, settings.straightSpeedMps);
    profile.plannedPoints = applyGlobalSpeedConstraints(
      resamplePlannedPath(sourcePoints),
      settings,
      plan.closed
    );
    profile.timeSeconds = plannedPathTimeSeconds(profile.plannedPoints);
  } else {
    const raw = plan.nodes.map((node) => ({ x: node.x, y: node.y, speedMps: settings.straightSpeedMps }));
    if (raw.length > 1) {
      pieces.push({ type: "line", points: raw, speedMps: settings.straightSpeedMps });
      profile.plannedPoints = applyGlobalSpeedConstraints(
        resamplePlannedPath(raw),
        settings,
        plan.closed
      );
      profile.effectiveDistanceMm = profile.plannedPoints[profile.plannedPoints.length - 1]?.sMm || 0;
      profile.timeSeconds = plannedPathTimeSeconds(profile.plannedPoints);
    }
  }
  return profile;
}

function buildRouteSpeedPieces(pathIds, settings) {
  return buildRouteMotionProfile(pathIds, settings).pieces;
}

function attachMotionProfile(route, settings = readSpeedSettings()) {
  if (!route || !route.ok || !route.pathIds || route.pathIds.length < 2) {
    return route;
  }

  const profile = buildRouteMotionProfile(route.pathIds, settings);
  route.speedSettings = settings;
  route.speedPieces = profile.pieces;
  route.plannedPathPoints = profile.plannedPoints;
  route.effectiveDistanceMm = profile.effectiveDistanceMm;
  route.timeSeconds = profile.timeSeconds;
  route.turnCount = profile.turnCount;
  route.alternatingTurnTransitions = profile.alternatingTurnTransitions;
  Object.assign(route, routeTurnAlternationMetrics(route.pathIds));
  return route;
}

function routeDistanceMm(pathIds) {
  let distance = 0;
  for (let index = 1; index < pathIds.length; index += 1) {
    const from = nodeById(pathIds[index - 1]);
    const to = nodeById(pathIds[index]);
    if (from && to) distance += distanceBetweenNodes(from, to);
  }
  return distance;
}

function routeDirection(pathIds) {
  const points = pathIds.map((id) => nodeById(id)).filter(Boolean);
  if (points.length < 2) return { name: "unknown", startHeadingDeg: null };
  const startHeadingDeg = Math.atan2(points[1].y - points[0].y, points[1].x - points[0].x) * 180 / Math.PI;
  let twiceArea = 0;
  for (let index = 1; index < points.length; index += 1) {
    twiceArea += points[index - 1].x * points[index].y - points[index].x * points[index - 1].y;
  }
  return {
    name: Math.abs(twiceArea) < geometryEpsilon ? "mixed_or_open" : (twiceArea > 0 ? "counterclockwise" : "clockwise"),
    startHeadingDeg
  };
}

function traversalSettings() {
  const lapCount = Math.max(1, Math.min(100, Math.round(Number(els.lapCountInput.value) || 1)));
  const stopLap = Math.max(1, Math.min(lapCount, Math.round(Number(els.stopLapInput.value) || lapCount)));
  els.lapCountInput.value = String(lapCount);
  els.stopLapInput.max = String(lapCount);
  els.stopLapInput.value = String(stopLap);
  return {
    lapCount,
    stopLap,
    stopNodeId: Number(els.stopNodeSelect.value) || Number(els.startNodeSelect.value)
  };
}

function reverseClosedRoutePath(pathIds) {
  if (!Array.isArray(pathIds) || pathIds.length < 2) return Array.isArray(pathIds) ? pathIds.slice() : [];
  const startId = pathIds[0];
  const closed = pathIds[pathIds.length - 1] === startId;
  if (!closed) return [startId, ...pathIds.slice(1).reverse()];
  return [startId, ...pathIds.slice(1, -1).reverse(), startId];
}

function buildTraversalRoute(baseRoute) {
  if (!baseRoute || !baseRoute.ok || !baseRoute.pathIds || baseRoute.pathIds.length < 2) return baseRoute;
  const settings = traversalSettings();
  const basePath = state.routeDirectionReversed
    ? reverseClosedRoutePath(baseRoute.pathIds)
    : baseRoute.pathIds.slice();
  const startId = basePath[0];
  const closed = basePath[basePath.length - 1] === startId;
  if (!closed) return attachMotionProfile({ ...baseRoute, traversal: { ...settings, actualLapCount: 1 } });
  const stopNodeIndex = basePath.findIndex((id, index) => index > 0 && id === settings.stopNodeId);
  const effectiveStopNodeId = stopNodeIndex > 0 ? settings.stopNodeId : startId;
  const finalIndex = effectiveStopNodeId === startId ? basePath.length - 1 : stopNodeIndex;
  const pathIds = [];
  for (let lap = 1; lap <= settings.stopLap; lap += 1) {
    const lapPath = lap === settings.stopLap ? basePath.slice(0, finalIndex + 1) : basePath;
    pathIds.push(...(pathIds.length ? lapPath.slice(1) : lapPath));
  }
  const direction = routeDirection(basePath);
  const route = {
    ...baseRoute,
    pathIds,
    stopIds: pathIds.filter((id, index) => index === 0 || baseRoute.requiredIds.includes(id)),
    distance: routeDistanceMm(pathIds),
    returnsToStart: pathIds[pathIds.length - 1] === startId,
    traversal: {
      ...settings,
      stopNodeId: effectiveStopNodeId,
      actualLapCount: settings.stopLap,
      reversed: state.routeDirectionReversed,
      direction: direction.name,
      startHeadingDeg: direction.startHeadingDeg
    }
  };
  return attachMotionProfile(route, readSpeedSettings());
}

function pointDistance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function readArrowSpacingMm() {
  const value = Number(els.arrowSpacingInput?.value);
  return Number.isFinite(value) && value > 0 ? value : 500;
}

function buildRouteArrowPieces() {
  if (!state.lastRoute || !state.lastRoute.ok || state.lastRoute.pathIds.length < 2) {
    return [];
  }

  if (state.lastRoute.speedPieces) {
    const settings = state.lastRoute.speedSettings || readSpeedSettings();
    return state.lastRoute.speedPieces || buildRouteSpeedPieces(state.lastRoute.pathIds, settings);
  }

  return [{
    type: "line",
    points: state.lastRoute.pathIds
      .map((id) => nodeById(id))
      .filter(Boolean)
      .map((node) => ({ x: node.x, y: node.y }))
  }];
}

function drawArrowHead(worldPoint, directionWorld) {
  const start = worldToScreen(worldPoint.x, worldPoint.y);
  const next = worldToScreen(worldPoint.x + directionWorld.x, worldPoint.y + directionWorld.y);
  const angle = Math.atan2(next.y - start.y, next.x - start.x);
  const size = 11;

  ctx.save();
  ctx.translate(start.x, start.y);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(size, 0);
  ctx.lineTo(-size * 0.55, -size * 0.52);
  ctx.lineTo(-size * 0.25, 0);
  ctx.lineTo(-size * 0.55, size * 0.52);
  ctx.closePath();
  ctx.fillStyle = "#e11924";
  ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
  ctx.lineWidth = 2;
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function drawRouteDirectionArrows() {
  const pieces = buildRouteArrowPieces();
  if (!pieces.length) {
    return;
  }

  const spacing = readArrowSpacingMm();
  let cumulative = 0;
  let nextArrowAt = spacing;
  let drawn = 0;
  let fallback = null;

  pieces.forEach((piece) => {
    const points = piece.points || [];
    for (let i = 0; i < points.length - 1; i += 1) {
      const from = points[i];
      const to = points[i + 1];
      const length = pointDistance(from, to);
      if (length <= geometryEpsilon) {
        continue;
      }

      if (!fallback || length > fallback.length) {
        fallback = { from, to, length };
      }

      while (cumulative + length >= nextArrowAt) {
        const ratio = (nextArrowAt - cumulative) / length;
        const point = {
          x: from.x + (to.x - from.x) * ratio,
          y: from.y + (to.y - from.y) * ratio
        };
        drawArrowHead(point, {
          x: to.x - from.x,
          y: to.y - from.y
        });
        drawn += 1;
        nextArrowAt += spacing;
      }

      cumulative += length;
    }
  });

  if (!drawn && fallback) {
    drawArrowHead({
      x: fallback.from.x + (fallback.to.x - fallback.from.x) * 0.5,
      y: fallback.from.y + (fallback.to.y - fallback.from.y) * 0.5
    }, {
      x: fallback.to.x - fallback.from.x,
      y: fallback.to.y - fallback.from.y
    });
  }
}

function drawTurnSpeedLabels() {
  if (!els.showLabels.checked || !state.lastRoute || !state.lastRoute.speedSettings) {
    return;
  }

  const settings = state.lastRoute.speedSettings || readSpeedSettings();
  const pieces = state.lastRoute.speedPieces || buildRouteSpeedPieces(state.lastRoute.pathIds, settings);
  const shown = new Set();

  ctx.save();
  ctx.font = "12px Segoe UI, Microsoft YaHei, sans-serif";
  ctx.textBaseline = "middle";
  pieces.forEach((piece) => {
    if (piece.type !== "arc" || !piece.labelPoint) {
      return;
    }
    const shownKey = `${piece.type}:${piece.nodeId}`;
    if (shown.has(shownKey)) return;
    shown.add(shownKey);
    const node = nodeById(piece.nodeId);
    const radiusCm = Number.isFinite(piece.radiusM) ? piece.radiusM * 100 : 0;
    const title = `${node?.name || "弯道"} · R ${formatNumber(radiusCm)} cm · ${formatNumber(piece.speedMps)} m/s`;
    const coordinates = node ? `X ${formatNumber(node.x)} · Y ${formatNumber(node.y)} mm` : "";
    const point = worldToScreen(piece.labelPoint.x, piece.labelPoint.y);
    const center = piece.center ? worldToScreen(piece.center.x, piece.center.y) : point;
    const dx = point.x - center.x;
    const dy = point.y - center.y;
    const length = Math.hypot(dx, dy) || 1;
    const x = point.x + (dx / length) * 14;
    const y = point.y + (dy / length) * 14;
    const width = Math.max(ctx.measureText(title).width, ctx.measureText(coordinates).width) + 12;
    const height = coordinates ? 36 : 22;

    ctx.fillStyle = "rgba(255, 255, 255, 0.92)";
    ctx.strokeStyle = "rgba(225, 25, 36, 0.42)";
    ctx.lineWidth = 1.5;
    roundRect(x - width / 2, y - height / 2, width, height, 5);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#c51620";
    ctx.fillText(title, x - width / 2 + 6, coordinates ? y - 7 : y);
    if (coordinates) {
      ctx.fillStyle = "#677181";
      ctx.fillText(coordinates, x - width / 2 + 6, y + 8);
    }
  });
  ctx.restore();
}

function buildRouteSpeedExport(route) {
  if (!route || !route.speedSettings) {
    return [];
  }

  return (route.speedPieces || buildRouteSpeedPieces(route.pathIds, route.speedSettings)).map((piece) => ({
    type: piece.type,
    turn_node_id: piece.nodeId || null,
    turn_node_name: piece.nodeId ? nodeById(piece.nodeId)?.name || null : null,
    speed_mps: Number(formatNumber(piece.speedMps)),
    radius_m: Number.isFinite(piece.radiusM) ? Number(formatNumber(piece.radiusM)) : null,
    color: speedToHeatColor(piece.speedMps),
    points_mm: piece.points.map((point) => ({
      x: Number(formatNumber(point.x)),
      y: Number(formatNumber(point.y))
    }))
  }));
}

function buildPlannedPathExport(route) {
  if (!route || !Array.isArray(route.plannedPathPoints)) return [];
  return route.plannedPathPoints.map((point, index) => ({
    index,
    x_mm: Number(formatNumber(point.x)),
    y_mm: Number(formatNumber(point.y)),
    s_mm: Number(formatNumber(point.sMm)),
    speed_mps: Number(formatNumber(point.speedMps))
  }));
}

function renderSpeedLegend() {
  const chips = ["<span>速度颜色</span>"];
  for (let speed = speedColorMaxMps; speed >= 0; speed -= speedColorStepMps) {
    chips.push(
      `<span class="speed-chip"><span class="speed-swatch" style="background:${speedToHeatColor(speed)}"></span>${formatNumber(speed)} m/s</span>`
    );
  }
  els.speedLegend.innerHTML = chips.join("");
}

function formatAcceleration(value) {
  return `${formatNumber(value)} m/s² (${formatNumber(value / 9.80665)} g)`;
}

function renderAccelerationReadout() {
  const settings = readSpeedSettings();
  els.accelReadout.innerHTML = [
    `<span>抓地最大加速度 <b>${formatAcceleration(settings.gripAccelerationMps2)}</b></span>`,
    `<span>控制加速度 <b>${formatAcceleration(settings.accelerationMps2)}</b></span>`,
    `<span>控制减速度 <b>${formatAcceleration(settings.decelerationMps2)}</b></span>`,
    `<span>规划加速 <b>${formatAcceleration(settings.effectiveAccelerationMps2)}</b> · 控制限制</span>`,
    `<span>规划减速 <b>${formatAcceleration(settings.effectiveDecelerationMps2)}</b> · 控制限制</span>`
  ].join("");
}

class MinHeap {
  constructor(compare) {
    this.items = [];
    this.compare = compare;
  }

  get size() {
    return this.items.length;
  }

  push(item) {
    this.items.push(item);
    this.bubbleUp(this.items.length - 1);
  }

  pop() {
    if (!this.items.length) {
      return null;
    }
    const top = this.items[0];
    const last = this.items.pop();
    if (this.items.length) {
      this.items[0] = last;
      this.bubbleDown(0);
    }
    return top;
  }

  trim(maxSize) {
    if (this.items.length <= maxSize) {
      return;
    }
    this.items.sort(this.compare);
    this.items.length = maxSize;
  }

  bubbleUp(index) {
    while (index > 0) {
      const parent = Math.floor((index - 1) / 2);
      if (this.compare(this.items[index], this.items[parent]) >= 0) {
        break;
      }
      [this.items[index], this.items[parent]] = [this.items[parent], this.items[index]];
      index = parent;
    }
  }

  bubbleDown(index) {
    while (true) {
      const left = index * 2 + 1;
      const right = left + 1;
      let best = index;

      if (left < this.items.length && this.compare(this.items[left], this.items[best]) < 0) {
        best = left;
      }
      if (right < this.items.length && this.compare(this.items[right], this.items[best]) < 0) {
        best = right;
      }
      if (best === index) {
        break;
      }

      [this.items[index], this.items[best]] = [this.items[best], this.items[index]];
      index = best;
    }
  }
}

const alternatingTurnMaximumGapMm = 900;

function routeTurnAlternationMetrics(pathIds) {
  const closed = pathIds.length > 3 && pathIds[0] === pathIds[pathIds.length - 1];
  const uniqueIds = closed ? pathIds.slice(0, -1) : pathIds.slice();
  const nodes = uniqueIds.map((id) => nodeById(id));
  if (nodes.length < 3 || nodes.some((node) => !node)) {
    return { alternatingTurnCount: 0, alternatingTurnDistanceMm: 0, leftToRightCount: 0, rightToLeftCount: 0 };
  }

  const cumulative = [0];
  for (let index = 1; index < nodes.length; index += 1) {
    cumulative.push(cumulative[index - 1] + distanceBetweenNodes(nodes[index - 1], nodes[index]));
  }
  const totalDistance = cumulative[cumulative.length - 1]
    + (closed ? distanceBetweenNodes(nodes[nodes.length - 1], nodes[0]) : 0);
  const turns = [];
  const firstIndex = closed ? 0 : 1;
  const endIndex = closed ? nodes.length : nodes.length - 1;

  for (let index = firstIndex; index < endIndex; index += 1) {
    const previous = nodes[(index - 1 + nodes.length) % nodes.length];
    const current = nodes[index];
    const next = nodes[(index + 1) % nodes.length];
    const incomingX = current.x - previous.x;
    const incomingY = current.y - previous.y;
    const outgoingX = next.x - current.x;
    const outgoingY = next.y - current.y;
    const incomingLength = Math.hypot(incomingX, incomingY);
    const outgoingLength = Math.hypot(outgoingX, outgoingY);
    if (incomingLength <= geometryEpsilon || outgoingLength <= geometryEpsilon) continue;
    const cosine = Math.max(-1, Math.min(1,
      (incomingX * outgoingX + incomingY * outgoingY) / (incomingLength * outgoingLength)
    ));
    if (Math.acos(cosine) <= Math.PI / 180) continue;
    turns.push({
      direction: cross(incomingX, incomingY, outgoingX, outgoingY) >= 0 ? 1 : -1,
      distanceMm: cumulative[index]
    });
  }

  let alternatingTurnCount = 0;
  let alternatingTurnDistanceMm = 0;
  let leftToRightCount = 0;
  let rightToLeftCount = 0;
  const addTransition = (from, to, distanceMm) => {
    if (from.direction === to.direction || distanceMm > alternatingTurnMaximumGapMm) return;
    alternatingTurnCount += 1;
    alternatingTurnDistanceMm += Math.max(0, distanceMm);
    if (from.direction > 0) leftToRightCount += 1;
    else rightToLeftCount += 1;
  };

  for (let index = 1; index < turns.length; index += 1) {
    addTransition(turns[index - 1], turns[index], turns[index].distanceMm - turns[index - 1].distanceMm);
  }
  if (closed && turns.length > 1) {
    addTransition(
      turns[turns.length - 1],
      turns[0],
      totalDistance - turns[turns.length - 1].distanceMm + turns[0].distanceMm
    );
  }

  return { alternatingTurnCount, alternatingTurnDistanceMm, leftToRightCount, rightToLeftCount };
}

function makeRouteResult(route, required, exact, bounded, message, algorithm = "exact") {
  const pathIds = route.pathIds;
  const edgeKeys = [];
  for (let i = 0; i < pathIds.length - 1; i += 1) {
    edgeKeys.push(makeLinkKey(pathIds[i], pathIds[i + 1]));
  }

  return {
    ok: true,
    exact,
    bounded,
    noBacktracking: true,
    returnsToStart: pathIds.length > 1 && pathIds[0] === pathIds[pathIds.length - 1],
    algorithm,
    distance: route.distance,
    effectiveDistanceMm: route.effectiveDistanceMm ?? route.distance,
    timeSeconds: route.timeSeconds ?? null,
    turnCount: route.turnCount ?? null,
    speedSettings: route.speedSettings || null,
    speedPieces: route.speedPieces || null,
    plannedPathPoints: route.plannedPathPoints || null,
    alternatingTurnTransitions: route.alternatingTurnTransitions || [],
    stopIds: route.stopIds,
    pathIds,
    edgeKeys,
    requiredIds: required.map((node) => node.id),
    ...routeTurnAlternationMetrics(pathIds),
    message
  };
}

function dijkstraToNearestRequiredNoUTurn(previousId, currentId, graph, missingRequired) {
  const startKey = `${previousId}|${currentId}`;
  const queue = new MinHeap((a, b) => a.distance - b.distance);
  const distanceByState = new Map([[startKey, 0]]);
  const parentByState = new Map();
  queue.push({ previousId, currentId, distance: 0 });

  while (queue.size) {
    const current = queue.pop();
    const currentKey = `${current.previousId}|${current.currentId}`;
    if (current.distance !== distanceByState.get(currentKey)) {
      continue;
    }

    if (missingRequired.has(current.currentId)) {
      const reversed = [];
      let key = currentKey;
      while (key) {
        const [, nodeId] = key.split("|").map(Number);
        reversed.push(nodeId);
        key = parentByState.get(key);
      }
      return {
        distance: current.distance,
        pathIds: reversed.reverse()
      };
    }

    (graph.get(current.currentId) || []).forEach((edge) => {
      if (edge.toId === current.previousId) {
        return;
      }

      const nextKey = `${current.currentId}|${edge.toId}`;
      const nextDistance = current.distance + edge.weight;
      if (nextDistance >= (distanceByState.get(nextKey) ?? Infinity)) {
        return;
      }

      distanceByState.set(nextKey, nextDistance);
      parentByState.set(nextKey, currentKey);
      queue.push({
        previousId: current.currentId,
        currentId: edge.toId,
        distance: nextDistance
      });
    });
  }

  return null;
}

function dijkstraToTargetNoUTurn(previousId, currentId, graph, targetId, blockedIds = null) {
  const startKey = `${previousId}|${currentId}`;
  const queue = new MinHeap((a, b) => a.distance - b.distance);
  const distanceByState = new Map([[startKey, 0]]);
  const parentByState = new Map();
  queue.push({ previousId, currentId, distance: 0 });

  while (queue.size) {
    const current = queue.pop();
    const currentKey = `${current.previousId}|${current.currentId}`;
    if (current.distance !== distanceByState.get(currentKey)) {
      continue;
    }

    if (current.currentId === targetId && currentKey !== startKey) {
      const reversed = [];
      let key = currentKey;
      while (key) {
        const [, nodeId] = key.split("|").map(Number);
        reversed.push(nodeId);
        key = parentByState.get(key);
      }
      return {
        distance: current.distance,
        pathIds: reversed.reverse()
      };
    }

    (graph.get(current.currentId) || []).forEach((edge) => {
      if (edge.toId === current.previousId) {
        return;
      }
      if (blockedIds?.has(edge.toId) && edge.toId !== targetId) {
        return;
      }

      const nextKey = `${current.currentId}|${edge.toId}`;
      const nextDistance = current.distance + edge.weight;
      if (nextDistance >= (distanceByState.get(nextKey) ?? Infinity)) {
        return;
      }

      distanceByState.set(nextKey, nextDistance);
      parentByState.set(nextKey, currentKey);
      queue.push({
        previousId: current.currentId,
        currentId: edge.toId,
        distance: nextDistance
      });
    });
  }

  return null;
}

function findGreedyNoUTurnRoute(startId) {
  const required = state.nodes.filter((node) => node.type === 0 || node.type === 1);
  const graph = buildGraph();
  const missingRequired = new Set(required.map((node) => node.id));
  missingRequired.delete(startId);

  let previousId = 0;
  let currentId = startId;
  let distance = 0;
  const pathIds = [startId];
  const stopIds = [startId];

  while (missingRequired.size) {
    const segment = dijkstraToNearestRequiredNoUTurn(previousId, currentId, graph, missingRequired);
    if (!segment || segment.pathIds.length < 2) {
      return { ok: false, message: "快速贪心没有找到可继续前进的路线" };
    }

    pathIds.push(...segment.pathIds.slice(1));
    distance += segment.distance;
    currentId = pathIds[pathIds.length - 1];
    previousId = pathIds.length > 1 ? pathIds[pathIds.length - 2] : 0;
    pathIds.forEach((id) => missingRequired.delete(id));
    if (!stopIds.includes(currentId)) {
      stopIds.push(currentId);
    }
  }

  if (currentId !== startId) {
    const returnSegment = dijkstraToTargetNoUTurn(previousId, currentId, graph, startId);
    if (!returnSegment || returnSegment.pathIds.length < 2) {
      return { ok: false, message: "快速贪心已覆盖元素点，但没有找到不倒车回到起点的路线" };
    }
    pathIds.push(...returnSegment.pathIds.slice(1));
    distance += returnSegment.distance;
    currentId = startId;
    stopIds.push(startId);
  }

  return makeRouteResult(
    { distance, stopIds, pathIds },
    required,
    false,
    false,
    "快速贪心路线，不保证全局最短",
    "greedy"
  );
}

function plannerRandom(seed) {
  let value = (seed >>> 0) || 0x9e3779b9;
  return () => {
    value ^= value << 13;
    value ^= value >>> 17;
    value ^= value << 5;
    return (value >>> 0) / 4294967296;
  };
}

function metricRouteDistance(startId, order, shortestBySource) {
  let distance = 0;
  let previousId = startId;
  for (const id of [...order, startId]) {
    const segmentDistance = shortestBySource.get(previousId)?.dist.get(id) ?? Infinity;
    if (!Number.isFinite(segmentDistance)) return Infinity;
    distance += segmentDistance;
    previousId = id;
  }
  return distance;
}

function randomizedNearestOrder(startId, requiredIds, shortestBySource, random) {
  const remaining = new Set(requiredIds.filter((id) => id !== startId));
  const order = [];
  let currentId = startId;
  while (remaining.size) {
    const nearest = [...remaining]
      .map((id) => ({ id, distance: shortestBySource.get(currentId)?.dist.get(id) ?? Infinity }))
      .filter((item) => Number.isFinite(item.distance))
      .sort((left, right) => left.distance - right.distance);
    if (!nearest.length) return null;
    const poolSize = Math.min(6, nearest.length);
    const selected = nearest[Math.min(poolSize - 1, Math.floor(random() * random() * poolSize))];
    order.push(selected.id);
    remaining.delete(selected.id);
    currentId = selected.id;
  }
  return order;
}

function normalizeOptimizerSeedPath(pathIds) {
  const allowedIds = new Set(state.nodes.map((node) => node.id));
  const normalized = [];
  for (const id of pathIds || []) {
    if (!allowedIds.has(id) || normalized[normalized.length - 1] === id) continue;
    normalized.push(id);
  }
  if (normalized.length > 2 && normalized[0] === normalized[normalized.length - 1]) {
    normalized.pop();
  }
  return normalized;
}

function optimizerSeedPathValid(pathIds, graph) {
  if (pathIds.length < 2) return false;
  return pathIds.slice(1).every((id, index) => (
    (graph.get(pathIds[index]) || []).some((edge) => edge.toId === id)
  ));
}

function applyAbsoluteOptimizerSeeds(startId, sourceOrder, shortestBySource, graph) {
  let order = sourceOrder.slice();
  for (const seed of state.optimizerSeeds) {
    const pathIds = normalizeOptimizerSeedPath(seed.pathIds);
    if (!optimizerSeedPathValid(pathIds, graph)) return null;
    const startIndex = pathIds.indexOf(startId);
    if (startIndex > 0 || pathIds.slice(1).includes(startId)) return null;

    const seedSet = new Set(pathIds);
    order = order.filter((id) => !seedSet.has(id));
    const block = startIndex === 0 ? pathIds.slice(1) : pathIds.slice();
    if (!block.length) continue;
    if (startIndex === 0) {
      order.unshift(...block);
      continue;
    }

    let best = null;
    for (let index = 0; index <= order.length; index += 1) {
      const previousId = index === 0 ? startId : order[index - 1];
      const nextId = index === order.length ? startId : order[index];
      const added = (shortestBySource.get(previousId)?.dist.get(block[0]) ?? Infinity)
        + (shortestBySource.get(block[block.length - 1])?.dist.get(nextId) ?? Infinity)
        - (shortestBySource.get(previousId)?.dist.get(nextId) ?? Infinity);
      if (Number.isFinite(added) && (!best || added < best.added)) best = { index, added };
    }
    if (!best) return null;
    order.splice(best.index, 0, ...block);
  }
  return order;
}

function routeSatisfiesAbsoluteOptimizerSeeds(pathIds) {
  const startId = pathIds[0];
  for (const seed of state.optimizerSeeds) {
    const requiredPath = normalizeOptimizerSeedPath(seed.pathIds);
    if (requiredPath.length < 2) return false;
    if (requiredPath[0] === startId) {
      if (!requiredPath.every((id, index) => pathIds[index] === id)) return false;
      continue;
    }
    let matched = false;
    for (let index = 0; index <= pathIds.length - requiredPath.length; index += 1) {
      if (requiredPath.every((id, offset) => pathIds[index + offset] === id)) {
        matched = true;
        break;
      }
    }
    if (!matched) return false;
  }
  return true;
}

function improveOrderTwoOpt(startId, sourceOrder, shortestBySource, random) {
  const order = sourceOrder.slice();
  if (order.length < 3) return order;
  const attempts = Math.min(3000, Math.max(300, order.length * 12));
  let temperature = Math.max(1, metricRouteDistance(startId, order, shortestBySource) * 0.002);

  for (let attempt = 0; attempt < attempts; attempt += 1) {
    let first = Math.floor(random() * order.length);
    let last = Math.floor(random() * order.length);
    if (first > last) [first, last] = [last, first];
    if (first === last) continue;
    const beforeFirst = first === 0 ? startId : order[first - 1];
    const firstId = order[first];
    const lastId = order[last];
    const afterLast = last === order.length - 1 ? startId : order[last + 1];
    const oldCost = (shortestBySource.get(beforeFirst)?.dist.get(firstId) ?? Infinity)
      + (shortestBySource.get(lastId)?.dist.get(afterLast) ?? Infinity);
    const newCost = (shortestBySource.get(beforeFirst)?.dist.get(lastId) ?? Infinity)
      + (shortestBySource.get(firstId)?.dist.get(afterLast) ?? Infinity);
    const delta = newCost - oldCost;
    if (delta < -geometryEpsilon || (Number.isFinite(delta) && random() < Math.exp(-Math.max(0, delta) / temperature) * 0.015)) {
      const reversed = order.slice(first, last + 1).reverse();
      order.splice(first, reversed.length, ...reversed);
    }
    temperature *= 0.996;
  }
  return order;
}

function destroyAndRepairOrder(startId, sourceOrder, shortestBySource, random) {
  if (sourceOrder.length < 5) return sourceOrder.slice();
  const order = sourceOrder.slice();
  const removed = [];
  const removeCount = Math.min(order.length - 2, Math.max(2, Math.round(order.length * (0.05 + random() * 0.1))));
  while (removed.length < removeCount) {
    removed.push(order.splice(Math.floor(random() * order.length), 1)[0]);
  }

  while (removed.length) {
    const removedIndex = Math.floor(random() * removed.length);
    const id = removed.splice(removedIndex, 1)[0];
    const insertions = [];
    for (let index = 0; index <= order.length; index += 1) {
      const previousId = index === 0 ? startId : order[index - 1];
      const nextId = index === order.length ? startId : order[index];
      const added = (shortestBySource.get(previousId)?.dist.get(id) ?? Infinity)
        + (shortestBySource.get(id)?.dist.get(nextId) ?? Infinity)
        - (shortestBySource.get(previousId)?.dist.get(nextId) ?? Infinity);
      if (Number.isFinite(added)) insertions.push({ index, added });
    }
    if (!insertions.length) return sourceOrder.slice();
    insertions.sort((left, right) => left.added - right.added);
    const choicePool = Math.min(3, insertions.length);
    const insertion = insertions[Math.floor(random() * random() * choicePool)];
    order.splice(insertion.index, 0, id);
  }
  return order;
}

function buildNoUTurnRouteFromOrder(startId, order, required, graph) {
  const requiredSet = new Set(required.map((node) => node.id));
  const absoluteSeeds = state.optimizerSeeds.map((seed) => normalizeOptimizerSeedPath(seed.pathIds));
  const visitedRequired = new Set(requiredSet.has(startId) ? [startId] : []);
  const pathIds = [startId];
  let distance = 0;
  let previousId = 0;
  let currentId = startId;

  for (let orderIndex = 0; orderIndex < order.length; orderIndex += 1) {
    const seedPath = absoluteSeeds.find((candidate) => {
      const block = candidate[0] === startId ? candidate.slice(1) : candidate;
      return block.length > 0 && block.every((id, offset) => order[orderIndex + offset] === id);
    });
    if (seedPath) {
      const block = seedPath[0] === startId ? seedPath.slice(1) : seedPath;
      const entryId = seedPath[0];
      if (entryId === startId) {
        if (currentId !== startId || pathIds.length !== 1) return null;
      } else if (currentId !== entryId) {
        const entrySegment = dijkstraToTargetNoUTurn(
          previousId, currentId, graph, entryId
        );
        if (!entrySegment || entrySegment.pathIds.length < 2) return null;
        pathIds.push(...entrySegment.pathIds.slice(1));
        distance += entrySegment.distance;
        entrySegment.pathIds.forEach((id) => {
          if (requiredSet.has(id)) visitedRequired.add(id);
        });
        currentId = pathIds[pathIds.length - 1];
        previousId = pathIds[pathIds.length - 2] || 0;
      }

      for (let seedIndex = 1; seedIndex < seedPath.length; seedIndex += 1) {
        const nextId = seedPath[seedIndex];
        if (nextId === previousId) return null;
        const edge = (graph.get(currentId) || []).find((candidate) => candidate.toId === nextId);
        if (!edge) return null;
        pathIds.push(nextId);
        distance += edge.weight;
        previousId = currentId;
        currentId = nextId;
        if (requiredSet.has(nextId)) visitedRequired.add(nextId);
      }
      orderIndex += block.length - 1;
      continue;
    }

    const targetId = order[orderIndex];
    if (visitedRequired.has(targetId)) continue;
    const segment = dijkstraToTargetNoUTurn(
      previousId, currentId, graph, targetId
    );
    if (!segment || segment.pathIds.length < 2) return null;
    pathIds.push(...segment.pathIds.slice(1));
    distance += segment.distance;
    segment.pathIds.forEach((id) => {
      if (requiredSet.has(id)) visitedRequired.add(id);
    });
    currentId = pathIds[pathIds.length - 1];
    previousId = pathIds[pathIds.length - 2] || 0;
  }

  if (currentId !== startId) {
    const returnSegment = dijkstraToTargetNoUTurn(
      previousId, currentId, graph, startId
    );
    if (!returnSegment || returnSegment.pathIds.length < 2) return null;
    pathIds.push(...returnSegment.pathIds.slice(1));
    distance += returnSegment.distance;
    returnSegment.pathIds.forEach((id) => {
      if (requiredSet.has(id)) visitedRequired.add(id);
    });
  }

  if (visitedRequired.size !== requiredSet.size || pathIds[pathIds.length - 1] !== startId) return null;
  const stopIds = pathIds.filter((id, index) => index === 0 || requiredSet.has(id));
  return { distance, stopIds, pathIds };
}

function compareOptimizedRoutes(left, right) {
  const mode = els.optimizerRankingSelect?.value || "fastest";
  const timeDifference = (left.timeSeconds ?? Infinity) - (right.timeSeconds ?? Infinity);
  const turnDifference = (left.alternatingTurnCount ?? 0) - (right.alternatingTurnCount ?? 0);
  const turnGapDifference = (right.alternatingTurnDistanceMm ?? 0) - (left.alternatingTurnDistanceMm ?? 0);
  const distanceDifference = (left.distance ?? Infinity) - (right.distance ?? Infinity);
  if (mode === "stable") {
    return turnDifference || turnGapDifference || timeDifference || distanceDifference;
  }
  if (mode === "shortest") {
    return distanceDifference || turnDifference || turnGapDifference || timeDifference;
  }
  return timeDifference || turnDifference || turnGapDifference || distanceDifference;
}

function estimateOrderTime(startId, order, shortestBySource, settings) {
  const cycle = [startId, ...order];
  if (cycle.length < 2) return 0;
  let seconds = 0;
  for (let index = 0; index < cycle.length; index += 1) {
    const previousId = cycle[(index - 1 + cycle.length) % cycle.length];
    const currentId = cycle[index];
    const nextId = cycle[(index + 1) % cycle.length];
    const edgeDistance = shortestBySource.get(currentId)?.dist.get(nextId) ?? Infinity;
    if (!Number.isFinite(edgeDistance)) return Infinity;
    seconds += fastestTransitionCost(previousId, currentId, nextId, edgeDistance, settings).seconds;
  }
  return seconds;
}

function materializeOptimizedRoutes(startId, required, graph, sequencePool, settings, sequenceLimit = 80) {
  const routes = [];
  const pathSignatures = new Set();
  for (const sequence of sequencePool.slice(0, sequenceLimit)) {
    const rawRoute = buildNoUTurnRouteFromOrder(startId, sequence.order, required, graph);
    if (!rawRoute || !routeSatisfiesAbsoluteOptimizerSeeds(rawRoute.pathIds)) continue;
    const signature = rawRoute.pathIds.join("-");
    if (pathSignatures.has(signature)) continue;
    pathSignatures.add(signature);
    const route = makeRouteResult(
      rawRoute,
      required,
      false,
      false,
      "大图多起点破坏重插与 2-opt 优化结果，不保证数学全局最优",
      "optimized"
    );
    attachMotionProfile(route, settings);
    routes.push(route);
  }
  routes.sort(compareOptimizedRoutes);
  routes.length = Math.min(routes.length, ROUTE_CANDIDATE_COUNT);
  if (routes.length) routes[0].candidates = routes;
  return routes;
}

async function findOptimizedRequiredRoutes(
  startId,
  durationMs,
  progress,
  snapshot = () => {},
  previewIntervalMs = 5000
) {
  const required = state.nodes.filter((node) => node.type === 0 || node.type === 1);
  const requiredIds = required.map((node) => node.id);
  if (!state.nodes.length) return { ok: false, message: "没有节点可分析" };
  if (requiredIds.length > BROWSER_ROUTE_REQUIRED_NODE_LIMIT) {
    return { ok: false, message: `必经元素节点超过 ${BROWSER_ROUTE_REQUIRED_NODE_LIMIT} 个，当前浏览器规划会过大` };
  }

  const graph = buildGraph();
  const seedNodeIds = state.optimizerSeeds.flatMap((seed) => normalizeOptimizerSeedPath(seed.pathIds));
  const sources = [...new Set([startId, ...requiredIds, ...seedNodeIds])];
  const shortestBySource = new Map();
  for (const id of sources) shortestBySource.set(id, dijkstra(id, graph));
  if (requiredIds.some((id) => !Number.isFinite(shortestBySource.get(startId)?.dist.get(id)))) {
    return { ok: false, message: "存在从起点不可达的必经元素节点" };
  }

  const seed = state.nodes.reduce((value, node) => (
    Math.imul(value ^ node.id, 16777619) ^ Math.round(node.x) ^ Math.imul(Math.round(node.y), 31)
  ), 2166136261) >>> 0;
  const random = plannerRandom(seed);
  const sequencePool = [];
  const sequenceSignatures = new Set();
  const settings = readSpeedSettings();
  const startedAt = performance.now();
  const targetActiveMs = Math.max(1000, durationMs);
  let activeElapsedMs = 0;
  let lastPreviewAtMs = 0;
  let iterations = 0;
  let pauseSnapshotShown = false;

  const keepSequence = (order) => {
    if (!order) return;
    order = applyAbsoluteOptimizerSeeds(startId, order, shortestBySource, graph);
    if (!order) return;
    const signature = order.join("-");
    if (sequenceSignatures.has(signature)) return;
    const distance = metricRouteDistance(startId, order, shortestBySource);
    if (!Number.isFinite(distance)) return;
    const estimatedTime = estimateOrderTime(startId, order, shortestBySource, settings);
    if (!Number.isFinite(estimatedTime)) return;
    const diversityBias = 0.97 + random() * 0.06;
    const rankingMode = els.optimizerRankingSelect?.value || "fastest";
    const retentionRoute = rankingMode === "stable"
      ? buildNoUTurnRouteFromOrder(startId, order, required, graph)
      : null;
    if (rankingMode === "stable" && !retentionRoute) return;
    const alternation = routeTurnAlternationMetrics(retentionRoute?.pathIds || []);
    const retentionMetric = rankingMode === "shortest" ? distance : estimatedTime;
    sequenceSignatures.add(signature);
    sequencePool.push({
      order: order.slice(),
      distance,
      estimatedTime,
      alternatingTurnCount: alternation.alternatingTurnCount,
      alternatingTurnDistanceMm: alternation.alternatingTurnDistanceMm,
      retentionScore: retentionMetric * diversityBias
    });
    sequencePool.sort((left, right) => rankingMode === "stable"
      ? left.alternatingTurnCount - right.alternatingTurnCount
        || right.alternatingTurnDistanceMm - left.alternatingTurnDistanceMm
        || left.estimatedTime - right.estimatedTime
        || left.distance - right.distance
      : left.retentionScore - right.retentionScore || left.distance - right.distance);
    if (sequencePool.length > 120) {
      const removed = sequencePool.pop();
      sequenceSignatures.delete(removed.order.join("-"));
    }
  };

  while (activeElapsedMs < targetActiveMs && !state.optimizerCancelRequested) {
    if (state.optimizerPaused) {
      if (!pauseSnapshotShown) {
        const routes = materializeOptimizedRoutes(startId, required, graph, sequencePool, settings);
        await snapshot(routes, { activeElapsedMs, iterations, candidateCount: sequencePool.length, paused: true });
        pauseSnapshotShown = true;
      }
      await new Promise((resolve) => setTimeout(resolve, 100));
      continue;
    }

    pauseSnapshotShown = false;
    const batchStartedAt = performance.now();
    for (let batch = 0; batch < 8 && activeElapsedMs < targetActiveMs; batch += 1) {
      let order = randomizedNearestOrder(startId, requiredIds, shortestBySource, random);
      if (!order) break;
      if (sequencePool.length && random() < 0.75) {
        const base = sequencePool[Math.floor(random() * Math.min(sequencePool.length, 30))].order;
        order = destroyAndRepairOrder(startId, base, shortestBySource, random);
      }
      order = improveOrderTwoOpt(startId, order, shortestBySource, random);
      keepSequence(order);
      iterations += 1;
    }
    await new Promise((resolve) => setTimeout(resolve, 0));
    activeElapsedMs += performance.now() - batchStartedAt;
    progress({
      elapsedMs: activeElapsedMs,
      durationMs: targetActiveMs,
      iterations,
      candidateCount: sequencePool.length
    });
    if (activeElapsedMs - lastPreviewAtMs >= Math.max(1000, previewIntervalMs)) {
      const previewStartedAt = performance.now();
      const routes = materializeOptimizedRoutes(startId, required, graph, sequencePool, settings, 40);
      await snapshot(routes, {
        activeElapsedMs,
        iterations,
        candidateCount: sequencePool.length,
        paused: false
      });
      activeElapsedMs += performance.now() - previewStartedAt;
      lastPreviewAtMs = activeElapsedMs;
    }
  }

  const routes = materializeOptimizedRoutes(startId, required, graph, sequencePool, settings);

  if (!routes.length) {
    if (state.optimizerSeeds.length) {
      return { ok: false, message: "绝对局部种子与当前道路、起点或禁止即时倒车约束冲突" };
    }
    const fallback = findGreedyNoUTurnRoute(startId);
    if (!fallback.ok) return fallback;
    fallback.algorithm = "optimized";
    fallback.message = "深度候选无法满足禁止即时倒车约束，已保留快速贪心闭环";
    attachMotionProfile(fallback, settings);
    routes.push(fallback);
  }

  const wallElapsedMs = Math.round(performance.now() - startedAt);
  routes.forEach((route) => {
    route.message = `${route.message}；${state.optimizerCancelRequested ? "用户强制停止" : "搜索完成"}，${iterations} 轮，主动计算 ${Math.round(activeElapsedMs)} ms，总经过 ${wallElapsedMs} ms`;
  });
  routes[0].candidates = routes;
  return routes[0];
}

function greedyForwardRoute(startId, requiredIds, requiredIndex, graph) {
  let currentId = startId;
  let pathIds = [startId];
  let stopIds = [startId];
  let distance = 0;
  const remaining = new Set(requiredIds.filter((id) => id !== startId));

  while (remaining.size) {
    let best = null;
    remaining.forEach((targetId) => {
      const blockedIds = new Set(pathIds.slice(0, -1));
      const segmentResult = dijkstraPathAvoiding(currentId, targetId, graph, blockedIds);
      if (!Number.isFinite(segmentResult.distance) || !segmentResult.path.length) {
        return;
      }

      const nextPath = appendForwardPath(pathIds, segmentResult.path);
      if (!nextPath) {
        return;
      }

      const nextDistance = routeDistance(nextPath);
      if (!best || nextDistance < best.distance) {
        best = {
          currentId: targetId,
          distance: nextDistance,
          stopIds: [...stopIds, targetId],
          pathIds: nextPath
        };
      }
    });

    if (!best || best.currentId === currentId) {
      return null;
    }

    currentId = best.currentId;
    pathIds = best.pathIds;
    stopIds = best.stopIds;
    distance = best.distance;
    pathIds.forEach((id) => remaining.delete(id));
  }

  return { currentId, distance, stopIds, pathIds };
}

const ROUTE_CANDIDATE_COUNT = 10;
const EXACT_ROUTE_CANDIDATE_POOL_COUNT = 25;
const ROUTE_LABELS_PER_STATE = 5;
const BROWSER_ROUTE_REQUIRED_NODE_LIMIT = 170;

function insertRouteLabel(labelsByState, key, label, scoreOf) {
  const labels = labelsByState.get(key) || [];
  const score = scoreOf(label);
  if (labels.length >= ROUTE_LABELS_PER_STATE && score >= scoreOf(labels[labels.length - 1])) {
    return false;
  }

  labels.push(label);
  labels.sort((left, right) => scoreOf(left) - scoreOf(right));
  if (labels.length > ROUTE_LABELS_PER_STATE) {
    labels.pop().discarded = true;
  }
  labelsByState.set(key, labels);
  return label.discarded !== true;
}

function findShortestRequiredRoute(startId) {
  const required = state.nodes.filter((node) => node.type === 0 || node.type === 1);
  const requiredIds = required.map((node) => node.id);
  const settings = readSpeedSettings();

  if (!state.nodes.length) {
    return { ok: false, message: "没有节点可分析" };
  }

  if (!state.links.length && requiredIds.some((id) => id !== startId)) {
    return { ok: false, message: "还没有连线，无法计算路径" };
  }

  const graph = buildGraph();
  const requiredIndex = new Map(requiredIds.map((id, index) => [id, index]));

  if (!requiredIds.some((id) => id !== startId) && !(graph.get(startId) || []).length) {
    return {
      ok: true,
      exact: true,
      bounded: false,
      noBacktracking: true,
      distance: 0,
      stopIds: [startId],
      pathIds: [startId],
      edgeKeys: [],
      requiredIds: required.map((node) => node.id)
    };
  }

  const count = requiredIds.length;
  if (count > BROWSER_ROUTE_REQUIRED_NODE_LIMIT) {
    return { ok: false, message: `必经元素节点超过 ${BROWSER_ROUTE_REQUIRED_NODE_LIMIT} 个，当前浏览器规划会过大` };
  }

  const fullMask = (1n << BigInt(count)) - 1n;
  const startMask = requiredIndex.has(startId) ? 1n << BigInt(requiredIndex.get(startId)) : 0n;
  let nextLabelId = 1;
  const startState = {
    labelId: nextLabelId++, parentLabelId: 0,
    previousId: 0, currentId: startId, mask: startMask, distance: 0
  };
  const queue = new MinHeap((a, b) => a.distance - b.distance);
  const labelsByState = new Map();
  const labelsById = new Map([[startState.labelId, startState]]);

  function stateKey(previousId, currentId, mask) {
    return `${previousId}|${currentId}|${mask}`;
  }

  queue.push(startState);
  insertRouteLabel(labelsByState, stateKey(0, startId, startMask), startState, (label) => label.distance);

  const expansionLimit = 450000;
  const timeLimitMs = 1800;
  const startedAt = performance.now();
  let expansions = 0;
  let bounded = false;
  const candidates = [];
  const candidateSignatures = new Set();

  function resultFromEndState(endState, message = "") {
    const reversedPath = [];
    let label = endState;
    while (label) {
      reversedPath.push(label.currentId);
      label = labelsById.get(label.parentLabelId);
    }
    const pathIds = reversedPath.reverse();
    const stopIds = pathIds.filter((id, index) => {
      return index === 0 || requiredIndex.has(id);
    });
    const profile = buildRouteMotionProfile(pathIds, settings);

    return makeRouteResult(
      {
        distance: endState.distance,
        effectiveDistanceMm: profile.effectiveDistanceMm,
        timeSeconds: profile.timeSeconds,
        turnCount: profile.turnCount,
        speedSettings: settings,
        speedPieces: profile.pieces,
        plannedPathPoints: profile.plannedPoints,
        alternatingTurnTransitions: profile.alternatingTurnTransitions,
        stopIds,
        pathIds
      },
      required,
      true,
      false,
      message,
      "exact"
    );
  }

  while (queue.size && expansions < expansionLimit) {
    if (performance.now() - startedAt > timeLimitMs) {
      bounded = true;
      break;
    }

    const current = queue.pop();
    if (current.discarded === true) {
      continue;
    }
    expansions += 1;

    if (current.mask === fullMask && current.currentId === startId && current.previousId !== 0) {
      const result = resultFromEndState(current);
      const signature = result.pathIds.join("-");
      if (!candidateSignatures.has(signature)) {
        candidateSignatures.add(signature);
        candidates.push(result);
      }
      if (candidates.length >= EXACT_ROUTE_CANDIDATE_POOL_COUNT) {
        break;
      }
      continue;
    }

    (graph.get(current.currentId) || []).forEach((edge) => {
      if (edge.toId === current.previousId) {
        return;
      }

      let nextMask = current.mask;
      if (requiredIndex.has(edge.toId)) {
        nextMask |= 1n << BigInt(requiredIndex.get(edge.toId));
      }

      const nextDistance = current.distance + edge.weight;
      const nextKey = stateKey(current.currentId, edge.toId, nextMask);
      const nextState = {
        labelId: nextLabelId++,
        parentLabelId: current.labelId,
        previousId: current.currentId,
        currentId: edge.toId,
        mask: nextMask,
        distance: nextDistance
      };
      if (insertRouteLabel(labelsByState, nextKey, nextState, (label) => label.distance)) {
        labelsById.set(nextState.labelId, nextState);
        queue.push(nextState);
      }
    });
  }

  if (expansions >= expansionLimit) {
    bounded = true;
  }

  if (!candidates.length) {
    const elapsedMs = Math.round(performance.now() - startedAt);
    const limitReason = expansions >= expansionLimit
      ? `达到 ${expansionLimit} 次状态扩展上限`
      : `达到 ${timeLimitMs} ms 搜索时间上限`;
    return {
      ok: false,
      message: bounded
        ? `精确搜索受限：${count} 个必经节点，${limitReason}（实际 ${elapsedMs} ms、${expansions} 次）；不是 ${BROWSER_ROUTE_REQUIRED_NODE_LIMIT} 个节点数量上限，可改用快速贪心`
        : "没有找到禁止即时倒车、经过所有元素节点并回到起点的路线"
    };
  }

  if (bounded) {
    candidates.forEach((route) => {
      route.exact = false;
      route.bounded = true;
      route.message = "搜索已限时，候选路线可能不是完整候选集";
    });
  }

  candidates.sort((left, right) =>
    left.alternatingTurnCount - right.alternatingTurnCount
    || right.alternatingTurnDistanceMm - left.alternatingTurnDistanceMm
    || left.distance - right.distance
  );
  candidates.length = Math.min(candidates.length, ROUTE_CANDIDATE_COUNT);
  candidates[0].candidates = candidates;
  return candidates[0];
}

  const graph = buildGraph();
  const requiredIndex = new Map(requiredIds.map((id, index) => [id, index]));

  if (!requiredIds.some((id) => id !== startId) && !(graph.get(startId) || []).length) {

      {
        distance: 0,

        turnCount: 0,

  let nextLabelId = 1;
  const startState = {
    labelId: nextLabelId++,
    parentLabelId: 0,
    previousId: 0,
    currentId: startId,
    firstNextId: 0,
    mask: startMask,
    distance: 0,
    effectiveDistanceMm: 0,
    timeSeconds: 0,
    turnCount: 0
  };
  const queue = new MinHeap((a, b) => a.timeSeconds - b.timeSeconds);
  const labelsByState = new Map();
  const labelsById = new Map([[startState.labelId, startState]]);

  function stateKey(previousId, currentId, mask, firstNextId) {

  }

  queue.push(startState);
  insertRouteLabel(
    labelsByState,
    stateKey(0, startId, startMask, 0),
    startState,
    (label) => label.timeSeconds
  );

  const expansionLimit = 450000;
  const timeLimitMs = 1800;
  const startedAt = performance.now();
  let expansions = 0;
  let bounded = false;
  const candidates = [];
  const candidateSignatures = new Set();

  function resultFromEndState(endState, message = "") {

    let label = endState;
    while (label) {

    }

    const stopIds = pathIds.filter((id, index) => {
      return index === 0 || requiredIndex.has(id);
    });
    const profile = buildRouteMotionProfile(pathIds, settings);

    return makeRouteResult(
      {
        distance: endState.distance,
        effectiveDistanceMm: profile.effectiveDistanceMm,
        timeSeconds: profile.timeSeconds,
        turnCount: profile.turnCount,
        speedSettings: settings,
        speedPieces: profile.pieces,
        plannedPathPoints: profile.plannedPoints,
        alternatingTurnTransitions: profile.alternatingTurnTransitions,
        stopIds,
        pathIds
      },
      required,
      true,
      false,
      message,
      "fastest"
    );
  }

  while (queue.size && expansions < expansionLimit) {
    if (performance.now() - startedAt > timeLimitMs) {
      bounded = true;
      break;
    }

    const current = queue.pop();
    if (current.discarded === true) {
      continue;
    }
    expansions += 1;

    if (current.mask === fullMask && current.currentId === startId && current.previousId !== 0) {
      const result = resultFromEndState(current);
      const signature = result.pathIds.join("-");
      if (!candidateSignatures.has(signature)) {
        candidateSignatures.add(signature);
        candidates.push(result);
      }
      if (candidates.length >= ROUTE_CANDIDATE_COUNT) {
        break;
      }
      continue;
    }

    (graph.get(current.currentId) || []).forEach((edge) => {
      if (edge.toId === current.previousId) {
        return;
      }

      let nextMask = current.mask;
      if (requiredIndex.has(edge.toId)) {
        nextMask |= 1n << BigInt(requiredIndex.get(edge.toId));
      }

      const cost = fastestTransitionCost(
        current.previousId,
        current.currentId,
        edge.toId,
        edge.weight,
        settings
      );
      const nextFirstNextId = current.firstNextId || (
        current.previousId === 0 && current.currentId === startId ? edge.toId : 0
      );
      const closesRoute = edge.toId === startId && nextMask === fullMask && nextFirstNextId;
      if (closesRoute && current.currentId === nextFirstNextId) {
        return;
      }
      const closingCost = closesRoute
        ? fastestClosingTurnCost(current.currentId, startId, nextFirstNextId, settings)
        : { seconds: 0, turnCount: 0, effectiveDistanceMm: 0 };
      const nextTime = current.timeSeconds + cost.seconds + closingCost.seconds;
      const nextDistance = current.distance + edge.weight;
      const nextEffectiveDistance = Math.max(0, current.effectiveDistanceMm + cost.effectiveDistanceMm + closingCost.effectiveDistanceMm);
      const nextTurnCount = current.turnCount + cost.turnCount + closingCost.turnCount;
      const nextKey = stateKey(current.currentId, edge.toId, nextMask, nextFirstNextId);
      const nextState = {
        labelId: nextLabelId++,
        parentLabelId: current.labelId,
        previousId: current.currentId,
        currentId: edge.toId,
        firstNextId: nextFirstNextId,
        mask: nextMask,
        distance: nextDistance,
        effectiveDistanceMm: nextEffectiveDistance,
        timeSeconds: nextTime,
        turnCount: nextTurnCount
      };
      if (insertRouteLabel(labelsByState, nextKey, nextState, (label) => label.timeSeconds)) {
        labelsById.set(nextState.labelId, nextState);
        queue.push(nextState);
      }
    });
  }

  if (expansions >= expansionLimit) {
    bounded = true;
  }

  if (!candidates.length) {
    const elapsedMs = Math.round(performance.now() - startedAt);
    const limitReason = expansions >= expansionLimit
      ? `达到 ${expansionLimit} 次状态扩展上限`
      : `达到 ${timeLimitMs} ms 搜索时间上限`;
    return {

        : "没有找到禁止即时倒车、经过所有元素节点并回到起点的最快路线"
    };

  candidates.sort((left, right) => left.timeSeconds - right.timeSeconds);
  candidates.length = Math.min(candidates.length, ROUTE_CANDIDATE_COUNT);

  if (bounded) {
    candidates.forEach((route) => {
      route.exact = false;
      route.bounded = true;
      route.message = "搜索已限时，候选路线可能不是完整候选集";
    });
  }

  candidates[0].candidates = candidates;
  return candidates[0];
